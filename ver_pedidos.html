<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>📝 Histórico de Pedidos</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

  <!-- Tabulator -->
  <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111827;
      color: #f3f4f6;
      min-height: 100vh;
    }

    .container {
      width: 98%;
      max-width: 1900px;
      margin: 20px auto;
    }

    .topo {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .titulo-area h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .utilizador {
      color: #9ca3af;
      font-size: 13px;
    }

    .botoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn-warning {
      background: #d97706;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #4b5563;
      color: white;
    }

    .painel {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .filtros {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filtros input {
      background: #111827;
      color: white;
      border: 1px solid #4b5563;
      border-radius: 7px;
      padding: 9px 12px;
      min-width: 250px;
      outline: none;
    }

    .filtros input:focus {
      border-color: #2563eb;
    }

    .estado-info {
      color: #9ca3af;
      font-size: 13px;
      margin-left: auto;
    }

    #tabela-pedidos {
      width: 100%;
    }

    .tabulator {
      border: 1px solid #374151;
      border-radius: 8px;
      overflow: hidden;
      font-size: 12px;
    }

    .tabulator .tabulator-header {
      background: #111827;
    }

    .tabulator .tabulator-header .tabulator-col {
      background: #111827;
      border-right: 1px solid #374151;
    }

    .tabulator .tabulator-row {
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }

    .tabulator .tabulator-row.tabulator-row-even {
      background: #172033;
    }

    .tabulator .tabulator-cell {
      border-right: 1px solid #374151;
    }

    .campo-derivado {
      background: #263244 !important;
      color: #cbd5e1 !important;
    }

    .campo-derivado::after {
      content: " 🔒";
      opacity: 0.7;
    }

    .acoes {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .btn-mini {
      padding: 5px 8px;
      font-size: 11px;
    }

    #calendario {
      margin-top: 15px;
      background: #1f2937;
      border-radius: 10px;
      padding: 10px;
    }

    .fc {
      color: #e5e7eb;
    }

    .fc-theme-standard td,
    .fc-theme-standard th {
      border-color: #374151;
    }

    .fc .fc-toolbar-title {
      font-size: 20px;
    }

    .fc .fc-button {
      background: #2563eb;
      border-color: #2563eb;
    }

    .fc .fc-button:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .fc .fc-daygrid-day {
      background: #1f2937;
    }

    .fc .fc-daygrid-day.fc-day-today {
      background: #263244;
    }

    .modal-fundo {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 700px;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 12px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 15px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-campo {
      margin-bottom: 10px;
    }

    .modal-campo.full {
      grid-column: 1 / -1;
    }

    .modal-campo label {
      display: block;
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .modal-campo div {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px;
      min-height: 34px;
    }

    .modal-fecho {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .contador {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #374151;
      font-size: 11px;
    }

    .estado-pendente {
      color: #fbbf24;
      font-weight: bold;
    }

    .estado-concluido {
      color: #4ade80;
      font-weight: bold;
    }

    .estado-cancelado {
      color: #f87171;
      font-weight: bold;
    }

    @media (max-width: 900px) {
      .modal-grid {
        grid-template-columns: 1fr;
      }

      .modal-campo.full {
        grid-column: auto;
      }

      .estado-info {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topo">
    <div class="titulo-area">
      <h1>📝 Histórico de Pedidos</h1>
      <div class="utilizador">
        Utilizador: <span id="utilizador-info">A carregar...</span>
      </div>
    </div>

    <div class="botoes">
      <button class="btn-primary" onclick="novoPedido()">
        ➕ Novo Pedido
      </button>

      <button class="btn-warning" onclick="alternarConcluidos()">
        👁️ Mostrar/Esconder Concluídos
      </button>

      <button class="btn-success" onclick="guardarAlteracoes()">
        💾 Guardar Alterações
      </button>

      <button class="btn-secondary" onclick="window.location.href='index.html'">
        ↩️ Voltar
      </button>
    </div>
  </div>


  <div class="painel">

    <div class="filtros">

      <input
        type="text"
        id="pesquisa"
        placeholder="🔎 Pesquisar pedidos..."
      >

      <span class="estado-info" id="estado-info">
        A carregar...
      </span>

    </div>

  </div>


  <div class="painel">

    <div id="tabela-pedidos"></div>

  </div>


  <div class="painel">

    <h2 style="margin-bottom: 10px;">
      📅 Calendário
    </h2>

    <div id="calendario"></div>

  </div>

</div>


<!-- Modal do evento -->
<div class="modal-fundo" id="modal-evento">

  <div class="modal">

    <h2>📋 Detalhes do Pedido</h2>

    <div class="modal-grid">

      <div class="modal-campo">
        <label>Técnico</label>
        <div id="modal-tecnico"></div>
      </div>

      <div class="modal-campo">
        <label>Estado</label>
        <div id="modal-estado"></div>
      </div>

      <div class="modal-campo">
        <label>Nº Obra</label>
        <div id="modal-numero-obra"></div>
      </div>

      <div class="modal-campo">
        <label>Empresa</label>
        <div id="modal-empresa"></div>
      </div>

      <div class="modal-campo">
        <label>Local / Obra</label>
        <div id="modal-local-obra"></div>
      </div>

      <div class="modal-campo">
        <label>Concelho</label>
        <div id="modal-concelho"></div>
      </div>

      <div class="modal-campo">
        <label>Requerente</label>
        <div id="modal-requerente"></div>
      </div>

      <div class="modal-campo">
        <label>Importância</label>
        <div id="modal-importancia"></div>
      </div>

      <div class="modal-campo full">
        <label>Serviço</label>
        <div id="modal-servico"></div>
      </div>

      <div class="modal-campo full">
        <label>Observação</label>
        <div id="modal-observacao"></div>
      </div>

      <div class="modal-campo">
        <label>Data do Pedido</label>
        <div id="modal-data-pedido"></div>
      </div>

      <div class="modal-campo">
        <label>Data Limite</label>
        <div id="modal-data-limite"></div>
      </div>

      <div class="modal-campo">
        <label>Data Agendada</label>
        <div id="modal-data-agendada"></div>
      </div>

      <div class="modal-campo">
        <label>Data Conclusão</label>
        <div id="modal-data-conclusao"></div>
      </div>

    </div>

    <div class="modal-fecho">
      <button class="btn-secondary" onclick="fecharModal()">
        Fechar
      </button>
    </div>

  </div>

</div>


<script>

  /* =========================================================
     SUPABASE
     ========================================================= */

  const supabaseUrl = 'https://dunondjiqawovisnwavg.supabase.co';

  const supabaseKey =
    'sb_publishable_WekrBSs5JOjnJ1SGxFvmKQ_3v6AnBMs';
  const sbClient = supabase.createClient(
    supabaseUrl,
    supabaseKey.replace(/\s/g, '')
  );


  /* =========================================================
     VARIÁVEIS
     ========================================================= */

  let tabelaPedidos = null;
  let calendario = null;

  let pedidos = [];
  let obras = [];

  let mapaObras = {};

  let mostrarConcluidos = false;

  let snapshotPedidos = {};

  let atividadesPorPedido = {};
  let ocorrenciasPorPedido = {};


  /* =========================================================
     CAMPOS QUE REALMENTE EXISTEM / SÃO GUARDADOS EM PEDIDOS
     
     IMPORTANTE:
     empresa1
     local_obra1
     concelho1
     numero_obra1

     NÃO são usados como origem dos dados da obra.

     A obra é determinada através de:
     
     pedidos.obra_id -> obras.id
     ========================================================= */

  const CAMPOS_GUARDAVEIS = [
    'tecnico',
    'data_hora_pedido',
    'requerente',
    'importancia',
    'via',
    'servico',
    'observacao',
    'tipo_trabalho',
    'frequencia',
    'data_hora_limite',
    'estado',
    'data_conclusao',
    'data_agendada',
    'obra_id'
  ];


  /* =========================================================
     INICIALIZAÇÃO
     ========================================================= */

  document.addEventListener('DOMContentLoaded', async () => {

    try {

      const {
        data: { session },
        error
      } = await sbClient.auth.getSession();

      if (error) {
        console.error('Erro ao verificar sessão:', error);
        window.location.href = 'login.html';
        return;
      }

      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('utilizador-info').innerText =
        session.user.email || 'Utilizador';

      await inicializar();

    } catch (erro) {

      console.error('Erro na inicialização:', erro);

      alert(
        'Ocorreu um erro ao carregar a página.\n\n' +
        (erro.message || erro)
      );
    }

  });


  /* =========================================================
     INICIALIZAR
     ========================================================= */

  async function inicializar() {

    await carregarObras();

    await carregarDadosRelacionados();

    await carregarPedidos();

    criarTabela();

    criarCalendario();

    atualizarPesquisa();

    atualizarInformacao();

  }


  /* =========================================================
     CARREGAR OBRAS
     
     É AQUI QUE É FEITA A RELAÇÃO:
     
     obras.id
          ↓
     pedidos.obra_id
     
     ========================================================= */

  async function carregarObras() {

    const { data, error } = await sbClient
      .from('obras')
      .select(`
        id,
        numero_obra,
        empresa,
        local_obra,
        concelho
      `)
      .order('numero_obra', {
        ascending: true
      });

    if (error) {

      console.error('Erro ao carregar obras:', error);

      throw new Error(
        'Não foi possível carregar a tabela "obras".\n\n' +
        error.message
      );
    }

    obras = data || [];

    mapaObras = {};

    obras.forEach(obra => {

      mapaObras[String(obra.id)] = obra;

    });

    console.log('Obras carregadas:', obras.length);

  }


  /* =========================================================
     CARREGAR ATIVIDADES E OCORRÊNCIAS
     ========================================================= */

  async function carregarDadosRelacionados() {

    atividadesPorPedido = {};
    ocorrenciasPorPedido = {};

    /*
      ATIVIDADES
    */

    const resultadoAtividades = await sbClient
      .from('atividades')
      .select('*');

    if (!resultadoAtividades.error) {

      (resultadoAtividades.data || []).forEach(item => {

        const pedidoId =
          item.pedido_id ??
          item.id_pedido ??
          item.pedido;

        if (pedidoId == null) return;

        const chave = String(pedidoId);

        if (!atividadesPorPedido[chave]) {
          atividadesPorPedido[chave] = 0;
        }

        atividadesPorPedido[chave]++;

      });

    } else {

      console.warn(
        'Não foi possível carregar atividades:',
        resultadoAtividades.error
      );

    }


    /*
      OCORRÊNCIAS
    */

    const resultadoOcorrencias = await sbClient
      .from('ocorrencias')
      .select('*');

    if (!resultadoOcorrencias.error) {

      (resultadoOcorrencias.data || []).forEach(item => {

        const pedidoId =
          item.pedido_id ??
          item.id_pedido ??
          item.pedido;

        if (pedidoId == null) return;

        const chave = String(pedidoId);

        if (!ocorrenciasPorPedido[chave]) {
          ocorrenciasPorPedido[chave] = 0;
        }

        ocorrenciasPorPedido[chave]++;

      });

    } else {

      console.warn(
        'Não foi possível carregar ocorrências:',
        resultadoOcorrencias.error
      );

    }

  }


  /* =========================================================
     APLICAR DADOS DA OBRA
     
     IMPORTANTE:
     
     NÃO usamos:
       numero_obra1
       empresa1
       local_obra1
       concelho1
     
     como origem.
     
     A origem é SEMPRE:
     
       pedido.obra_id
             ↓
       obras.id
     
     ========================================================= */

  function aplicarDadosDaObra(pedido) {

    const obraId =
      pedido.obra_id != null
        ? String(pedido.obra_id)
        : null;

    const obra =
      obraId
        ? mapaObras[obraId]
        : null;

    if (obra) {

      pedido.numero_obra =
        obra.numero_obra || '';

      pedido.empresa =
        obra.empresa || '';

      pedido.local_obra =
        obra.local_obra || '';

      pedido.concelho =
        obra.concelho || '';

    } else {

      pedido.numero_obra = '';
      pedido.empresa = '';
      pedido.local_obra = '';
      pedido.concelho = '';

    }

    return pedido;
  }


  /* =========================================================
     CARREGAR PEDIDOS
     ========================================================= */

  async function carregarPedidos() {

    const { data, error } = await sbClient
      .from('pedidos')
      .select('*')
      .order('id', {
        ascending: false
      });

    if (error) {

      console.error('Erro ao carregar pedidos:', error);

      throw new Error(
        'Não foi possível carregar os pedidos.\n\n' +
        error.message
      );
    }

    pedidos = (data || []).map(pedido => {

      aplicarDadosDaObra(pedido);

      pedido.atividades_count =
        atividadesPorPedido[String(pedido.id)] || 0;

      pedido.ocorrencias_count =
        ocorrenciasPorPedido[String(pedido.id)] || 0;

      return pedido;

    });


    /*
      Criar snapshot apenas dos campos que realmente são
      guardados na tabela pedidos.
    */

    snapshotPedidos = {};

    pedidos.forEach(pedido => {

      snapshotPedidos[pedido.id] =
        criarSnapshot(pedido);

    });

  }


  /* =========================================================
     SNAPSHOT
     ========================================================= */

  function criarSnapshot(pedido) {

    const resultado = {};

    CAMPOS_GUARDAVEIS.forEach(campo => {

      resultado[campo] =
        pedido[campo] ?? null;

    });

    return JSON.stringify(resultado);

  }


  /* =========================================================
     LISTA DE OBRAS PARA EDITOR
     ========================================================= */

  function obterValoresObras() {

    const valores = {};

    obras.forEach(obra => {

      valores[String(obra.id)] =
        obra.numero_obra || `Obra ${obra.id}`;

    });

    return valores;

  }


  /* =========================================================
     CRIAR TABELA
     ========================================================= */

  function criarTabela() {

    tabelaPedidos = new Tabulator(
      '#tabela-pedidos',
      {

        height: '650px',

        layout: 'fitDataStretch',

        responsiveLayout: false,

        movableColumns: true,

        pagination: true,

        paginationMode: 'local',

        paginationSize: 15,

        paginationSizeSelector: [
          15,
          30,
          50,
          100
        ],

        placeholder: 'Não existem pedidos.',

        data: obterPedidosVisiveis(),

        columns: [

          {
            title: 'Técnico',
            field: 'tecnico',
            editor: 'input',
            width: 140
          },

          {
            title: 'Data Pedido',
            field: 'data_hora_pedido',
            editor: 'datetime',
            width: 150,
            formatter: formatarData
          },

          {
            title: 'Requerente',
            field: 'requerente',
            editor: 'input',
            width: 150
          },


          /* =================================================
             EMPRESA
             VEM DA TABELA OBRAS
             ================================================= */

          {
            title: 'Empresa',
            field: 'empresa',
            width: 160,
            cssClass: 'campo-derivado',
            editable: false
          },


          {
            title: 'Importância',
            field: 'importancia',
            editor: 'input',
            width: 110
          },

          {
            title: 'Via',
            field: 'via',
            editor: 'input',
            width: 100
          },


          /* =================================================
             LOCAL / OBRA
             VEM DA TABELA OBRAS
             ================================================= */

          {
            title: 'Local / Obra',
            field: 'local_obra',
            width: 180,
            cssClass: 'campo-derivado',
            editable: false
          },


          /* =================================================
             Nº OBRA
             VEM DA TABELA OBRAS
             
             O utilizador escolhe a OBRA.
             Ao escolher, obra_id é alterado.
             ================================================= */

          {
            title: 'Nº Obra',
            field: 'obra_id',
            width: 130,

            editor: 'list',

            editorParams: function () {

              return {

                values: obterValoresObras(),

                autocomplete: true,

                listOnEmpty: true,

                clearable: true,

                itemFormatter: function (
                  label,
                  value
                ) {

                  const obra =
                    mapaObras[String(value)];

                  if (!obra) {
                    return label;
                  }

                  return `
                    <div>
                      <strong>${escapeHtml(
                        obra.numero_obra || ''
                      )}</strong>
                      <br>
                      <small>
                        ${escapeHtml(
                          obra.local_obra || ''
                        )}
                        ${
                          obra.empresa
                            ? ' — ' +
                              escapeHtml(
                                obra.empresa
                              )
                            : ''
                        }
                      </small>
                    </div>
                  `;

                }

              };

            },

            formatter: function (
              cell
            ) {

              const obraId =
                cell.getValue();

              const obra =
                mapaObras[String(obraId)];

              return obra
                ? escapeHtml(
                    obra.numero_obra || ''
                  )
                : '';

            },

            cellEdited: function (cell) {

              atualizarDadosObraDaLinha(cell);

            }

          },


          /* =================================================
             CONCELHO
             VEM DA TABELA OBRAS
             ================================================= */

          {
            title: 'Concelho',
            field: 'concelho',
            width: 130,
            cssClass: 'campo-derivado',
            editable: false
          },


          {
            title: 'Serviço',
            field: 'servico',
            editor: 'input',
            width: 180
          },

          {
            title: 'Obs',
            field: 'observacao',
            editor: 'input',
            width: 220
          },

          {
            title: 'Tipo',
            field: 'tipo_trabalho',
            editor: 'input',
            width: 120
          },

          {
            title: 'Freq',
            field: 'frequencia',
            editor: 'input',
            width: 90
          },

          {
            title: 'Limite',
            field: 'data_hora_limite',
            editor: 'datetime',
            width: 150,
            formatter: formatarData
          },

          {
            title: 'Estado',
            field: 'estado',
            editor: 'list',

            editorParams: {
              values: {
                'Pendente': 'Pendente',
                'Em curso': 'Em curso',
                'Concluído': 'Concluído',
                'Cancelado': 'Cancelado'
              }
            },

            width: 120,

            formatter: function (cell) {

              const valor =
                cell.getValue() || '';

              const span =
                document.createElement('span');

              span.textContent = valor;

              if (valor === 'Concluído') {
                span.className =
                  'estado-concluido';
              }

              else if (valor === 'Cancelado') {
                span.className =
                  'estado-cancelado';
              }

              else {
                span.className =
                  'estado-pendente';
              }

              return span;

            }

          },

          {
            title: 'Data Conclusão',
            field: 'data_conclusao',
            editor: 'datetime',
            width: 150,
            formatter: formatarData
          },

          {
            title: 'Atividades',
            field: 'atividades_count',
            width: 90,
            hozAlign: 'center',

            formatter: function (cell) {

              return `
                <span class="contador">
                  ${cell.getValue() || 0}
                </span>
              `;

            },

            editable: false
          },

          {
            title: 'Ocorrências',
            field: 'ocorrencias_count',
            width: 90,
            hozAlign: 'center',

            formatter: function (cell) {

              return `
                <span class="contador">
                  ${cell.getValue() || 0}
                </span>
              `;

            },

            editable: false
          },

          {
            title: 'Ações',
            width: 110,
            hozAlign: 'center',
            headerSort: false,

            formatter: function () {

              return `
                <div class="acoes">
                  <button
                    class="btn-danger btn-mini"
                    title="Eliminar"
                  >
                    🗑️
                  </button>
                </div>
              `;

            },

            cellClick: function (
              e,
              cell
            ) {

              const target =
                e.target.closest('button');

              if (!target) return;

              const pedido =
                cell.getRow().getData();

              eliminarPedido(pedido);

            }

          }

        ]

      }
    );


    /*
      Quando uma célula é editada, actualizar a informação
      da obra e marcar o pedido como alterado.
    */

    tabelaPedidos.on(
      'cellEdited',
      function (cell) {

        if (
          cell.getField() !== 'obra_id'
        ) {

          atualizarInformacao();

        }

        atualizarInformacao();

      }
    );

  }


  /* =========================================================
     ACTUALIZAR DADOS DA OBRA NA LINHA
     ========================================================= */

  function atualizarDadosObraDaLinha(cell) {

    const row =
      cell.getRow();

    const dados =
      row.getData();

    const obraId =
      dados.obra_id;

    const obra =
      obraId != null
        ? mapaObras[String(obraId)]
        : null;

    if (obra) {

      dados.numero_obra =
        obra.numero_obra || '';

      dados.empresa =
        obra.empresa || '';

      dados.local_obra =
        obra.local_obra || '';

      dados.concelho =
        obra.concelho || '';

    } else {

      dados.numero_obra = '';
      dados.empresa = '';
      dados.local_obra = '';
      dados.concelho = '';

    }

    row.update({

      numero_obra:
        dados.numero_obra,

      empresa:
        dados.empresa,

      local_obra:
        dados.local_obra,

      concelho:
        dados.concelho

    });

    atualizarCalendario();

    atualizarInformacao();

  }


  /* =========================================================
     PEDIDOS VISÍVEIS
     ========================================================= */

  function obterPedidosVisiveis() {

    if (mostrarConcluidos) {
      return pedidos;
    }

    return pedidos.filter(pedido => {

      return (
        pedido.estado !== 'Concluído' &&
        pedido.estado !== 'Cancelado'
      );

    });

  }


  /* =========================================================
     ALTERNAR CONCLUÍDOS
     ========================================================= */

  function alternarConcluidos() {

    mostrarConcluidos =
      !mostrarConcluidos;

    tabelaPedidos.setData(
      obterPedidosVisiveis()
    );

    atualizarInformacao();

  }


  /* =========================================================
     PESQUISA
     ========================================================= */

  function atualizarPesquisa() {

    const input =
      document.getElementById(
        'pesquisa'
      );

    input.addEventListener(
      'input',
      function () {

        const texto =
          this.value
            .trim()
            .toLowerCase();

        if (!texto) {

          tabelaPedidos.setData(
            obterPedidosVisiveis()
          );

          return;

        }

        const filtrados =
          obterPedidosVisiveis()
            .filter(pedido => {

              return Object.values(pedido)
                .some(valor => {

                  return String(
                    valor ?? ''
                  )
                    .toLowerCase()
                    .includes(texto);

                });

            });

        tabelaPedidos.setData(
          filtrados
        );

      }
    );

  }


  /* =========================================================
     GUARDAR ALTERAÇÕES
     ========================================================= */

  async function guardarAlteracoes() {

    const linhas =
      tabelaPedidos.getRows();

    let alterados = 0;

    let erros = 0;

    for (const row of linhas) {

      const pedido =
        row.getData();

      const id =
        pedido.id;

      if (!id) {
        continue;
      }

      /*
        Garantir novamente que os dados da obra estão
        sincronizados com obra_id antes de guardar.
      */

      aplicarDadosDaObra(pedido);

      const snapshotAtual =
        criarSnapshot(pedido);

      if (
        snapshotPedidos[id] ===
        snapshotAtual
      ) {
        continue;
      }

      /*
        IMPORTANTE:
        Nunca enviamos empresa1,
        local_obra1,
        concelho1 ou numero_obra1.

        A única referência à obra guardada é obra_id.
      */

      const dadosGuardar = {

        tecnico:
          pedido.tecnico ?? null,

        data_hora_pedido:
          converterDataParaSupabase(
            pedido.data_hora_pedido
          ),

        requerente:
          pedido.requerente ?? null,

        importancia:
          pedido.importancia ?? null,

        via:
          pedido.via ?? null,

        servico:
          pedido.servico ?? null,

        observacao:
          pedido.observacao ?? null,

        tipo_trabalho:
          pedido.tipo_trabalho ?? null,

        frequencia:
          pedido.frequencia ?? null,

        data_hora_limite:
          converterDataParaSupabase(
            pedido.data_hora_limite
          ),

        estado:
          pedido.estado ?? null,

        data_conclusao:
          converterDataParaSupabase(
            pedido.data_conclusao
          ),

        data_agendada:
          converterDataParaSupabase(
            pedido.data_agendada
          ),

        obra_id:
          pedido.obra_id != null
            ? Number(pedido.obra_id)
            : null

      };


      const {
        error
      } = await sbClient
        .from('pedidos')
        .update(dadosGuardar)
        .eq('id', id);


      if (error) {

        console.error(
          `Erro ao guardar pedido ${id}:`,
          error
        );

        erros++;

        continue;

      }

      alterados++;

      snapshotPedidos[id] =
        criarSnapshot(pedido);

    }


    if (erros > 0) {

      alert(
        `Foram guardados ${alterados} pedido(s), ` +
        `mas ocorreram ${erros} erro(s).`
      );

    } else {

      alert(
        alterados > 0
          ? `Foram guardados ${alterados} pedido(s).`
          : 'Não existem alterações para guardar.'
      );

    }


    /*
      Recarregar tudo para garantir que a informação
      apresentada corresponde à base de dados.
    */

    if (alterados > 0) {

      await carregarObras();

      await carregarDadosRelacionados();

      await carregarPedidos();

      tabelaPedidos.setData(
        obterPedidosVisiveis()
      );

      atualizarCalendario();

      atualizarInformacao();

    }

  }


  /* =========================================================
     NOVO PEDIDO
     ========================================================= */

  async function novoPedido() {

    /*
      Redirecciona para a página existente de registo.
    */

    window.location.href =
      'registo_pedidos.html';

  }


  /* =========================================================
     ELIMINAR PEDIDO
     ========================================================= */

  async function eliminarPedido(pedido) {

    if (!pedido || !pedido.id) {
      return;
    }

    const confirmar =
      confirm(
        `Tem a certeza que pretende eliminar o pedido #${pedido.id}?`
      );

    if (!confirmar) {
      return;
    }


    const {
      error
    } = await sbClient
      .from('pedidos')
      .delete()
      .eq('id', pedido.id);


    if (error) {

      console.error(
        'Erro ao eliminar pedido:',
        error
      );

      alert(
        'Não foi possível eliminar o pedido.\n\n' +
        error.message
      );

      return;

    }


    pedidos =
      pedidos.filter(
        item => item.id !== pedido.id
      );

    delete snapshotPedidos[pedido.id];

    tabelaPedidos.setData(
      obterPedidosVisiveis()
    );

    atualizarCalendario();

    atualizarInformacao();

  }


  /* =========================================================
     CALENDÁRIO
     ========================================================= */

  function criarCalendario() {

    const elemento =
      document.getElementById(
        'calendario'
      );

    calendario =
      new FullCalendar.Calendar(
        elemento,
        {

          initialView:
            'dayGridMonth',

          locale:
            'pt-br',

          firstDay: 1,

          height: 'auto',

          headerToolbar: {

            left:
              'prev,next today',

            center:
              'title',

            right:
              'dayGridMonth,timeGridWeek,listMonth'

          },

          buttonText: {

            today:
              'Hoje',

            month:
              'Mês',

            week:
              'Semana',

            list:
              'Lista'

          },

          events:
            criarEventosCalendario(),

          eventClick:
            function(info) {

              const pedidoId =
                info.event.extendedProps
                  .pedidoId;

              const pedido =
                pedidos.find(
                  item =>
                    String(item.id) ===
                    String(pedidoId)
                );

              if (pedido) {
                abrirModalPedido(
                  pedido
                );
              }

            }

        }
      );

    calendario.render();

  }


  /* =========================================================
     CRIAR EVENTOS
     ========================================================= */

  function criarEventosCalendario() {

    return pedidos
      .filter(pedido => {

        return (
          pedido.data_agendada ||
          pedido.data_hora_limite ||
          pedido.data_conclusao
        );

      })
      .map(pedido => {

        /*
          Preferência:
          data_agendada
          depois data limite
          depois conclusão
        */

        const data =
          pedido.data_agendada ||
          pedido.data_hora_limite ||
          pedido.data_conclusao;

        const obra =
          pedido.obra_id != null
            ? mapaObras[
                String(pedido.obra_id)
              ]
            : null;


        const numeroObra =
          obra?.numero_obra || '';

        const localObra =
          obra?.local_obra || '';

        let titulo =
          '';

        if (numeroObra) {

          titulo +=
            `🏗️ ${numeroObra}`;

        }

        if (localObra) {

          titulo +=
            titulo
              ? ` — ${localObra}`
              : localObra;

        }

        if (!titulo) {

          titulo =
            `Pedido #${pedido.id}`;

        }


        if (pedido.tecnico) {

          titulo +=
            ` | ${pedido.tecnico}`;

        }


        return {

          id:
            `pedido-${pedido.id}`,

          title:
            titulo,

          start:
            data,

          allDay:
            false,

          extendedProps: {

            pedidoId:
              pedido.id

          }

        };

      });

  }


  /* =========================================================
     ACTUALIZAR CALENDÁRIO
     ========================================================= */

  function atualizarCalendario() {

    if (!calendario) {
      return;
    }

    calendario.removeAllEvents();

    calendario.addEventSource(
      criarEventosCalendario()
    );

  }


  /* =========================================================
     MODAL
     ========================================================= */

  function abrirModalPedido(pedido) {

    aplicarDadosDaObra(pedido);

    document.getElementById(
      'modal-tecnico'
    ).innerText =
      pedido.tecnico || '';

    document.getElementById(
      'modal-estado'
    ).innerText =
      pedido.estado || '';

    document.getElementById(
      'modal-numero-obra'
    ).innerText =
      pedido.numero_obra || '';

    document.getElementById(
      'modal-empresa'
    ).innerText =
      pedido.empresa || '';

    document.getElementById(
      'modal-local-obra'
    ).innerText =
      pedido.local_obra || '';

    document.getElementById(
      'modal-concelho'
    ).innerText =
      pedido.concelho || '';

    document.getElementById(
      'modal-requerente'
    ).innerText =
      pedido.requerente || '';

    document.getElementById(
      'modal-importancia'
    ).innerText =
      pedido.importancia || '';

    document.getElementById(
      'modal-servico'
    ).innerText =
      pedido.servico || '';

    document.getElementById(
      'modal-observacao'
    ).innerText =
      pedido.observacao || '';

    document.getElementById(
      'modal-data-pedido'
    ).innerText =
      formatarDataTexto(
        pedido.data_hora_pedido
      );

    document.getElementById(
      'modal-data-limite'
    ).innerText =
      formatarDataTexto(
        pedido.data_hora_limite
      );

    document.getElementById(
      'modal-data-agendada'
    ).innerText =
      formatarDataTexto(
        pedido.data_agendada
      );

    document.getElementById(
      'modal-data-conclusao'
    ).innerText =
      formatarDataTexto(
        pedido.data_conclusao
      );


    document.getElementById(
      'modal-evento'
    ).style.display =
      'flex';

  }


  function fecharModal() {

    document.getElementById(
      'modal-evento'
    ).style.display =
      'none';

  }


  document
    .getElementById('modal-evento')
    .addEventListener(
      'click',
      function(e) {

        if (
          e.target === this
        ) {

          fecharModal();

        }

      }
    );


  /* =========================================================
     ACTUALIZAR INFORMAÇÃO
     ========================================================= */

  function atualizarInformacao() {

    const total =
      pedidos.length;

    const visiveis =
      obterPedidosVisiveis().length;

    document.getElementById(
      'estado-info'
    ).innerText =
      `${visiveis} visível(eis) / ${total} pedido(s)`;

  }


  /* =========================================================
     FORMATAR DATAS
     ========================================================= */

  function formatarData(cell) {

    const valor =
      cell.getValue();

    if (!valor) {
      return '';
    }

    return formatarDataTexto(valor);

  }


  function formatarDataTexto(valor) {

    if (!valor) {
      return '';
    }

    const data =
      new Date(valor);

    if (
      Number.isNaN(
        data.getTime()
      )
    ) {

      return String(valor);

    }

    return data.toLocaleString(
      'pt-PT',
      {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }
    );

  }


  /* =========================================================
     CONVERTER DATA PARA SUPABASE
     ========================================================= */

  function converterDataParaSupabase(valor) {

    if (
      valor === null ||
      valor === undefined ||
      valor === ''
    ) {

      return null;

    }

    /*
      Se já for uma data ISO completa.
    */

    if (
      typeof valor === 'string' &&
      /^\d{4}-\d{2}-\d{2}T/.test(valor)
    ) {

      return valor;

    }

    /*
      Data JS
    */

    if (
      valor instanceof Date
    ) {

      if (
        Number.isNaN(
          valor.getTime()
        )
      ) {

        return null;

      }

      return valor
        .toISOString()
        .slice(0, 19);

    }

    /*
      Tentar interpretar string.
    */

    const data =
      new Date(valor);

    if (
      Number.isNaN(
        data.getTime()
      )
    ) {

      return valor;

    }

    return data
      .toISOString()
      .slice(0, 19);

  }


  /* =========================================================
     ESCAPE HTML
     ========================================================= */

  function escapeHtml(valor) {

    return String(
      valor ?? ''
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

  }


  /* =========================================================
     FECHAR MODAL COM ESC
     ========================================================= */

  document.addEventListener(
    'keydown',
    function(e) {

      if (
        e.key === 'Escape'
      ) {

        fecharModal();

      }

    }
  );

</script>
