<!DOCTYPE html>
<html lang="pt">
<head>

<!-- Configurações PWA / Instalar como App -->

  <meta name="theme-color" content="#0f172a">
  
  <!-- Suporte específico para iOS (Apple) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Topografia ©">

  <style>
    body { background: #0f172a; font-family: 'Segoe UI', Arial, sans-serif; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 10px; }
    
    #login-box { background: #1e293b; padding: 40px; border-radius: 18px; text-align: center; width: 100%; max-width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    
    /* Regra responsiva para as imagens */
    #login-box img, .menu-container img {
        display: block;
        margin: 0 auto 15px auto;
        width: 100%;
        max-width: 60px;
        height: auto;
    }

    input { padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #334155; width: 100%; box-sizing: border-box; background: #0f172a; color: white; font-size: 16px; }
    button { padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 5px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.3s; font-size: 16px; }
    button:hover { background: #2563eb; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    
    #main-content { display: none; }
    .menu-container { max-width: 600px; width: 100%; background: #1e293b; padding: 30px; border-radius: 18px; box-shadow: 0 0 30px rgba(0,0,0,0.4); text-align: center; }
    .user-info { margin-bottom: 20px; color: #94a3b8; font-size: 0.9em; }
    .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .menu-card { background: #334155; padding: 20px; border-radius: 14px; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s; font-size: 0.9em; }
    .menu-card:hover { transform: scale(1.03); background: #475569; }

    /* Ajuste para dispositivos móveis */
    @media (max-width: 480px) {
        .grid-menu { grid-template-columns: 1fr; gap: 14px; }
        .menu-container { padding: 20px; }
        #login-box { padding: 28px 22px; }
        .menu-container h1 { font-size: 26px; }
        .menu-card { padding: 16px; font-size: 1em; }
    }

    /* ---- Banner de instalação PWA ---- */
    #install-banner {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      z-index: 1000;
      box-sizing: border-box;
      align-items: center;
      gap: 12px;
    }
    #install-banner.show { display: flex; }
    #install-banner img { width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0; }
    #install-banner .install-text { flex: 1; text-align: left; font-size: 0.85em; color: #e2e8f0; line-height: 1.35; }
    #install-banner .install-text strong { display: block; font-size: 1.05em; margin-bottom: 2px; color: #ffffff; }
    #install-banner .install-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
    #install-banner button.install-btn { width: auto; margin: 0; padding: 8px 14px; font-size: 0.85em; white-space: nowrap; }
    #install-banner button.install-close {
      width: auto; margin: 0; padding: 4px 8px; font-size: 0.85em; font-weight: normal;
      background: transparent; color: #94a3b8; border: 1px solid #334155;
    }
    #install-banner button.install-close:hover { background: #334155; color: white; }

    @media (max-width: 480px) {
      #install-banner { flex-wrap: wrap; }
      #install-banner .install-actions { flex-direction: row; width: 100%; justify-content: flex-end; margin-top: 6px; }
    }
  </style>
</head>
<body>

  <div id="login-box">
    <img src="favicon.png" alt="Logo">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="btn-entrar" onclick="fazerLogin()">Entrar</button>
  </div>

  <div id="main-content" class="menu-container">
    <img src="favicon.png" alt="Logo">
    <div class="user-info">
      Logado como: <span id="user-email" style="font-weight: bold; color: #60a5fa;"></span>
    </div>
    <h1>Painel de Controlo</h1>
    
    <div class="grid-menu">
      <a href="registo_pedidos.html" class="menu-card"><div>📝 Registo de Pedidos</div></a>
      <a href="registo_atividade.html" class="menu-card"><div>📊 Registo de Atividade</div></a>
      <a href="ver_pedidos.html" class="menu-card"><div>📋 Consultar Pedidos</div></a>
      <a href="ver_atividades.html" class="menu-card"><div>📈 Consultar Atividades</div></a>
    </div>

    <button onclick="fazerLogout()" style="background:#ef4444; width: auto; margin-top:30px; padding: 10px 20px;">Sair da Conta</button>
  </div>

  <!-- Banner de instalação da aplicação (PWA) -->
  <div id="install-banner">
    <img src="favicon.png" alt="Logo">
    <div class="install-text" id="install-text">
      <strong>Instalar aplicação</strong>
      <span id="install-message">Instala esta app no teu dispositivo para acesso mais rápido.</span>
    </div>
    <div class="install-actions">
      <button type="button" class="install-btn" id="install-btn" onclick="instalarApp()">Instalar</button>
      <button type="button" class="install-close" onclick="fecharBannerInstalacao()">Agora não</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dunondjiqawovisnwavg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bm9uZGppcWF3b3Zpc253YXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTk3MjIsImV4cCI6MjA5NTYzNTcyMn0.KY5xnuHCixsO0a4yCzXP6CmO8e08v1wrDjoGCL-LTro';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = async () => {
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        mostrarPainel(data.session.user.email);
      }
    };

    function mostrarPainel(email) {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById('user-email').innerText = email;
    }

    async function fazerLogin() {
      const btn = document.getElementById('btn-entrar');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerText = "A autenticar...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Erro no login: " + error.message);
        btn.disabled = false;
        btn.innerText = "Entrar";
      } else {
        mostrarPainel(data.user.email);
      }
    }

    async function fazerLogout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }
  </script>
<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('Service Worker registado com sucesso:', reg.scope))
          .catch((err) => console.log('Erro ao registar o Service Worker:', err));
      });
    }
  </script>

  <!-- ---- Lógica do aviso de instalação da PWA ---- -->
  <script>
    let deferredInstallPrompt = null;
    const INSTALL_DISMISS_KEY = 'installBannerDismissedAt';
    const DISMISS_COOLDOWN_MS = 1000 * 60 * 60 * 24 * 3; // 3 dias

    function estaInstalada() {
      // App aberta em modo standalone (já instalada) - Android/Desktop
      const standaloneMatch = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
      // iOS usa esta propriedade específica no Safari
      const iosStandalone = window.navigator.standalone === true;
      return standaloneMatch || iosStandalone;
    }

    function isIOS() {
      const ua = window.navigator.userAgent;
      const iOSDevice = /iPad|iPhone|iPod/.test(ua);
      // iPads recentes reportam-se como Mac, mas têm suporte a touch
      const iPadOS = ua.includes('Macintosh') && navigator.maxTouchPoints > 1;
      return iOSDevice || iPadOS;
    }

    function foiRecentementeDispensado() {
      const ts = localStorage.getItem(INSTALL_DISMISS_KEY);
      if (!ts) return false;
      return (Date.now() - parseInt(ts, 10)) < DISMISS_COOLDOWN_MS;
    }

    function mostrarBannerInstalacao() {
      if (estaInstalada() || foiRecentementeDispensado()) return;

      const banner = document.getElementById('install-banner');
      const msg = document.getElementById('install-message');
      const btn = document.getElementById('install-btn');

      if (isIOS()) {
        // No iOS não existe prompt nativo: dão-se instruções manuais
        msg.innerHTML = 'Para instalar: toca em <strong>Partilhar</strong> ⬆️ e depois em <strong>"Adicionar ao Ecrã Principal"</strong>.';
        btn.style.display = 'none';
      } else {
        msg.textContent = 'Instala esta app no teu dispositivo para acesso mais rápido.';
        btn.style.display = 'inline-block';
      }

      banner.classList.add('show');
    }

    function fecharBannerInstalacao() {
      document.getElementById('install-banner').classList.remove('show');
      localStorage.setItem(INSTALL_DISMISS_KEY, Date.now().toString());
    }

    async function instalarApp() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      document.getElementById('install-banner').classList.remove('show');
      if (outcome !== 'accepted') {
        // Se recusou, não insistir de imediato
        localStorage.setItem(INSTALL_DISMISS_KEY, Date.now().toString());
      }
    }

    // Chrome/Edge/Android disparam este evento quando a app é instalável
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      mostrarBannerInstalacao();
    });

    // Depois de instalada, esconder o banner e limpar o estado
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      document.getElementById('install-banner').classList.remove('show');
      localStorage.removeItem(INSTALL_DISMISS_KEY);
    });

    // iOS não dispara 'beforeinstallprompt', por isso mostramos logo o banner
    // (se ainda não estiver instalada) assim que a página carrega.
    window.addEventListener('load', () => {
      if (isIOS() && !estaInstalada()) {
        mostrarBannerInstalacao();
      }
    });
  </script>
</body>
</html>
