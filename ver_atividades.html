    <script>
        const SUPABASE_URL = 'https://dunondjiqawovisnwavg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_WekrBSs5JOjnJ1SGxFvmKQ_3v6AnBMs';
        const ANEXO_BUCKET = 'anexos';

        let table = null;
        let sbClient = null;
        let calendario = null;
        let anexoRowIdAtual = null;
        let anexoBotaoAtual = null;
        let dadosAtividadesPorId = {};
        let ocorrenciaAtividadeAtual = null;
        let idsEditados = new Set(); // linhas que foram efetivamente alteradas desde a última gravação

        // ===== VERIFICAÇÃO DE BIBLIOTECAS =====
        (function verificarBibliotecas() {
            const emFalta = [];
            if (typeof supabase === 'undefined') emFalta.push('Supabase');
            if (typeof Tabulator === 'undefined') emFalta.push('Tabulator');
            if (typeof FullCalendar === 'undefined') emFalta.push('FullCalendar');
            if (typeof ExcelJS === 'undefined') emFalta.push('ExcelJS');
            if (typeof PizZip === 'undefined') emFalta.push('PizZip');
            if (typeof window.docxtemplater === 'undefined') emFalta.push('docxtemplater');

            if (emFalta.length > 0) {
                console.error('⚠️ Bibliotecas não carregadas:', emFalta.join(', '));
                document.getElementById('utilizador-info').innerText =
                    '⚠️ Erro: faltam bibliotecas (' + emFalta.join(', ') + '). Verifica a internet e faz Ctrl+Shift+R.';
                return;
            }
            sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        })();

        function avisarSemCliente() {
            alert('A página não conseguiu carregar as bibliotecas externas.\nVerifica a ligação à internet e recarrega com Ctrl+Shift+R.');
        }

        function formatarDataParaWord(dataStr, ehFim) {
            if (!dataStr) return '';
            const [data, hora] = dataStr.split('T');
            if (!data) return dataStr;
            const [ano, mes, dia] = data.split('-');
            let periodo = '';
            if (hora) {
                const horas = parseInt(hora.substring(0, 2), 10);
                periodo = ehFim
                    ? (horas <= 13 ? 'Manhã' : 'Tarde')
                    : (horas < 13 ? 'Manhã' : 'Tarde');
            }
            return `${dia}/${mes}/${ano}${periodo ? '  ' + periodo : ''}`;
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        const ANEXO_CAIXA_LARGURA = 590;
        const ANEXO_CAIXA_ALTURA = 515;
        const ANEXO_MARCADOR = "ANEXOIMAGEMPLACEHOLDERXPTO";

        async function carregarAnexoImagem(url) {
            const resposta = await fetch(url);
            if (!resposta.ok) throw new Error("Não foi possível obter a imagem.");
            const arrayBuffer = await resposta.arrayBuffer();
            const bitmap = await createImageBitmap(new Blob([arrayBuffer]));
            const escala = Math.min(
                ANEXO_CAIXA_LARGURA / bitmap.width,
                ANEXO_CAIXA_ALTURA / bitmap.height,
                1
            );
            return {
                arrayBuffer,
                size: [
                    Math.round(bitmap.width * escala),
                    Math.round(bitmap.height * escala)
                ]
            };
        }

        function pxParaEmu(px) {
            return Math.round(px * 9525);
        }

        function substituirRunComMarcador(xml, marcador, novoRunXml) {
            const idxMarcador = xml.indexOf(marcador);
            if (idxMarcador === -1) return xml;
            const inicioComEspaco = xml.lastIndexOf("<w:r ", idxMarcador);
            const inicioSemEspaco = xml.lastIndexOf("<w:r>", idxMarcador);
            const inicio = Math.max(inicioComEspaco, inicioSemEspaco);
            const fimTag = xml.indexOf("</w:r>", idxMarcador);
            if (inicio === -1 || fimTag === -1) return xml;
            const fim = fimTag + "</w:r>".length;
            return xml.slice(0, inicio) + novoRunXml + xml.slice(fim);
        }

        function inserirImagemAnexo(zip, imagemArrayBuffer, sizePx) {
            const caminhoMedia = "word/media/anexo_foto.png";
            zip.file(caminhoMedia, imagemArrayBuffer);

            const caminhoRels = "word/_rels/document.xml.rels";
            let relsXml = zip.file(caminhoRels).asText();
            const idsExistentes = Array.from(relsXml.matchAll(/Id="rId(\d+)"/g)).map(function (m) {
                return parseInt(m[1], 10);
            });
            const maiorId = idsExistentes.length ? Math.max.apply(null, idsExistentes) : 0;
            const novoId = "rId" + (maiorId + 1);
            const novaRelacao = '<Relationship Id="' + novoId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/anexo_foto.png"/>';
            relsXml = relsXml.replace("</Relationships>", novaRelacao + "</Relationships>");
            zip.file(caminhoRels, relsXml);

            const cx = pxParaEmu(sizePx[0]);
            const cy = pxParaEmu(sizePx[1]);
            const drawingXml =
                '<w:r><w:rPr><w:noProof/></w:rPr><w:drawing>' +
                '<wp:inline distT="0" distB="0" distL="0" distR="0">' +
                '<wp:extent cx="' + cx + '" cy="' + cy + '"/>' +
                '<wp:effectExtent l="0" t="0" r="0" b="0"/>' +
                '<wp:docPr id="909001" name="AnexoFoto"/>' +
                '<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/officeDocument/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>' +
                '<a:graphic xmlns:a="http://schemas.openxmlformats.org/officeDocument/2006/main">' +
                '<a:graphicData uri="http://schemas.openxmlformats.org/officeDocument/2006/picture">' +
                '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/officeDocument/2006/picture">' +
                '<pic:nvPicPr><pic:cNvPr id="909001" name="AnexoFoto"/><pic:cNvPicPr/></pic:nvPicPr>' +
                '<pic:blipFill><a:blip r:embed="' + novoId + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
                '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>' +
                '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>' +
                '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';

            const caminhoDoc = "word/document.xml";
            let docXml = zip.file(caminhoDoc).asText();
            docXml = substituirRunComMarcador(docXml, ANEXO_MARCADOR, drawingXml);
            zip.file(caminhoDoc, docXml);
        }

        async function gerarDocx(rowData) {
            try {
                const templateBase64 = window.TEMPLATE_DOCX_BASE64;
                if (!templateBase64 || templateBase64.indexOf('COLA_AQUI') !== -1) {
                    alert("O template Word não foi carregado.\nVerifica se o ficheiro 'template_docx.js' existe na mesma pasta e tem a string base64.");
                    return;
                }

                let anexoPreparado = null;
                if (rowData.anexo) {
                    anexoPreparado = await carregarAnexoImagem(rowData.anexo);
                }

                const zip = new PizZip(base64ToArrayBuffer(templateBase64));
                const doc = new window.docxtemplater(zip, {
                    paragraphLoop: true,
                    linebreaks: true,
                    delimiters: { start: "{{", end: "}}" }
                });

                const NUMERO_POR_TECNICO = {
                    "Francisco S": 800,
                    "Daniel P": 715
                };

                const nomesTecnicos = (rowData.tecnico || "")
                    .split(",")
                    .map(t => t.trim())
                    .filter(Boolean);

                // ===== Serviço + ocorrências associadas (sem data) =====
                const ocorrenciasDaAtividade =
                    (dadosAtividadesPorId[rowData.id] && dadosAtividadesPorId[rowData.id].ocorrencias_info) ||
                    rowData.ocorrencias_info ||
                    [];

                let servicoComOcorrencias = rowData.servico || "";
                if (ocorrenciasDaAtividade.length > 0) {
                    servicoComOcorrencias += "\nOcorrências:";
                    ocorrenciasDaAtividade.forEach(function (o) {
                        servicoComOcorrencias += " " + (o.ocorrencia || "");
                    });
                }

                const dadosTemplate = {
                    Tecnico1_Nome: nomesTecnicos[0] || "",
                    Tecnico1_numero: nomesTecnicos[0] ? (NUMERO_POR_TECNICO[nomesTecnicos[0]] ?? "") : "",
                    Tecnico2_Nome: nomesTecnicos[1] || "",
                    Tecnico2_numero: nomesTecnicos[1] ? (NUMERO_POR_TECNICO[nomesTecnicos[1]] ?? "") : "",
                    numero_obra: rowData.numero_obra || "",
                    dataHoraInicio: formatarDataParaWord(rowData.data_hora_inicio, false) || "",
                    dataHoraFim: formatarDataParaWord(rowData.data_hora_fim, true) || "",
                    Atividade_Local_Obra: rowData.local_obra || "",
                    Atividade_Servico: servicoComOcorrencias
                };
                dadosTemplate["%Atividade_Anexo"] = anexoPreparado ? ANEXO_MARCADOR : "";
                doc.render(dadosTemplate);
                const zipFinal = doc.getZip();
                if (anexoPreparado) {
                    inserirImagemAnexo(zipFinal, anexoPreparado.arrayBuffer, anexoPreparado.size);
                }

                const blob = zipFinal.generate({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                });

                const nomeBase = (rowData.tecnico || "atividade").trim().replace(/[^a-zA-Z0-9]+/g, "_");
                const nomeFicheiro = "Atividade_" + nomeBase + "_" + rowData.id + ".docx";

                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = nomeFicheiro;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            } catch (error) {
                console.error("Erro ao gerar o documento Word:", error);
                if (error.properties && error.properties.errors) {
                    console.error(JSON.stringify(error.properties.errors, null, 2));
                }
                alert("Erro ao gerar o documento Word. Verifica a consola (F12).");
            }
        }

        async function enviarAnexo(file, id) {
            if (anexoBotaoAtual) {
                anexoBotaoAtual.disabled = true;
                anexoBotaoAtual.innerText = "⏳ A enviar...";
            }

            try {
                const extensao = (file.name.split('.').pop() || 'jpg').toLowerCase();
                const caminho = "atividade_" + id + "_" + Date.now() + "." + extensao;

                const { error: erroUpload } = await sbClient
                    .storage
                    .from(ANEXO_BUCKET)
                    .upload(caminho, file, { upsert: true });

                if (erroUpload) {
                    console.error("Erro ao enviar o anexo:", erroUpload);
                    alert("Erro ao enviar o anexo. Verifica a consola (F12).");
                    return;
                }

                const { data: urlData } = sbClient
                    .storage
                    .from(ANEXO_BUCKET)
                    .getPublicUrl(caminho);

                const urlPublico = urlData.publicUrl;

                const { error: erroUpdate } = await sbClient
                    .from('atividades')
                    .update({ anexo: urlPublico })
                    .eq('id', id);

                if (erroUpdate) {
                    console.error("Erro ao guardar o anexo na base de dados:", erroUpdate);
                    alert("O anexo foi enviado, mas houve um erro ao guardar na base de dados. Verifica a consola (F12).");
                    return;
                }

                const linha = table.getRow(id);
                if (linha) {
                    await linha.update({ anexo: urlPublico });
                }

                alert("Anexo enviado e guardado com sucesso!");

            } catch (error) {
                console.error("Erro inesperado ao enviar o anexo:", error);
                alert("Erro inesperado ao enviar o anexo. Verifica a consola (F12).");
            } finally {
                if (anexoBotaoAtual) {
                    anexoBotaoAtual.disabled = false;
                    anexoBotaoAtual.innerText = "📎 Anexo";
                    anexoBotaoAtual.classList.add('tem-anexo');
                }
                anexoBotaoAtual = null;
                anexoRowIdAtual = null;
                const inputAnexo = document.getElementById('input-anexo');
                if (inputAnexo) inputAnexo.value = "";
            }
        }

        document.getElementById('input-anexo').addEventListener('change', function (e) {
            const file = e.target.files[0];
            e.target.value = "";
            if (!file || anexoRowIdAtual === null) return;
            enviarAnexo(file, anexoRowIdAtual);
        });

        function atualizarContador() {
            if (table) {
                const contagem = table.getRows("active").length;
                document.getElementById("contador-atividades").innerText = "(" + contagem + ")";

        function abrirModalAnexo(url) {
            document.getElementById('modal-anexo-img').src = url;
            document.getElementById('modal-anexo').classList.add('aberta');
            document.body.style.overflow = 'hidden';
        }

        function fecharModalAnexo() {
            document.getElementById('modal-anexo').classList.remove('aberta');
            document.getElementById('modal-anexo-img').src = '';
            document.body.style.overflow = '';
        }

        function fecharModalAnexoSeBackdrop(e) {
            if (e.target.id === 'modal-anexo') fecharModalAnexo();

        function abrirModalPedido(p) {

        function formatarDataHoraTexto(valor) {
            if (!valor) return '';
            const [data, hora] = valor.split('T');
            if (!data) return valor;
            const [ano, mes, dia] = data.split('-');
            const horaLimpa = hora ? hora.substring(0, 5) : '';
            return horaLimpa ? `${dia}/${mes}/${ano} ${horaLimpa}` : `${dia}/${mes}/${ano}`;
        }

        function formatarDataHora(cell) {

            if (!valor) return '—';

        async function carregarAtividades() {
            if (!sbClient) { avisarSemCliente(); return; }

            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            document.getElementById('utilizador-info').innerText = session.user.email;

            const { data, error } = await sbClient
                .from('atividades')
                .select('*')
                .order('id', { ascending: false });

            if (error) { console.error("Erro ao carregar:", error); return; }

            dadosAtividadesPorId = {};
            data.forEach(a => { dadosAtividadesPorId[a.id] = a; });

            // Carregar pedidos associados
            const pedidosIds = [...new Set(data.filter(a => a.pedido_id).map(a => a.pedido_id))];
            const mapaPedidos = {};
            if (pedidosIds.length > 0) {
                const { data: pedidosData, error: errPedidos } = await sbClient
                    .from('pedidos')
                    .select('id, requerente, empresa, servico, local_obra, numero_obra, data_hora_pedido, estado, urgencia, data_conclusao')
                    .in('id', pedidosIds);

                if (errPedidos) {
                    console.error("Erro ao carregar pedidos associados:", errPedidos);
                } else {
                    (pedidosData || []).forEach(p => { mapaPedidos[p.id] = p; });
                }
            }
            data.forEach(a => { a.pedido_info = mapaPedidos[a.pedido_id] || null; });

            // Carregar ocorrências associadas às atividades
            const { data: ocorrenciasData, error: errOcorrencias } = await sbClient
                .from('ocorrencias')
                .select('id, data, ocorrencia, atividade_id')
                .not('atividade_id', 'is', null);

            const mapaOcorrencias = {};
            if (errOcorrencias) {
                console.error("Erro ao carregar ocorrências:", errOcorrencias);
            } else {
                (ocorrenciasData || []).forEach(function (o) {
                    if (!mapaOcorrencias[o.atividade_id]) mapaOcorrencias[o.atividade_id] = [];
                    mapaOcorrencias[o.atividade_id].push(o);
                });
            }
            data.forEach(a => { a.ocorrencias_info = mapaOcorrencias[a.id] || []; });

            table = new Tabulator("#tabela-atividades", {
                data: data,
                layout: "fitData",
                pagination: "local",
                paginationSize: 15,
                columns: [
                    { title: "Técnico", field: "tecnico", editor: "input" },
                    { title: "Início", field: "data_hora_inicio", formatter: formatarDataHora, editor: "input" },
                    { title: "Fim", field: "data_hora_fim", formatter: formatarDataHora, editor: "input" },
                    { title: "Local/Obra", field: "local_obra", editor: "input" },
                    { title: "Nº Obra", field: "numero_obra", editor: "input" },
                    { title: "Serviço", field: "servico", editor: "input" },
                    { title: "Pedido", field: "pedido_id", formatter: function (cell) {
                        const rowData = cell.getRow().getData();
                        const p = rowData.pedido_info;
                        if (!rowData.pedido_id || !p) return "<span class='sem-anexo'>—</span>";
                        const icone = p.data_conclusao ? "✅" : "⏳";
                        return icone + " <a class='link-anexo' href='javascript:void(0)'>#" + rowData.pedido_id + "</a>";
                    }, width: 90, hozAlign: "center", cellClick: function (e, cell) {
                        const rowData = cell.getRow().getData();
                        if (rowData.pedido_info) abrirModalPedido(rowData.pedido_info);
                    }},
                    { title: "Ocorrências", field: "ocorrencias_info", formatter: function (cell) {
                        const rowData = cell.getRow().getData();
                        const ocorrencias = rowData.ocorrencias_info || [];
                        if (ocorrencias.length === 0) return "<span class='sem-anexo'>—</span>";
                        return "<a class='link-anexo' href='javascript:void(0)'>🚨 " + ocorrencias.length + "</a>";
                    }, width: 110, hozAlign: "center", cellClick: function (e, cell) {
                        const rowData = cell.getRow().getData();
                        if ((rowData.ocorrencias_info || []).length > 0) abrirModalOcorrencias(rowData);
                    }},
                    { title: "Anexo", field: "anexo", formatter: function (cell) {
                        const valor = cell.getValue();
                        if (valor) {
                            return "<a class='link-anexo' href='javascript:void(0)'>🖼️ Ver</a>";
                        }
                        return "<span class='sem-anexo'>—</span>";
                    }, width: 90, hozAlign: "center", cellClick: function (e, cell) {
                        const valor = cell.getValue();
                        if (valor) abrirModalAnexo(valor);
                    }},
                    // Coluna Ações com largura automática
                    { title: "Ações", formatter: function (cell) {
                        const temAnexo = !!cell.getRow().getData().anexo;
                        return "<button class='btn-docx'>📄 Docx</button>" +
                               "<button class='btn-anexo" + (temAnexo ? " tem-anexo" : "") + "'>" + (temAnexo ? "✅ Anexo" : "📎 Anexo") + "</button>" +
                               "<button class='btn-ocorrencia'>🚨 Ocorrência</button>" +
                               "<button class='btn-apagar'>Apagar</button>";
                    }, minWidth: 320, hozAlign: "center", cellClick: function (e, cell) {
                        const rowData = cell.getRow().getData();

                        if (e.target.classList.contains('btn-docx')) {
                            gerarDocx(rowData);
                            return;

                        if (e.target.classList.contains('btn-anexo')) {
                            anexoRowIdAtual = rowData.id;
                            anexoBotaoAtual = e.target;
                            document.getElementById('input-anexo').click();
                            return;

                                sbClient.from('atividades').delete().eq('id', id).then(() => {
                                    cell.getRow().delete();
                                    atualizarContador();
                                });
                            }
                        }
                    }}
                ]
            });

            table.on("tableBuilt", atualizarContador);
            table.on("dataFiltered", atualizarContador);

            renderizarCalendario(data);
            table.on("cellEdited", function (cell) {
                idsEditados.add(cell.getRow().getData().id);
                renderizarCalendario(table.getData());
            });
            table.on("rowDeleted", function () { renderizarCalendario(table.getData()); });

            document.getElementById("filtro-pesquisa").addEventListener("keyup", function () {
                table.setFilter(function (data) {
                    const termo = document.getElementById("filtro-pesquisa").value.toLowerCase();
                    return Object.values(data).some(val =>
                        String(val).toLowerCase().includes(termo)

                });

        }

        function corPorTecnico(nome) {
            const cores = ['#0ea5e9', '#22c55e', '#f59e0b', '#a855f7', '#ef4444', '#14b8a6', '#eab308'];
            if (!nome) return '#64748b';
            let hash = 0;
            for (let i = 0; i < nome.length; i++) hash = nome.charCodeAt(i) + ((hash << 5) - hash);
            return cores[Math.abs(hash) % cores.length];
        }

        // Corta textos longos (ex.: serviço) para o título do calendário não ficar gigante
        function truncarTexto(texto, tamanho) {
            if (!texto) return '';
            return texto.length > tamanho ? texto.substring(0, tamanho).trim() + '…' : texto;
        }

        // Monta o título do evento: "Técnico(s) — Local ("Nº Obra") - Serviço"
        function montarTituloEvento(row) {
            let titulo = row.tecnico || 'Sem técnico';

            if (row.local_obra) titulo += ' — ' + row.local_obra;
            if (row.numero_obra) titulo += ' (' + row.numero_obra + ')';
            if (row.servico) titulo += ' - ' + truncarTexto(row.servico, 80);

            return titulo;
        }

                    end: row.data_hora_fim || row.data_hora_inicio,

                        '<p><strong>Fim:</strong> ' + (formatarDataHoraTexto(row.data_hora_fim) || '—') + '</p>' +
                        '<p><strong>Local/Obra:</strong> ' + (row.local_obra || '—') + '</p>' +
                        '<p><strong>Nº Obra:</strong> ' + (row.numero_obra || '—') + '</p>' +

        async function guardarAlteracoes() {
            if (!sbClient || !table) { avisarSemCliente(); return; }

            // Só grava as linhas que foram efetivamente editadas (idsEditados),
            // em vez de reenviar TODAS as linhas da tabela — isto é o que
            // tornava o botão lento com muitas atividades.
            if (idsEditados.size === 0) {
                alert("Não há alterações por guardar.");
                return;
            }

            const btn = document.querySelector('button[onclick="guardarAlteracoes()"]');
            const textoOriginalBtn = btn ? btn.innerText : null;
            if (btn) { btn.disabled = true; btn.innerText = "⏳ A guardar..."; }

            const idsParaGravar = Array.from(idsEditados);
            const dadosPorId = {};
            table.getData().forEach(item => { dadosPorId[item.id] = item; });

            // Todos os updates são independentes entre si, por isso correm
            // em PARALELO (Promise.all) em vez de um a seguir ao outro.
            const resultados = await Promise.all(idsParaGravar.map(id => {
                const item = dadosPorId[id];
                if (!item) return Promise.resolve({ id, error: null });
                return sbClient
                    .from('atividades')
                    .update({
                        tecnico: item.tecnico,
                        data_hora_inicio: item.data_hora_inicio,
                        data_hora_fim: item.data_hora_fim,
                        local_obra: item.local_obra,
                        numero_obra: item.numero_obra,
                        servico: item.servico
                    })
                    .eq('id', item.id)
                    .then(({ error }) => ({ id, error }));
            }));

            const falhas = resultados.filter(r => r.error);
            falhas.forEach(r => console.error("Erro ao atualizar ID " + r.id, r.error));

            // Remove das pendentes só as que gravaram com sucesso, para as
            // que falharam continuarem marcadas e serem retentadas depois.
            resultados.filter(r => !r.error).forEach(r => idsEditados.delete(r.id));

            if (btn) { btn.disabled = false; btn.innerText = textoOriginalBtn; }

            if (falhas.length === 0) {
                alert("Alterações guardadas com sucesso! (" + idsParaGravar.length + " registo(s))");
            } else {
                alert(falhas.length + " registo(s) falharam ao guardar. Verifica a consola (F12).");
            }
        }

        function calcularHoras(inicio, fim) {
            if (!inicio || !fim) return 0;
            const ms = new Date(fim) - new Date(inicio);
            if (isNaN(ms) || ms <= 0) return 0;
            return Math.round((ms / 3600000) * 100) / 100;
        }

        function aplicarBordaFina(cell) {
            const lado = { style: 'thin' };
            cell.border = { top: lado, bottom: lado, left: lado, right: lado };
        }

        const FORMATO_HORAS_MINUTOS = '[h]"H"mm';

        function horasParaFracaoDeDia(horasDecimais) {
            return (horasDecimais || 0) / 24;
        }

        async function exportarParaExcel() {
            if (!sbClient || !table) { avisarSemCliente(); return; }
            try {
                const workbook = new ExcelJS.Workbook();
                const response = await fetch('atividades.xlsx');
                if (!response.ok) {
                    throw new Error("Não encontrei o ficheiro 'atividades.xlsx' na mesma pasta (HTTP " + response.status + ").");
                }
                await workbook.xlsx.load(await response.arrayBuffer());
                const worksheet = workbook.getWorksheet(1);
                if (!worksheet) {
                    throw new Error("O ficheiro atividades.xlsx não tem nenhuma folha de cálculo legível.");
                }

                const dados = table.getData();

                let linha = 5;
                dados.forEach(row => {
                    const horas = calcularHoras(row.data_hora_inicio, row.data_hora_fim);

                    const celTecnico = worksheet.getCell(linha, 2);
                    const celInicio = worksheet.getCell(linha, 3);
                    const celFim = worksheet.getCell(linha, 4);
                    const celHoras = worksheet.getCell(linha, 5);
                    const celObra = worksheet.getCell(linha, 6);
                    const celNumObra = worksheet.getCell(linha, 7);
                    const celServico = worksheet.getCell(linha, 8);
                    const celAnexo = worksheet.getCell(linha, 9);

                    celTecnico.value = row.tecnico || '';
                    celInicio.value = formatarDataHoraTexto(row.data_hora_inicio);
                    celFim.value = formatarDataHoraTexto(row.data_hora_fim);
                    celHoras.value = horasParaFracaoDeDia(horas);
                    celHoras.numFmt = FORMATO_HORAS_MINUTOS;
                    celObra.value = row.local_obra || '';
                    celNumObra.value = row.numero_obra || '';
                    celServico.value = row.servico || '';

                    if (row.anexo) {
                        celAnexo.value = { text: 'Ver anexo', hyperlink: row.anexo };
                        celAnexo.font = { color: { argb: 'FF2563EB' }, underline: true };
                    } else {
                        celAnexo.value = '';
                    }

                    [celTecnico, celInicio, celFim, celHoras, celObra, celNumObra, celServico, celAnexo].forEach(aplicarBordaFina);

                    linha++;
                });

                const totais = {};
                dados.forEach(row => {
                    const horas = calcularHoras(row.data_hora_inicio, row.data_hora_fim);
                    if (horas <= 0) return;

                    const tecnicos = (row.tecnico || '')
                        .split(',')
                        .map(t => t.trim())
                        .filter(Boolean);

                    tecnicos.forEach(tec => {
                        const chave = tec + '||' + (row.local_obra || '') + '||' + (row.numero_obra || '');
                        if (!totais[chave]) {
                            totais[chave] = { tecnico: tec, local_obra: row.local_obra || '', numero_obra: row.numero_obra || '', horas: 0 };
                        }
                        totais[chave].horas += horas;
                    });
                });

                const linhasTotais = Object.values(totais).sort((a, b) => {
                    return a.tecnico.localeCompare(b.tecnico, 'pt') || a.local_obra.localeCompare(b.local_obra, 'pt');
                });

                let linha2 = 5;
                linhasTotais.forEach(item => {
                    const celTecnico = worksheet.getCell(linha2, 12);
                    const celObra = worksheet.getCell(linha2, 13);
                    const celNumObra = worksheet.getCell(linha2, 14);
                    const celTotal = worksheet.getCell(linha2, 15);

                    celTecnico.value = item.tecnico;
                    celObra.value = item.local_obra;
                    celNumObra.value = item.numero_obra;
                    celTotal.value = horasParaFracaoDeDia(Math.round(item.horas * 100) / 100);
                    celTotal.numFmt = FORMATO_HORAS_MINUTOS;

                    [celTecnico, celObra, celNumObra, celTotal].forEach(aplicarBordaFina);

                    linha2++;
                });

                const totalPorTecnico = {};
                linhasTotais.forEach(item => {
                    totalPorTecnico[item.tecnico] = (totalPorTecnico[item.tecnico] || 0) + item.horas;
                });

                let linha3 = 5;
                while (linha3 < 200) {
                    const celTecnico3 = worksheet.getCell(linha3, 17);
                    const nomeTecnico = celTecnico3.value;
                    if (!nomeTecnico) break;

                    const celTotal3 = worksheet.getCell(linha3, 18);
                    const totalHoras = Math.round((totalPorTecnico[nomeTecnico] || 0) * 100) / 100;
                    const totalFracaoDia = horasParaFracaoDeDia(totalHoras);

                    if (celTotal3.formula) {
                        celTotal3.value = { formula: celTotal3.formula, result: totalFracaoDia };
                    } else {
                        celTotal3.value = totalFracaoDia;
                    }
                    celTotal3.numFmt = FORMATO_HORAS_MINUTOS;

                    linha3++;
                }

                workbook.calcProperties = workbook.calcProperties || {};
                workbook.calcProperties.fullCalcOnLoad = true;

                const buffer = await workbook.xlsx.writeBuffer();
                const link = document.createElement("a");
                link.href = URL.createObjectURL(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
                link.download = "Atividades_Exportadas.xlsx";
                link.click();
            } catch (erro) {
                console.error("Erro ao exportar para Excel:", erro);
                alert("Não foi possível exportar o Excel: " + erro.message + "\n\nVerifica a consola (F12) para mais detalhes.");
            }
        }

        if (sbClient) {
            carregarAtividades();
        }
    </script>
</body>
</html>
