<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registo de Ocorrência</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 1.5rem; color: #f8fafc; }
        .user-info { font-size: 0.9rem; color: #94a3b8; }
        .user-info strong { color: #60a5fa; }

        .form-group { margin-bottom: 20px; }
        .form-label { 
            display: block; 
            margin-bottom: 8px; 
            color: #cbd5e1; 
            font-size: 14px; 
            font-weight: 600; 
            letter-spacing: 0.3px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            font-size: 15px;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .auto-filled {
            border-color: #22c55e !important;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25) !important;
            animation: pulse-green 1s ease-out;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.97); }

        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }

        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }

        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .actions .btn { flex: 1; min-width: 140px; }

        .loading-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; backdrop-filter: blur(4px);
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #334155;
            border-top-color: #3b82f6; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .container { padding: 16px; border-radius: 12px; }
            .header { flex-direction: column; align-items: flex-start; }
            .actions { flex-direction: column; }
            .actions .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <div class="header">
            <div>
                <h1 id="page-title">Nova Ocorrência</h1>
                <div class="user-info">Utilizador: <strong id="utilizador-info">A verificar...</strong></div>
            </div>
            <a href="historico_ocorrencias.html" class="btn btn-secondary">⬅ Voltar ao Histórico</a>
        </div>

        <form id="form-ocorrencia">
            <input type="hidden" id="ocorrencia-id">

            <div class="form-group">
                <label class="form-label" for="data">Data e Hora</label>
                <input type="datetime-local" id="data" name="data" class="form-control" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="ocorrencia">Descrição da Ocorrência</label>
                <textarea id="ocorrencia" name="ocorrencia" class="form-control" placeholder="Descreva os detalhes da ocorrência..." required></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="selectAtividade">Atividade Associada</label>
                <select id="selectAtividade" name="atividade_id" class="form-control">
                    <option value="">-- A carregar atividades... --</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="selectObra">Obra</label>
                <select id="selectObra" name="obra_id" class="form-control">
                    <option value="">-- Selecionar obra --</option>
                    <option value="17" data-local="Antigo Pavilhao Grownor" data-numero="CCR-INVEST">CCR-INVEST Antigo Pavilhao Grownor - CCR-INVEST</option>
                    <option value="11" data-local="Belarmino" data-numero="265">265 Belarmino - CCR ENG&amp;CONST</option>
                    <option value="13" data-local="Coliseum Famalicão" data-numero="253">253 Coliseum Famalicão - CCR-INVEST</option>
                    <option value="10" data-local="Complexo CCR" data-numero="Topografia">Topografia Complexo CCR - CCR-INVEST</option>
                    <option value="1" data-local="Edifício Torre Aver o Mar" data-numero="WestView">WestView Edifício Torre Aver o Mar - WEST-VIEW</option>
                    <option value="2" data-local="ERPI" data-numero="020">020 ERPI - CCR-INVEST</option>
                    <option value="15" data-local="Famalicão prime" data-numero="258">258 Famalicão prime - CCR ENG&amp;CONST</option>
                    <option value="5" data-local="Gaia Coimbrões" data-numero="260">260 Gaia Coimbrões - CCR ENG&amp;CONST</option>
                    <option value="28" data-local="Hospital Famalicão" data-numero="262">262 Hospital Famalicão - CCR ENG&amp;CONST</option>
                    <option value="4" data-local="Lapa" data-numero="240">240 Lapa - CCR ENG&amp;CONST</option>
                    <option value="6" data-local="Lisboa" data-numero="Grownor">Grownor Lisboa - GROWNOR</option>
                    <option value="8" data-local="Megasa" data-numero="016">016 Megasa - GROWNOR</option>
                    <option value="7" data-local="Residências Sta Luzia" data-numero="252">252 Residências Sta Luzia - CCR ENG&amp;CONST</option>
                    <option value="18" data-local="Retorta" data-numero="244">244 Retorta - CCR ENG&amp;CONST</option>
                    <option value="9" data-local="Sanipower" data-numero="228">228 Sanipower - CCR ENG&amp;CONST</option>
                    <option value="12" data-local="Sede" data-numero="261">261 Sede - CCR ENG&amp;CONST</option>
                    <option value="16" data-local="Urb Mariadeira - R. António Quilores" data-numero="267">267 Urb Mariadeira - R. António Quilores - CCR ENG&amp;CONST</option>
                    <option value="14" data-local="Vendeiro" data-numero="245">245 Vendeiro - CCR ENG&amp;CONST</option>
                    <option value="3" data-local="Vilar do Pinheiro" data-numero="263">263 Vilar do Pinheiro - CCR ENG&amp;CONST</option>
                    <option value="34" data-local="White Ermesinde" data-numero="259">259 White Ermesinde - CCR ENG&amp;CONST</option>
                </select>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancelar</button>
                <button type="submit" class="btn btn-success" id="btn-save">💾 Guardar Ocorrência</button>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://dunondjiqawovisnwavg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_WekrBSs5JOjnJ1SGxFvmKQ_3v6AnBMs';
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('form-ocorrencia');
        const selectAtividade = document.getElementById('selectAtividade');
        const selectObra = document.getElementById('selectObra');
        const loading = document.getElementById('loading');

        function showLoading(show) {
            loading.style.display = show ? 'flex' : 'none';
        }

        function formatarDataParaInput(dataISO) {
            if (!dataISO) return '';
            const d = new Date(dataISO);
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().slice(0, 16);
        }

        function formatarDataTexto(valor) {
            if (!valor) return '';
            const [data, hora] = valor.split('T');
            if (!data) return valor;
            const [ano, mes, dia] = data.split('-');
            const horaLimpa = hora ? hora.substring(0, 5) : '';
            return horaLimpa ? `${dia}/${mes}/${ano} ${horaLimpa}` : `${dia}/${mes}/${ano}`;
        }

// ===== CARREGAR ATIVIDADES + DADOS DA OBRA =====
async function carregarAtividadesNoSelect() {

    selectAtividade.innerHTML =
        '<option value="">-- A carregar atividades... --</option>';

    const { data: atividades, error } = await sbClient
        .from('atividades')
        .select(`
            id,
            tecnico,
            data_hora_inicio,
            servico,
            obra_id,
            obras!inner (
                id,
                numero_obra,
                local_obra,
                empresa,
                concelho
            )
        `)
        .order('data_hora_inicio', { ascending: false });

    if (error) {

        console.error('Erro ao carregar atividades:', error);

        selectAtividade.innerHTML =
            '<option value="">-- Erro ao carregar atividades --</option>';

        alert(
            'Erro ao carregar atividades:\n\n' +
            error.message
        );

        return;
    }

    if (!atividades || atividades.length === 0) {

        selectAtividade.innerHTML =
            '<option value="">-- Nenhuma atividade encontrada --</option>';

        return;
    }

    selectAtividade.innerHTML =
        '<option value="">-- Nenhuma atividade associada --</option>';

    atividades.forEach(atividade => {

        const option = document.createElement('option');

        // ID da atividade
        option.value = atividade.id;

        // Guardar o obra_id para preencher automaticamente a obra
        option.dataset.obraId = atividade.obra_id || '';

        // ================================
        // DADOS DA ATIVIDADE
        // ================================
        const tecnico = atividade.tecnico || '';

        const dataHora = atividade.data_hora_inicio
            ? formatarDataTexto(atividade.data_hora_inicio)
            : '';

        const servico = atividade.servico || '';

        // ================================
        // DADOS DA OBRA
        // ================================
        const obra = atividade.obras;

        const numeroObra = obra?.numero_obra || '';
        const localObra = obra?.local_obra || '';
        const empresa = obra?.empresa || '';
        const concelho = obra?.concelho || '';

        // ================================
        // TEXTO DO SELECT
        // ================================
        const partes = [
            tecnico,
            dataHora,
            numeroObra,
            localObra,
            empresa,
            servico
        ].filter(valor => valor !== '');

        option.textContent = partes.join(' | ');

        // Adicionar ao select
        selectAtividade.appendChild(option);
    });

    console.log(
        'Atividades carregadas:',
        atividades.length
    );
}
        
        // ===== AUTO-PREENCHER OBRA PELO obra_id =====
        function configurarAutoPreenchimentoObra() {
            selectAtividade.addEventListener('change', function () {
                const selectedOption = this.options[this.selectedIndex];
                const obraId = selectedOption.dataset.obraId;

                selectObra.classList.remove('auto-filled');

                if (obraId) {
                    for (let i = 0; i < selectObra.options.length; i++) {
                        if (selectObra.options[i].value === obraId) {
                            selectObra.selectedIndex = i;
                            selectObra.classList.add('auto-filled');
                            setTimeout(() => selectObra.classList.remove('auto-filled'), 1500);
                            console.log("✅ Obra auto-preenchida: ID", obraId);
                            return;
                        }
                    }
                    console.warn("⚠️ Obra com ID", obraId, "não encontrada no select");
                    selectObra.value = "";
                } else {
                    selectObra.value = "";
                }
            });
        }

        // ===== CARREGAR PARA EDIÇÃO =====
        async function carregarParaEdicao(id) {
            showLoading(true);
            document.getElementById('page-title').innerText = 'Editar Ocorrência';
            document.getElementById('btn-save').innerText = '💾 Atualizar Ocorrência';

            const { data, error } = await sbClient
                .from('ocorrencias')
                .select('*')
                .eq('id', id)
                .single();

            showLoading(false);

            if (error || !data) {
                alert('Ocorrência não encontrada.');
                window.location.href = 'historico_ocorrencias.html';
                return;
            }

            document.getElementById('ocorrencia-id').value = data.id;
            document.getElementById('data').value = formatarDataParaInput(data.data);
            document.getElementById('ocorrencia').value = data.ocorrencia || '';
            
            if (data.atividade_id) {
                selectAtividade.value = data.atividade_id;
                selectAtividade.dispatchEvent(new Event('change'));
            }

            if (data.obra_id) {
                selectObra.value = data.obra_id;
            }
        }

        // ===== GUARDAR =====
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            showLoading(true);

            const id = document.getElementById('ocorrencia-id').value;
            const payload = {
                data: document.getElementById('data').value,
                ocorrencia: document.getElementById('ocorrencia').value,
                atividade_id: selectAtividade.value || null,
                obra_id: selectObra.value || null
            };

            let result;
            if (id) {
                result = await sbClient.from('ocorrencias').update(payload).eq('id', id);
            } else {
                result = await sbClient.from('ocorrencias').insert(payload);
            }

            showLoading(false);

            if (result.error) {
                console.error("Erro ao guardar:", result.error);
                alert('Erro ao guardar: ' + result.error.message);
            } else {
                alert(id ? 'Ocorrência atualizada com sucesso!' : 'Ocorrência registada com sucesso!');
                window.location.href = 'historico_ocorrencias.html';
            }
        });

        // ===== INICIALIZAÇÃO =====
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) { 
                window.location.href = 'index.html'; 
                return; 
            }
            document.getElementById('utilizador-info').innerText = session.user.email;

            await carregarAtividadesNoSelect();
            configurarAutoPreenchimentoObra();

            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('id');
            if (editId) {
                await carregarParaEdicao(editId);
            } else {
                document.getElementById('data').value = formatarDataParaInput(new Date().toISOString());
            }
        });
    </script>
</body>
</html>
