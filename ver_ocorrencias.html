<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Ocorrências</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { background-color: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .btn-voltar { background: #334155; color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: bold; }
        .toolbar-header { flex-wrap: wrap; gap: 10px; }
        .toolbar-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        #tabela-ocorrencias-wrap { margin-top: 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        #tabela-ocorrencias { font-size: 13px; }
        #filtro-pesquisa { width: 100%; max-width: 300px; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 16px; }
        .btn-apagar { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .link-anexo { color: #60a5fa; text-decoration: none; }
        .sem-registo { color: #64748b; }

        /* ===== Botão/indicador de fotos na tabela ===== */
        .btn-fotos {
            background: #334155;
            color: #60a5fa;
            border: 1px solid #3b82f6;
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-fotos:hover { background: #3b4a63; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.aberta { display: flex; }
        .modal-conteudo {
            position: relative;
            background: #1e293b;
            border-radius: 10px;
            padding: 24px;
            max-width: 480px;
            width: 90vw;
            color: white;
        }
        .modal-conteudo p { margin: 6px 0; }
        .modal-conteudo strong { color: #60a5fa; }
        .modal-fechar {
            position: absolute;
            top: -14px;
            right: -14px;
            background: #ef4444;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-imagem-conteudo {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
        }
        .modal-imagem-conteudo img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* ===== Modal galeria de fotografias da ocorrência ===== */
        .modal-fotos-conteudo {
            position: relative;
            background: #1e293b;
            border-radius: 10px;
            padding: 24px;
            max-width: 640px;
            width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            color: white;
        }
        .galeria-fotos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }
        .foto-galeria-thumb {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #475569;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .foto-galeria-thumb:hover { transform: scale(1.03); border-color: #3b82f6; }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .toolbar-actions a, .toolbar-actions button { flex: 1 1 auto; text-align: center; margin-right: 0; }
        }
    </style>
</head>
<body>

    <div>Utilizador: <strong id="utilizador-info" style="font-weight: bold; color: #60a5fa;">A verificar...</strong></div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;" class="toolbar-header">
        <h1 style="margin: 0;">Histórico de Ocorrências <span id="contador-ocorrencias" style="color: #64748b; font-size: 0.8em;"></span></h1>
        <div class="toolbar-actions">
            <a href="registo_ocorrencia.html" style="background: #0ea5e9; color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: bold; display: inline-block;">➕ Adicionar Ocorrência</a>
            <button id="btn-guardar" onclick="guardarAlteracoes()" style="background: #22c55e; padding: 10px; border:none; color:white; border-radius:5px; cursor:pointer;">💾 Guardar Alterações</button>
            <a href="index.html" class="btn-voltar">⬅ Voltar</a>
        </div>
    </div>

    <input type="text" id="filtro-pesquisa" placeholder="🔍 Pesquisar">

    <div id="tabela-ocorrencias-wrap">
        <div id="tabela-ocorrencias"></div>
    </div>

    <!-- Modal de detalhes da atividade associada -->
    <div id="modal-atividade" class="modal-overlay" onclick="fecharModalAtividadeSeBackdrop(event)">
        <div class="modal-conteudo" onclick="event.stopPropagation()">
            <button type="button" class="modal-fechar" onclick="fecharModalAtividade()" aria-label="Fechar">✕</button>
            <h3 id="modal-atividade-titulo" style="margin-top:0;"></h3>
            <div id="modal-atividade-corpo"></div>
        </div>
    </div>

    <!-- Modal galeria de fotografias da ocorrência -->
    <div id="modal-fotos" class="modal-overlay" onclick="fecharModalFotosSeBackdrop(event)">
        <div class="modal-fotos-conteudo" onclick="event.stopPropagation()">
            <button type="button" class="modal-fechar" onclick="fecharModalFotos()" aria-label="Fechar">✕</button>
            <h3 id="modal-fotos-titulo" style="margin-top:0;"></h3>
            <div id="modal-fotos-corpo" class="galeria-fotos-grid"></div>
        </div>
    </div>

    <!-- Modal para visualizar uma foto/anexo em tamanho grande -->
    <div id="modal-anexo" class="modal-overlay" onclick="fecharModalAnexoSeBackdrop(event)">
        <div class="modal-imagem-conteudo">
            <button type="button" class="modal-fechar" onclick="fecharModalAnexo()" aria-label="Fechar">✕</button>
            <img id="modal-anexo-img" src="" alt="Fotografia">
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dunondjiqawovisnwavg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_WekrBSs5JOjnJ1SGxFvmKQ_3v6AnBMs';
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let table = null;
        let mapaObrasGlobal = {};
        let mapaAtividadesGlobal = {};

        // ===== Deteção de alterações (snapshot) =====
        // Só os campos que pertencem à tabela "ocorrencias".
        // A obra associa-se pelo obra_id e a atividade pelo atividade_id;
        // os dados das tabelas "obras" e "atividades" nunca são alterados a partir daqui.
        const CAMPOS_GUARDAVEIS = ["data", "ocorrencia", "obra_id", "atividade_id"];
        let idsAlterados = new Set();
        let dadosOriginais = {};

        function guardarSnapshot(dados) {
            dadosOriginais = {};
            dados.forEach(item => {
                const copia = {};
                CAMPOS_GUARDAVEIS.forEach(campo => { copia[campo] = item[campo] ?? null; });
                dadosOriginais[item.id] = copia;
            });
        }

        function linhaFoiAlterada(item) {
            const original = dadosOriginais[item.id];
            if (!original) return true;
            return CAMPOS_GUARDAVEIS.some(campo => (item[campo] ?? null) !== (original[campo] ?? null));
        }

        // ===== Formatação de datas =====
        function formatarDataHoraTexto(valor) {
            if (!valor) return '';
            const [data, hora] = String(valor).split('T');
            if (!data) return valor;
            const [ano, mes, dia] = data.split('-');
            const horaLimpa = hora ? hora.substring(0, 5) : '';
            return horaLimpa ? `${dia}/${mes}/${ano} ${horaLimpa}` : `${dia}/${mes}/${ano}`;
        }

        function formatarDataHora(cell) {
            const valor = cell.getValue();
            if (!valor) return '—';
            return formatarDataHoraTexto(valor);
        }

        // ===== Textos de obra / atividade =====
        function textoObra(o) {
            if (!o) return '';
            return [o.numero_obra, o.local_obra].filter(Boolean).join(' - ');
        }

        function textoAtividade(a) {
            if (!a) return '';
            const obra = mapaObrasGlobal[a.obra_id];
            const data = a.data_hora_inicio ? formatarDataHoraTexto(a.data_hora_inicio) + ' · ' : '';
            const servico = a.servico ? ' (' + a.servico.substring(0, 40) + (a.servico.length > 40 ? '...' : '') + ')' : '';
            return '#' + a.id + ' · ' + data + (a.tecnico || 'Sem técnico') + (obra ? ' - ' + textoObra(obra) : '') + servico;
        }

        // Atualiza os campos auxiliares de uma ocorrência (para a tabela e para a pesquisa)
        function recalcularInfo(o) {
            o.obra_info = mapaObrasGlobal[o.obra_id] || null;
            o.atividade_info = mapaAtividadesGlobal[o.atividade_id] || null;
            o.obra_texto = textoObra(o.obra_info);
            o.atividade_texto = textoAtividade(o.atividade_info);
        }

        // ===== Normalizar o campo "fotos" (pode vir como array ou como texto JSON) =====
        function obterListaFotos(valor) {
            if (!valor) return [];
            if (Array.isArray(valor)) return valor;
            if (typeof valor === 'string') {
                try {
                    const parsed = JSON.parse(valor);
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    return [];
                }
            }
            return [];
        }

        // ===== Modais =====
        function abrirModalAtividade(a) {
            if (!a) return;
            const obra = mapaObrasGlobal[a.obra_id] || {};
            document.getElementById('modal-atividade-titulo').innerText = '📊 Atividade #' + a.id;
            document.getElementById('modal-atividade-corpo').innerHTML =
                '<p><strong>Técnico:</strong> ' + (a.tecnico || '—') + '</p>' +
                '<p><strong>Início:</strong> ' + (formatarDataHoraTexto(a.data_hora_inicio) || '—') + '</p>' +
                '<p><strong>Fim:</strong> ' + (formatarDataHoraTexto(a.data_hora_fim) || '—') + '</p>' +
                '<p><strong>Local/Obra:</strong> ' + (obra.local_obra || '—') + '</p>' +
                '<p><strong>Nº Obra:</strong> ' + (obra.numero_obra || '—') + '</p>' +
                '<p><strong>Serviço:</strong> ' + (a.servico || '—') + '</p>' +
                (a.anexo ? '<p><a class="link-anexo" href="javascript:void(0)" onclick="fecharModalAtividade(); abrirModalAnexo(\'' + a.anexo + '\')">🖼️ Ver anexo</a></p>' : '');
            document.getElementById('modal-atividade').classList.add('aberta');
            document.body.style.overflow = 'hidden';
        }

        function fecharModalAtividade() {
            document.getElementById('modal-atividade').classList.remove('aberta');
            document.body.style.overflow = '';
        }

        function fecharModalAtividadeSeBackdrop(e) {
            if (e.target.id === 'modal-atividade') fecharModalAtividade();
        }

        // ===== Modal galeria de fotografias da ocorrência =====
        function abrirModalFotos(fotos, ocorrenciaId) {
            const lista = obterListaFotos(fotos);
            if (lista.length === 0) return;

            document.getElementById('modal-fotos-titulo').innerText = `📷 Fotografias da Ocorrência #${ocorrenciaId} (${lista.length})`;

            const corpo = document.getElementById('modal-fotos-corpo');
            corpo.innerHTML = '';
            lista.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.alt = 'Fotografia da ocorrência';
                img.className = 'foto-galeria-thumb';
                img.addEventListener('click', () => {
                    fecharModalFotos();
                    abrirModalAnexo(url);
                });
                corpo.appendChild(img);
            });

            document.getElementById('modal-fotos').classList.add('aberta');
            document.body.style.overflow = 'hidden';
        }

        function fecharModalFotos() {
            document.getElementById('modal-fotos').classList.remove('aberta');
            document.body.style.overflow = '';
        }

        function fecharModalFotosSeBackdrop(e) {
            if (e.target.id === 'modal-fotos') fecharModalFotos();
        }

        function abrirModalAnexo(url) {
            document.getElementById('modal-anexo-img').src = url;
            document.getElementById('modal-anexo').classList.add('aberta');
            document.body.style.overflow = 'hidden';
        }

        function fecharModalAnexo() {
            document.getElementById('modal-anexo').classList.remove('aberta');
            document.getElementById('modal-anexo-img').src = '';
            document.body.style.overflow = '';
        }

        function fecharModalAnexoSeBackdrop(e) {
            if (e.target.id === 'modal-anexo') fecharModalAnexo();
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { fecharModalAtividade(); fecharModalFotos(); fecharModalAnexo(); }
        });

        // ===== Contador =====
        function atualizarContador() {
            if (table) {
                const contagem = table.getRows("active").length;
                document.getElementById("contador-ocorrencias").innerText = "(" + contagem + ")";
            }
        }

        // ===== Carregar ocorrências, obras e atividades =====
        async function carregarOcorrencias() {
            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            document.getElementById('utilizador-info').innerText = session.user.email;

            const { data, error } = await sbClient
                .from('ocorrencias')
                .select('*')
                .order('id', { ascending: false });

            if (error) { console.error("Erro ao carregar:", error); return; }

            // Obras (fonte oficial de nº, local, empresa, concelho)
            const { data: obrasData, error: errObras } = await sbClient
                .from('obras')
                .select('id, numero_obra, local_obra, empresa, concelho')
                .order('numero_obra', { ascending: true });
            if (errObras) console.error("Erro ao carregar obras:", errObras);

            mapaObrasGlobal = {};
            (obrasData || []).forEach(o => { mapaObrasGlobal[o.id] = o; });

            // Atividades (a tabela "atividades" não tem local_obra/numero_obra; tem obra_id)
            const { data: atividadesData, error: errAtividades } = await sbClient
                .from('atividades')
                .select('id, tecnico, data_hora_inicio, data_hora_fim, servico, anexo, obra_id')
                .order('id', { ascending: false });
            if (errAtividades) console.error("Erro ao carregar atividades:", errAtividades);

            mapaAtividadesGlobal = {};
            (atividadesData || []).forEach(a => { mapaAtividadesGlobal[a.id] = a; });

            data.forEach(recalcularInfo);
            guardarSnapshot(data);

            // Listas para os seletores
            const valoresObras = Object.values(mapaObrasGlobal).map(o => ({
                label: textoObra(o) || ('Obra #' + o.id),
                value: o.id
            }));
            const valoresAtividades = Object.values(mapaAtividadesGlobal).map(a => ({
                label: textoAtividade(a),
                value: a.id
            }));

            table = new Tabulator("#tabela-ocorrencias", {
                data: data,
                layout: "fitData",
                pagination: "local",
                paginationSize: 15,
                columns: [
                    { title: "Data", field: "data", formatter: formatarDataHora, editor: "input", width: 150 },
                    { title: "Ocorrência", field: "ocorrencia", editor: "textarea", formatter: "plaintext", minWidth: 300 },
                    // ===== Obra (seletor) =====
                    { title: "Obra", field: "obra_id", minWidth: 240,
                        editor: "list",
                        editorParams: {
                            values: valoresObras,
                            autocomplete: true,
                            listOnEmpty: true,
                            clearable: true,
                            placeholderEmpty: "Sem resultados"
                        },
                        formatter: function (cell) {
                            const texto = textoObra(mapaObrasGlobal[cell.getValue()]);
                            return texto ? texto + " <span style='color:#64748b;'>✎</span>" : "<span class='sem-registo'>— escolher obra ✎</span>";
                        }
                    },
                    // ===== Atividade associada (seletor) =====
                    { title: "Atividade", field: "atividade_id", minWidth: 300,
                        editor: "list",
                        editorParams: {
                            values: valoresAtividades,
                            autocomplete: true,
                            listOnEmpty: true,
                            clearable: true,
                            placeholderEmpty: "Sem resultados"
                        },
                        formatter: function (cell) {
                            const a = mapaAtividadesGlobal[cell.getValue()];
                            return a ? "📊 " + textoAtividade(a) + " <span style='color:#64748b;'>✎</span>" : "<span class='sem-registo'>— sem atividade ✎</span>";
                        }
                    },
                    // ===== Ver detalhes da atividade =====
                    { title: "", field: "atividade_info", headerSort: false, width: 70, hozAlign: "center",
                        formatter: function (cell) {
                            const d = cell.getRow().getData();
                            return d.atividade_info ? "<a class='link-anexo' href='javascript:void(0)'>🔍 Ver</a>" : "<span class='sem-registo'>—</span>";
                        },
                        cellClick: function (e, cell) {
                            const d = cell.getRow().getData();
                            if (d.atividade_info) abrirModalAtividade(d.atividade_info);
                        }
                    },
                    // ===== Fotografias associadas à ocorrência =====
                    { title: "Fotos", field: "fotos", formatter: function (cell) {
                        const lista = obterListaFotos(cell.getValue());
                        if (lista.length === 0) return "<span class='sem-registo'>—</span>";
                        return "<button class='btn-fotos'>📷 " + lista.length + "</button>";
                    }, width: 100, hozAlign: "center", cellClick: function (e, cell) {
                        const rowData = cell.getRow().getData();
                        abrirModalFotos(rowData.fotos, rowData.id);
                    }},
                    { title: "Ações", formatter: function (cell) {
                        return "<button class='btn-apagar'>Apagar</button>";
                    }, width: 90, hozAlign: "center", cellClick: function (e, cell) {
                        if (e.target.classList.contains('btn-apagar')) {
                            if (confirm("Apagar esta ocorrência?")) {
                                const id = cell.getRow().getData().id;
                                sbClient.from('ocorrencias').delete().eq('id', id).then(() => {
                                    idsAlterados.delete(id);
                                    cell.getRow().delete();
                                    atualizarContador();
                                });
                            }
                        }
                    }}
                ]
            });

            table.on("tableBuilt", atualizarContador);
            table.on("dataFiltered", atualizarContador);

            table.on("cellEdited", function (cell) {
                const row = cell.getRow();
                const campo = cell.getField();
                const dados = row.getData();

                if (campo === "atividade_id") {
                    const novaId = cell.getValue() ? Number(cell.getValue()) : null;
                    const atividade = novaId ? mapaAtividadesGlobal[novaId] : null;
                    const alteracoes = { atividade_id: novaId };
                    // Ao associar uma atividade, a obra passa a ser a da atividade
                    if (atividade && atividade.obra_id) alteracoes.obra_id = atividade.obra_id;
                    Object.assign(dados, alteracoes);
                    recalcularInfo(dados);
                    row.update(Object.assign({}, alteracoes, {
                        atividade_info: dados.atividade_info,
                        atividade_texto: dados.atividade_texto,
                        obra_info: dados.obra_info,
                        obra_texto: dados.obra_texto
                    }));
                } else if (campo === "obra_id") {
                    const novaId = cell.getValue() ? Number(cell.getValue()) : null;
                    dados.obra_id = novaId;
                    recalcularInfo(dados);
                    row.update({ obra_id: novaId, obra_info: dados.obra_info, obra_texto: dados.obra_texto });
                }

                idsAlterados.add(dados.id);
            });

            document.getElementById("filtro-pesquisa").addEventListener("keyup", function () {
                table.setFilter(function (data) {
                    const termo = document.getElementById("filtro-pesquisa").value.toLowerCase();
                    return Object.values(data).some(val =>
                        String(val).toLowerCase().includes(termo)
                    );
                });
            });
        }

        // ===== Guardar edições feitas na tabela =====
        // Só envia as linhas realmente alteradas, em paralelo.
        // Só a tabela "ocorrencias" é alterada.
        async function guardarAlteracoes() {
            if (!table) return;

            // Fecha qualquer editor de célula ainda aberto
            document.activeElement && document.activeElement.blur();

            const dados = table.getData();
            const linhasParaGuardar = dados.filter(item => idsAlterados.has(item.id) || linhaFoiAlterada(item));

            if (linhasParaGuardar.length === 0) {
                alert("Não há alterações por guardar.");
                return;
            }

            const btn = document.getElementById('btn-guardar');
            const textoOriginal = btn.innerText;
            btn.disabled = true;
            btn.innerText = "⏳ A guardar...";

            try {
                const resultados = await Promise.all(linhasParaGuardar.map(async item => {
                    const { error } = await sbClient
                        .from('ocorrencias')
                        .update({
                            data: item.data,
                            ocorrencia: item.ocorrencia,
                            obra_id: item.obra_id || null,
                            atividade_id: item.atividade_id || null
                        })
                        .eq('id', item.id);
                    return { id: item.id, item, error: error || null };
                }));

                const falhas = resultados.filter(r => r.error);
                falhas.forEach(r => console.error("Erro ao atualizar ID " + r.id, r.error));

                // Atualiza o snapshot só das linhas guardadas com sucesso
                resultados.filter(r => !r.error).forEach(r => {
                    const copia = {};
                    CAMPOS_GUARDAVEIS.forEach(campo => { copia[campo] = r.item[campo] ?? null; });
                    dadosOriginais[r.id] = copia;
                    idsAlterados.delete(r.id);
                });

                if (falhas.length === 0) {
                    alert("Alterações guardadas com sucesso! (" + linhasParaGuardar.length + " registo(s))");
                } else {
                    alert(falhas.length + " registo(s) falharam ao guardar. Verifica a consola (F12).");
                }
            } finally {
                btn.disabled = false;
                btn.innerText = textoOriginal;
            }
        }

        carregarOcorrencias();
    </script>
</body>
</html>
