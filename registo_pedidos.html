<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝Registo de Pedidos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; font-family: Arial, sans-serif; color: white; padding: 30px; }
    .container { max-width: 900px; margin: auto; background: #1e293b; padding: 35px; border-radius: 18px; box-shadow: 0 0 30px rgba(0,0,0,0.4); }
    .header-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .user-info { color: #94a3b8; font-size: 0.9em; margin-bottom: 20px; }
    h1 { font-size: 34px; }
    .btn-voltar { background: #334155; color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
    input, textarea, select { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #334155; color: white; font-size: 16px; }
    input[readonly] { cursor: pointer; }
    .tecnico-picker { background:#334155; padding:14px; border-radius:10px; min-height: 50px; display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap; gap: 10px; }
    .tecnico-picker label { display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom: 0; font-size: 15px; color: white; }
    .tecnico-picker input[type="checkbox"] { width: auto; }
    button { width: 100%; margin-top: 25px; padding: 16px; border: none; border-radius: 10px; background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .success { display: none; margin-top: 20px; background: #065f46; padding: 15px; border-radius: 10px; text-align: center; }

    /* Ajuste para dispositivos móveis */
    @media (max-width: 640px) {
        body { padding: 15px; }
        .container { padding: 20px; border-radius: 14px; }
        h1 { font-size: 24px; }
        .grid { grid-template-columns: 1fr; gap: 12px; }
    }

    /* ===== Custom Date/Time Picker ===== */
    .dt-picker-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .dt-picker-overlay.open { display: flex; }
    .dt-picker {
      background: #1e293b;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .dt-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .dt-picker-header span {
      font-weight: bold;
      font-size: 17px;
      text-transform: capitalize;
    }
    .dt-nav {
      width: 38px;
      margin-top: 0;
      padding: 8px 0;
      background: #334155;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1;
    }
    .dt-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      color: #93c5fd;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .dt-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .dt-day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      background: transparent;
      color: white;
    }
    .dt-day:hover { background: #334155; }
    .dt-day.dt-empty { cursor: default; }
    .dt-day.dt-empty:hover { background: transparent; }
    .dt-day.dt-today { border: 1px solid #60a5fa; }
    .dt-day.dt-selected { background: #2563eb; font-weight: bold; }
    .dt-time {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }
    .dt-time label { margin-bottom: 0; white-space: nowrap; }
    .dt-time input {
      width: 60px;
      padding: 10px;
      text-align: center;
      font-size: 15px;
    }
    .dt-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .dt-actions button {
      margin-top: 0;
      flex: 1;
      padding: 12px;
      font-size: 14px;
    }
    #dtCancel { background: #334155; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-area">
      <h1>Registo de Pedidos</h1>
      <a href="index.html" class="btn-voltar">⬅ Voltar</a>
    </div>

    <div class="user-info">Utilizador: <span id="user-display" style="color: #60a5fa;">A carregar...</span></div>

    <form id="formulario">
      <input type="hidden" name="data_conclusao" value="">

      <div class="grid">
        <div>
          <label>Nome do Técnico *</label>
          <div class="tecnico-picker">
            <label>
              <input type="checkbox" name="tecnico" value="Daniel P" class="tecnicoCheck">
              Daniel P
            </label>
            <label>
              <input type="checkbox" name="tecnico" value="Francisco S" class="tecnicoCheck">
              Francisco S
            </label>
          </div>
        </div>
        <div>
          <label>Data + Hora do Pedido *</label>
          <input type="text" id="dataHoraPedidoDisplay" placeholder="Selecionar data e hora" readonly required autocomplete="off">
          <input type="hidden" id="dataHoraPedido" name="data_hora_pedido">
        </div>
        <div><label>Requerente *</label><input type="text" name="requerente" required></div>
        <div><label>Empresa *</label>
          <select name="empresa" required>
            <option value="">Selecionar</option>
            <option value="CCR ENG&CONST">CCR ENG&CONST</option>
            <option value="CCR-INVEST">CCR-INVEST</option>
            <option value="GROWNOR">GROWNOR</option>
            <option value="WEST-VIEW">WEST-VIEW</option>
            <option value="GRAU-ON">GRAU-ON</option>
            <option value="FERCAYO">FERCAYO</option>
            <option value="DECIBOLT">DECIBOLT</option>
            <option value="INTERNO">INTERNO</option>
            <option value="EXTERNO">EXTERNO</option>
          </select>
        </div>
        <div><label>Via de Comunicação *</label>
          <select id="viaSelect" name="via" required>
            <option value="Chamada">Chamada</option>
            <option value="Email">Email</option>
            <option value="Whatsapp">Whatsapp</option>
            <option value="Presencial">Presencial</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        <div id="campoOutroDiv" style="display: none;">
          <label>Especifique via "Outros" *</label>
          <input type="text" id="inputOutro" name="via_outro">
        </div>
        
        <div><label>Urgência</label>
          <select name="urgencia">
            <option value="Selecionar">Selecionar</option>
            <option value="Baixa">Baixa 🟢</option>
            <option value="Média">Média 🟡</option>
            <option value="Alta">Alta 🔴</option>
          </select>
        </div>

        <div><label>Local / Obra *</label><input type="text" name="local_obra" id="inputLocalObra" list="lista-local-obra" autocomplete="off" required>
          <datalist id="lista-local-obra"></datalist>
        </div>
        <div><label>Nº Obra</label><input type="text" name="numero_obra" id="inputNumeroObra" list="lista-numero-obra" autocomplete="off">
          <datalist id="lista-numero-obra"></datalist>
        </div>
        <div><label>Concelho *</label><input type="text" name="concelho" required></div>
        <div class="full"><label>Serviço solicitado *</label><textarea name="servico" required></textarea></div>
        <div class="full"><label>Observação</label><textarea name="observacao"></textarea></div>
        
        <div class="full">
          <label>Tipo de Trabalho *</label>
          <div class="tecnico-picker">
            <label><input type="checkbox" name="tipo_trabalho" value="Lev. Topográfico" class="tipoTrabalhoCheck"> Lev. Topográfico</label>
            <label><input type="checkbox" name="tipo_trabalho" value="Monitorização" class="tipoTrabalhoCheck"> Monitorização</label>
            <label><input type="checkbox" name="tipo_trabalho" value="Implantação" class="tipoTrabalhoCheck"> Implantação</label>
            <label><input type="checkbox" name="tipo_trabalho" value="Gabinete / Estudos" class="tipoTrabalhoCheck"> Gabinete / Estudos</label>
          </div>
        </div>

        <div><label>Frequência *</label>
          <select name="frequencia" required>
            <option value="Única">Única</option>
            <option value="Contínua">Contínua</option>
            <option value="Diária">Diária</option>
            <option value="Semanal">Semanal</option>
            <option value="Mensal">Mensal</option>
            <option value="Trimestral">Trimestral</option>
          </select>
        </div>
        <div>
          <label>Data Limite</label>
          <input type="text" id="dataHoraLimiteDisplay" placeholder="Selecionar data e hora" readonly autocomplete="off">
          <input type="hidden" id="dataHoraLimite" name="data_hora_limite">
        </div>
      </div>
      <button type="submit" id="btnEnviar">Enviar Pedido</button>
    </form>
    <div class="success" id="successMessage">✅ Pedido guardado com sucesso!</div>
  </div>

  <!-- Popup do calendário personalizado -->
  <div class="dt-picker-overlay" id="dtPickerOverlay">
    <div class="dt-picker">
      <div class="dt-picker-header">
        <button type="button" class="dt-nav" id="dtPrevMonth">‹</button>
        <span id="dtMonthLabel"></span>
        <button type="button" class="dt-nav" id="dtNextMonth">›</button>
      </div>
      <div class="dt-weekdays">
        <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
      </div>
      <div class="dt-days" id="dtDays"></div>
      <div class="dt-time">
        <label>Hora:</label>
        <input type="number" id="dtHour" min="0" max="23" value="00">
        <span>:</span>
        <input type="number" id="dtMinute" min="0" max="59" value="00">
      </div>
      <div class="dt-actions">
        <button type="button" id="dtCancel">Cancelar</button>
        <button type="button" id="dtConfirm">Confirmar</button>
      </div>
    </div>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const supabaseUrl = 'https://dunondjiqawovisnwavg.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bm9uZGppcWF3b3Zpc253YXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTk3MjIsImV4cCI6MjA5NTYzNTcyMn0.KY5xnuHCixsO0a4yCzXP6CmO8e08v1wrDjoGCL-LTro';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById("formulario");
    const viaSelect = document.getElementById("viaSelect");
    const campoOutroDiv = document.getElementById("campoOutroDiv");
    const inputOutro = document.getElementById("inputOutro");

    // ===== Utilitários de data =====
    function pad2(n) { return String(n).padStart(2, '0'); }

    function toIsoLocal(date) {
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}T${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    const nomesDiaSemana = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
    function toDisplayFormat(date) {
      const diaSemana = nomesDiaSemana[date.getDay()];
      return `${diaSemana}, ${pad2(date.getDate())}/${pad2(date.getMonth() + 1)}/${date.getFullYear()} ${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    // Preencher data e hora atual no campo "Data + Hora do Pedido"
    function definirDataPedidoAtual() {
      const now = new Date();
      document.getElementById("dataHoraPedido").value = toIsoLocal(now);
      document.getElementById("dataHoraPedidoDisplay").value = toDisplayFormat(now);
    }

    // ===== Calendário personalizado (com dias da semana visíveis) =====
    const overlay = document.getElementById('dtPickerOverlay');
    const monthLabel = document.getElementById('dtMonthLabel');
    const daysGrid = document.getElementById('dtDays');
    const hourInput = document.getElementById('dtHour');
    const minuteInput = document.getElementById('dtMinute');
    const btnPrevMonth = document.getElementById('dtPrevMonth');
    const btnNextMonth = document.getElementById('dtNextMonth');
    const btnCancel = document.getElementById('dtCancel');
    const btnConfirm = document.getElementById('dtConfirm');

    const nomesMes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

    let activeHiddenInput = null;
    let activeDisplayInput = null;
    let viewYear, viewMonth;
    let selectedDate = null;

    function parseCurrentValue(hiddenInput) {
      const val = hiddenInput.value;
      if (!val) return null;
      const [datePart, timePart] = val.split('T');
      const [y, m, d] = datePart.split('-').map(Number);
      const [hh, mm] = (timePart || '00:00').split(':').map(Number);
      return new Date(y, m - 1, d, hh, mm);
    }

    function renderCalendar() {
      monthLabel.textContent = `${nomesMes[viewMonth]} de ${viewYear}`;
      daysGrid.innerHTML = '';

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
      const today = new Date();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'dt-day dt-empty';
        daysGrid.appendChild(empty);
      }

      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement('div');
        cell.className = 'dt-day';
        cell.textContent = d;

        const isToday = today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === d;
        if (isToday) cell.classList.add('dt-today');

        if (selectedDate && selectedDate.getFullYear() === viewYear && selectedDate.getMonth() === viewMonth && selectedDate.getDate() === d) {
          cell.classList.add('dt-selected');
        }

        cell.addEventListener('click', () => {
          selectedDate = new Date(viewYear, viewMonth, d, Number(hourInput.value) || 0, Number(minuteInput.value) || 0);
          renderCalendar();
        });

        daysGrid.appendChild(cell);
      }
    }

    function openPicker(hiddenInput, displayInput) {
      activeHiddenInput = hiddenInput;
      activeDisplayInput = displayInput;

      const current = parseCurrentValue(hiddenInput) || new Date();
      selectedDate = parseCurrentValue(hiddenInput);
      viewYear = current.getFullYear();
      viewMonth = current.getMonth();
      hourInput.value = pad2(current.getHours());
      minuteInput.value = pad2(current.getMinutes());

      renderCalendar();
      overlay.classList.add('open');
    }

    function closePicker() {
      overlay.classList.remove('open');
      activeHiddenInput = null;
      activeDisplayInput = null;
    }

    btnPrevMonth.addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderCalendar();
    });

    btnNextMonth.addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderCalendar();
    });

    [hourInput, minuteInput].forEach(inp => {
      inp.addEventListener('change', () => {
        let val = Number(inp.value);
        const max = inp === hourInput ? 23 : 59;
        if (isNaN(val) || val < 0) val = 0;
        if (val > max) val = max;
        inp.value = pad2(val);
      });
    });

    btnCancel.addEventListener('click', closePicker);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closePicker();
    });

    btnConfirm.addEventListener('click', () => {
      if (!activeHiddenInput) { closePicker(); return; }

      const baseDate = selectedDate || new Date(viewYear, viewMonth, 1);
      const finalDate = new Date(
        baseDate.getFullYear(),
        baseDate.getMonth(),
        baseDate.getDate(),
        Number(hourInput.value) || 0,
        Number(minuteInput.value) || 0
      );

      activeHiddenInput.value = toIsoLocal(finalDate);
      activeDisplayInput.value = toDisplayFormat(finalDate);
      closePicker();
    });

    const dataHoraPedidoDisplay = document.getElementById('dataHoraPedidoDisplay');
    const dataHoraPedido = document.getElementById('dataHoraPedido');
    const dataHoraLimiteDisplay = document.getElementById('dataHoraLimiteDisplay');
    const dataHoraLimite = document.getElementById('dataHoraLimite');

    dataHoraPedidoDisplay.addEventListener('click', () => openPicker(dataHoraPedido, dataHoraPedidoDisplay));
    dataHoraLimiteDisplay.addEventListener('click', () => openPicker(dataHoraLimite, dataHoraLimiteDisplay));

    // Mapas para preenchimento automático cruzado entre Local/Obra e Nº Obra
    let mapaLocalParaObra = {};
    let mapaObraParaLocal = {};

    async function carregarHistoricoLocais() {
      try {
        const [{ data: atividadesData }, { data: pedidosData }] = await Promise.all([
          supabaseClient.from('atividades').select('local_obra, numero_obra').order('id', { ascending: false }),
          supabaseClient.from('pedidos').select('local_obra, numero_obra').order('id', { ascending: false })
        ]);

        const combos = [...(atividadesData || []), ...(pedidosData || [])];
        const locaisSet = new Set();
        const obrasSet = new Set();

        combos.forEach(item => {
          const local = (item.local_obra || '').trim();
          const obra = (item.numero_obra || '').trim();

          if (local) {
            locaisSet.add(local);
            if (obra && !(local in mapaLocalParaObra)) {
              mapaLocalParaObra[local] = obra;
            }
          }
          if (obra) {
            obrasSet.add(obra);
            if (local && !(obra in mapaObraParaLocal)) {
              mapaObraParaLocal[obra] = local;
            }
          }
        });

        const datalistLocal = document.getElementById('lista-local-obra');
        locaisSet.forEach(local => {
          const opt = document.createElement('option');
          opt.value = local;
          datalistLocal.appendChild(opt);
        });

        const datalistObra = document.getElementById('lista-numero-obra');
        obrasSet.forEach(obra => {
          const opt = document.createElement('option');
          opt.value = obra;
          datalistObra.appendChild(opt);
        });
      } catch (err) {
        console.error("Erro ao carregar histórico de Local/Obra e Nº Obra:", err);
      }
    }

    // Preenchimento automático Local -> Nº Obra
    document.getElementById('inputLocalObra').addEventListener('input', (e) => {
      const valor = e.target.value.trim();
      if (mapaLocalParaObra[valor]) {
        document.getElementById('inputNumeroObra').value = mapaLocalParaObra[valor];
      }
    });

    // Preenchimento automático Nº Obra -> Local
    document.getElementById('inputNumeroObra').addEventListener('input', (e) => {
      const valor = e.target.value.trim();
      if (mapaObraParaLocal[valor]) {
        document.getElementById('inputLocalObra').value = mapaObraParaLocal[valor];
      }
    });

    viaSelect.addEventListener("change", (e) => {
      if (e.target.value === "Outros") {
        campoOutroDiv.style.display = "block";
        inputOutro.required = true;
      } else {
        campoOutroDiv.style.display = "none";
        inputOutro.required = false;
        inputOutro.value = "";
      }
    });

    supabaseClient.auth.getSession().then(({ data }) => {
      if (!data.session) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('user-display').innerText = data.session.user.email;
        definirDataPedidoAtual();
        carregarHistoricoLocais();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById("btnEnviar");
      btn.disabled = true; 
      btn.innerText = "A gravar...";

      // 1. Validar se pelo menos um Tipo de Trabalho foi selecionado
      const tiposSelecionados = Array.from(document.querySelectorAll('.tipoTrabalhoCheck:checked'))
        .map(cb => cb.value);

      if (tiposSelecionados.length === 0) {
        alert("Por favor, selecione pelo menos um Tipo de Trabalho.");
        btn.disabled = false; 
        btn.innerText = "Enviar Pedido";
        return;
      }

      const formData = new FormData(form);
      const supabaseData = Object.fromEntries(formData.entries());
      
      // Remover o que o FormData captou nativamente (pois só guarda uma opção se houver várias)
      delete supabaseData.tipo_trabalho;

      // 2. Recolher múltiplos checkboxes de técnicos (separados por vírgula)
      const tecnicosSelecionados = Array.from(document.querySelectorAll('.tecnicoCheck:checked'))
        .map(cb => cb.value);
      if (tecnicosSelecionados.length > 0) {
        supabaseData.tecnico = tecnicosSelecionados.join(', ');
      }

      // 3. Inserir os Tipos de Trabalho separados por ";" no objeto final
      supabaseData.tipo_trabalho = tiposSelecionados.join(';');

      if (supabaseData.via === "Outros") {
        supabaseData.via = "Outro: " + supabaseData.via_outro;
      }
      
      const dbData = { ...supabaseData };
      delete dbData.via_outro;

      if (!dbData.data_conclusao || dbData.data_conclusao.trim() === "") {
        delete dbData.data_conclusao;
      }

      if (!dbData.data_hora_limite || dbData.data_hora_limite.trim() === "") {
        delete dbData.data_hora_limite;
      }

      // Inserção na tabela "pedidos"
      const { error } = await supabaseClient.from('pedidos').insert([dbData]);
      
      if (error) { 
        alert("Erro DB: " + error.message); 
        btn.disabled = false; 
        btn.innerText = "Enviar Pedido";
        return; 
      }

      // Sucesso: mensagem, reset do formulário e redefinição da data atual
      document.getElementById("successMessage").style.display = "block";
      form.reset();
      campoOutroDiv.style.display = "none";
      definirDataPedidoAtual();
      dataHoraLimiteDisplay.value = "";
      dataHoraLimite.value = "";
      
      setTimeout(() => { 
        document.getElementById("successMessage").style.display = "none"; 
      }, 5000);
      
      btn.disabled = false; 
      btn.innerText = "Enviar Pedido";
    });
  });
</script>
</body>
</html>
