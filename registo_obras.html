<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏗️ Registo de Obras</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f172a;
            font-family: Arial, sans-serif;
            color: #f1f5f9;
            padding: 30px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: #1e293b;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
        }

        /* CABEÇALHO */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-icon { font-size: 36px; }
        .header-title h1 { font-size: 32px; color: #ffffff; margin-bottom: 4px; }
        .header-title p { font-size: 14px; color: #94a3b8; }

        .user-box { background: #334155; border-radius: 10px; padding: 10px 15px; text-align: right; }
        .user-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 3px; }
        #user-email { font-size: 15px; font-weight: bold; color: #60a5fa; }

        /* BOTÕES */
        .top-buttons { display: flex; gap: 12px; margin-bottom: 25px; }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn:disabled { background: #475569 !important; cursor: not-allowed; transform: none; }

        .btn-voltar { background: #334155; }
        .btn-nova { background: #2563eb; }
        .btn-guardar { background: #059669; }
        .btn-cancelar { background: #475569; }
        .btn-editar { background: #d97706; padding: 8px 12px; font-size: 13px; }
        .btn-apagar { background: #dc2626; padding: 8px 12px; font-size: 13px; }
        .btn-concluir { background: #059669; padding: 8px 12px; font-size: 13px; }
        .btn-reabrir { background: #475569; padding: 8px 12px; font-size: 13px; }
        .btn-toggle { background: #334155; }

        /* FORMULÁRIO E CARDS */
        .form-card, .list-card {
            background: #0f172a;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .form-card h2, .list-header h2 { font-size: 22px; color: #ffffff; margin-bottom: 20px; }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .form-group { display: flex; flex-direction: column; position: relative; }
        .form-group.full { grid-column: 1 / -1; }

        label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; font-weight: normal; }

        input, select {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #334155;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        input::placeholder { color: #94a3b8; }
        input:focus, select:focus { box-shadow: 0 0 0 2px #60a5fa; }

        .form-actions { display: flex; gap: 12px; margin-top: 25px; }

        /* AUTOCOMPLETE EMPRESA */
        .autocomplete-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 10px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .autocomplete-item { padding: 12px 14px; font-size: 14px; color: #e2e8f0; cursor: pointer; }
        .autocomplete-item:hover, .autocomplete-item.ativo { background: #475569; }
        .autocomplete-vazio { padding: 12px 14px; font-size: 13px; color: #94a3b8; }

        /* LISTAGEM E TABELA */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .list-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .contador { font-size: 14px; color: #94a3b8; margin-top: 4px; }
        .search-box { width: 300px; }

        .table-container { width: 100%; overflow-x: auto; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 950px; }
        thead { background: #334155; }
        th { padding: 14px; text-align: left; font-size: 13px; color: #94a3b8; text-transform: uppercase; font-weight: bold; }

        /* ORDENAÇÃO */
        th.ordenavel { cursor: pointer; user-select: none; transition: 0.2s; }
        th.ordenavel:hover { color: #e2e8f0; }
        th .seta { display: inline-block; width: 12px; margin-left: 6px; font-size: 11px; opacity: 0.35; }
        th.ativo { color: #60a5fa; }
        th.ativo .seta { opacity: 1; }

        td { padding: 14px; border-bottom: 1px solid #334155; font-size: 14px; color: #e2e8f0; vertical-align: middle; }
        tbody tr:hover { background: #334155; }

        th.num, td.num { text-align: center; }
        .badge {
            display: inline-block;
            min-width: 32px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1d4ed8;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }
        .badge.zero { background: #334155; color: #94a3b8; }

        .numero-obra { font-weight: bold; color: #60a5fa; }
        tr.concluida td { opacity: 0.55; }
        tr.concluida td:last-child { opacity: 1; }
        tr.concluida .numero-obra { text-decoration: line-through; }

        .acoes { display: flex; gap: 8px; }
        .loading, .sem-resultados { text-align: center; padding: 35px !important; color: #94a3b8; }

        /* LINHAS CLICÁVEIS */
        tbody tr.clicavel { cursor: pointer; }

        /* MODAL DA OBRA */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            padding: 30px 15px;
            overflow-y: auto;
        }
        .modal-overlay.aberto { display: flex; }

        .modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 1100px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        .modal-header h2 { font-size: 22px; color: #fff; margin-bottom: 6px; }
        .modal-header .sub { font-size: 14px; color: #94a3b8; line-height: 1.5; }
        .btn-fechar { background: #334155; padding: 8px 14px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .tab {
            background: #334155;
            color: #cbd5e1;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab:hover { filter: brightness(1.15); }
        .tab.ativo { background: #2563eb; color: #fff; }
        .tab .badge { margin-left: 6px; background: rgba(255,255,255,0.2); }

        .modal table { min-width: 700px; }
        .modal td.texto-longo { max-width: 380px; white-space: pre-wrap; word-break: break-word; }

        .estado {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #475569;
            color: #fff;
        }
        .estado.pendente { background: #d97706; }
        .estado.concluido { background: #059669; }

        .fotos { display: flex; gap: 6px; flex-wrap: wrap; }
        .fotos img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid #475569; }
        .fotos a, .link-anexo { color: #60a5fa; font-size: 13px; text-decoration: none; }
        .fotos a:hover, .link-anexo:hover { text-decoration: underline; }

        /* MENSAGENS (TOAST) */
        #mensagens {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }
        .mensagem {
            padding: 14px 18px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            animation: aparecer 0.2s ease;
        }
        .mensagem.sucesso { background: #059669; }
        .mensagem.erro { background: #dc2626; }
        .mensagem.info { background: #2563eb; }

        @keyframes aparecer {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* RESPONSIVO */
        @media (max-width: 700px) {
            body { padding: 15px; }
            .container { padding: 20px; border-radius: 14px; }
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .user-box { width: 100%; text-align: left; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            .top-buttons, .form-actions { flex-direction: column; }
            .btn { width: 100%; }
            .list-header { flex-direction: column; align-items: stretch; }
            .list-tools { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            #mensagens { left: 15px; right: 15px; max-width: none; }
            .modal { padding: 15px; }
            .modal-header { flex-direction: column; }
        }
    </style>
</head>

<body>

<div id="mensagens"></div>

<div class="container">

    <!-- CABEÇALHO -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon">🏗️</div>
            <div class="header-title">
                <h1>Registo de Obras</h1>
                <p>Gestão das obras de topografia</p>
            </div>
        </div>

        <div class="user-box">
            <div class="user-label">Utilizador</div>
            <div id="user-email">A carregar...</div>
        </div>
    </div>

    <!-- BOTÕES -->
    <div class="top-buttons">
        <button type="button" class="btn btn-voltar" onclick="voltarInicio()">⬅ Voltar</button>
        <button type="button" class="btn btn-nova" onclick="novaObra()">➕ Nova Obra</button>
    </div>

    <!-- FORMULÁRIO -->
    <div class="form-card">
        <h2 id="titulo-formulario">➕ Registar Nova Obra</h2>

        <form id="form-obra">
            <div class="form-grid">
                <div class="form-group">
                    <label for="numero_obra">Número da Obra *</label>
                    <input type="text" id="numero_obra" placeholder="Ex.: 2026-001" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="local_obra">Local da Obra *</label>
                    <input type="text" id="local_obra" placeholder="Ex.: Nome ou localização de obra" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" placeholder="Escreva para criar ou escolher uma existente" autocomplete="off">
                    <div id="empresa-dropdown" class="autocomplete-dropdown"></div>
                </div>

                <div class="form-group">
                    <label for="concelho">Concelho</label>
                    <input type="text" id="concelho" placeholder="Ex.: Vila do Conde" autocomplete="off">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-guardar" id="btn-guardar">💾 Guardar Obra</button>
                <button type="button" class="btn btn-cancelar" id="btn-cancelar" onclick="cancelarEdicao()" style="display:none;">✖ Cancelar</button>
            </div>
        </form>
    </div>

    <!-- LISTAGEM -->
    <div class="list-card">
        <div class="list-header">
            <div>
                <h2>📋 Obras Registadas</h2>
                <div id="contador-obras" class="contador">A carregar...</div>
            </div>
            <div class="list-tools">
                <button type="button" class="btn btn-toggle" id="btn-toggle-concluidas" onclick="alternarConcluidas()">👁 Mostrar concluídas</button>
                <div class="search-box">
                    <input type="text" id="pesquisa" placeholder="🔎 Pesquisar obra..." autocomplete="off">
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="ordenavel" data-campo="numero_obra">N.º Obra <span class="seta">⇅</span></th>
                        <th class="ordenavel" data-campo="local_obra">Local da Obra <span class="seta">⇅</span></th>
                        <th class="ordenavel" data-campo="empresa">Empresa <span class="seta">⇅</span></th>
                        <th class="ordenavel" data-campo="concelho">Concelho <span class="seta">⇅</span></th>
                        <th class="ordenavel num" data-campo="pedidos">Pedidos <span class="seta">⇅</span></th>
                        <th class="ordenavel num" data-campo="atividades">Atividades <span class="seta">⇅</span></th>
                        <th class="ordenavel num" data-campo="ocorrencias">Ocorrências <span class="seta">⇅</span></th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-obras">
                    <tr><td colspan="8" class="loading">⏳ A carregar obras...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- MODAL DETALHE DA OBRA -->
<div class="modal-overlay" id="modal-obra" onclick="if(event.target===this) fecharObra()">
    <div class="modal">
        <div class="modal-header">
            <div>
                <h2 id="modal-titulo">Obra</h2>
                <div class="sub" id="modal-sub"></div>
            </div>
            <button type="button" class="btn btn-fechar" onclick="fecharObra()">✖ Fechar</button>
        </div>

        <div class="tabs">
            <button type="button" class="tab ativo" data-tab="pedidos" onclick="mudarSeparador('pedidos')">📨 Pedidos <span class="badge zero" id="tab-count-pedidos">0</span></button>
            <button type="button" class="tab" data-tab="atividades" onclick="mudarSeparador('atividades')">🛠️ Atividades <span class="badge zero" id="tab-count-atividades">0</span></button>
            <button type="button" class="tab" data-tab="ocorrencias" onclick="mudarSeparador('ocorrencias')">⚠️ Ocorrências <span class="badge zero" id="tab-count-ocorrencias">0</span></button>
        </div>

        <div class="table-container" id="modal-conteudo"></div>
    </div>
</div>

<script>
    /* SUPABASE */
    const SUPABASE_URL = 'https://dunondjiqawovisnwavg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bm9uZGppcWF3b3Zpc253YXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTk3MjIsImV4cCI6MjA5NTYzNTcyMn0.KY5xnuHCixsO0a4yCzXP6CmO8e08v1wrDjoGCL-LTro';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* VARIÁVEIS */
    let obras = [];
    let obraEmEdicao = null;
    let indiceAtivoEmpresa = -1;
    let mostrarConcluidas = false; // começa oculto
    let ordenacao = { campo: null, direcao: 'asc' };

    /* INICIALIZAÇÃO */
    window.addEventListener('DOMContentLoaded', inicializar);

    async function inicializar() {
        try {
            const { data, error } = await supabaseClient.auth.getUser();

            if (error) {
                console.error('Erro ao obter utilizador:', error);
                mostrarMensagem('Erro ao verificar o utilizador: ' + error.message, 'erro');
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                return;
            }

            const user = data.user;
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            mostrarUtilizador(user);
            await carregarObras();

        } catch (erro) {
            console.error('Erro inesperado:', erro);
            mostrarMensagem('Ocorreu um erro ao iniciar a página.', 'erro');
        }
    }

    /* UTILIZADOR */
    function mostrarUtilizador(user) {
        const elemento = document.getElementById('user-email');
        if (!elemento) return;

        const metadata = user.user_metadata || {};
        const nome = metadata.full_name || metadata.name || metadata.nome || metadata.username || metadata.user_name;
        elemento.textContent = nome || user.email || 'Utilizador';
    }

    /* CARREGAR OBRAS (com contagem de pedidos, atividades e ocorrências) */
    async function carregarObras() {
        const tabela = document.getElementById('tabela-obras');
        const contador = document.getElementById('contador-obras');

        tabela.innerHTML = `<tr><td colspan="8" class="loading">⏳ A carregar obras...</td></tr>`;
        contador.textContent = 'A consultar a base de dados...';

        const { data, error } = await supabaseClient
            .from('obras')
            .select('id, local_obra, numero_obra, empresa, concelho, concluida, pedidos(count), atividades(count), ocorrencias(count)')
            .order('id', { ascending: false });

        if (error) {
            console.error('ERRO AO CARREGAR OBRAS:', error);
            tabela.innerHTML = `<tr><td colspan="8" class="sem-resultados">❌ Erro ao carregar as obras.<br><br><small>${escaparHTML(error.message)}</small></td></tr>`;
            contador.textContent = 'Erro ao consultar a tabela obras.';
            mostrarMensagem('Erro ao carregar obras: ' + error.message, 'erro');
            return;
        }

        obras = data || [];
        aplicarFiltros();
    }

    /* CONTAGEM DE REGISTOS RELACIONADOS */
    function contar(relacao) {
        return (relacao && relacao[0] && relacao[0].count) || 0;
    }

    function badge(relacao) {
        const n = contar(relacao);
        return `<span class="badge ${n ? '' : 'zero'}">${n}</span>`;
    }

    /* MOSTRAR OBRAS */
    function mostrarObras(lista) {
        const tabela = document.getElementById('tabela-obras');
        const contador = document.getElementById('contador-obras');

        const ocultas = mostrarConcluidas ? 0 : obras.filter(o => o.concluida).length;
        let texto = lista.length === 1 ? '1 obra' : `${lista.length} obras`;
        if (ocultas) texto += ` (${ocultas} concluída${ocultas > 1 ? 's' : ''} oculta${ocultas > 1 ? 's' : ''})`;
        contador.textContent = texto;

        if (!lista.length) {
            tabela.innerHTML = `<tr><td colspan="8" class="sem-resultados">📭 Não existem obras para mostrar.</td></tr>`;
            return;
        }

        tabela.innerHTML = lista.map(obra => `
            <tr class="clicavel ${obra.concluida ? 'concluida' : ''}" onclick="abrirObra(${obra.id})" title="Clique para ver pedidos, atividades e ocorrências">
                <td class="numero-obra">${escaparHTML(obra.numero_obra)}</td>
                <td>${escaparHTML(obra.local_obra)}</td>
                <td>${escaparHTML(obra.empresa || '-')}</td>
                <td>${escaparHTML(obra.concelho || '-')}</td>
                <td class="num">${badge(obra.pedidos)}</td>
                <td class="num">${badge(obra.atividades)}</td>
                <td class="num">${badge(obra.ocorrencias)}</td>
                <td>
                    <div class="acoes" onclick="event.stopPropagation()">
                        <button type="button" class="btn ${obra.concluida ? 'btn-reabrir' : 'btn-concluir'}" onclick="alternarConcluida(${obra.id})">
                            ${obra.concluida ? '↩️ Reabrir' : '✅ Concluir'}
                        </button>
                        <button type="button" class="btn btn-editar" onclick="editarObra(${obra.id})">✏️ Editar</button>
                        <button type="button" class="btn btn-apagar" onclick="apagarObra(${obra.id})">🗑️ Apagar</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    /* PESQUISA E FILTROS */
    document.getElementById('pesquisa').addEventListener('input', aplicarFiltros);

    function aplicarFiltros() {
        const termo = document.getElementById('pesquisa').value.trim().toLowerCase();
        let lista = obras;

        if (!mostrarConcluidas) lista = lista.filter(o => !o.concluida);

        if (termo) {
            lista = lista.filter(obra =>
                String(obra.numero_obra || '').toLowerCase().includes(termo) ||
                String(obra.local_obra || '').toLowerCase().includes(termo) ||
                String(obra.empresa || '').toLowerCase().includes(termo) ||
                String(obra.concelho || '').toLowerCase().includes(termo)
            );
        }

        document.getElementById('btn-toggle-concluidas').textContent =
            mostrarConcluidas ? '🙈 Ocultar concluídas' : '👁 Mostrar concluídas';

        lista = ordenarLista(lista);
        atualizarSetas();

        mostrarObras(lista);
    }

    function alternarConcluidas() {
        mostrarConcluidas = !mostrarConcluidas;
        aplicarFiltros();
    }

    /* ORDENAÇÃO */
    const CAMPOS_NUMERICOS = ['pedidos', 'atividades', 'ocorrencias'];

    function valorOrdenacao(obra, campo) {
        if (CAMPOS_NUMERICOS.includes(campo)) return contar(obra[campo]);
        return String(obra[campo] || '').trim();
    }

    function ordenarLista(lista) {
        if (!ordenacao.campo) return lista; // ordem original (id desc)

        const dir = ordenacao.direcao === 'asc' ? 1 : -1;
        const campo = ordenacao.campo;

        return [...lista].sort((a, b) => {
            const va = valorOrdenacao(a, campo);
            const vb = valorOrdenacao(b, campo);

            if (typeof va === 'number') return (va - vb) * dir;

            // vazios ficam sempre no fim
            if (!va && !vb) return 0;
            if (!va) return 1;
            if (!vb) return -1;

            return va.localeCompare(vb, 'pt', { numeric: true, sensitivity: 'base' }) * dir;
        });
    }

    function atualizarSetas() {
        document.querySelectorAll('th.ordenavel').forEach(th => {
            const ativo = th.dataset.campo === ordenacao.campo;
            th.classList.toggle('ativo', ativo);
            th.querySelector('.seta').textContent =
                !ativo ? '⇅' : (ordenacao.direcao === 'asc' ? '▲' : '▼');
        });
    }

    document.querySelectorAll('th.ordenavel').forEach(th => {
        th.addEventListener('click', () => {
            const campo = th.dataset.campo;

            if (ordenacao.campo !== campo) {
                ordenacao = { campo, direcao: 'asc' };
            } else if (ordenacao.direcao === 'asc') {
                ordenacao.direcao = 'desc';
            } else {
                ordenacao = { campo: null, direcao: 'asc' }; // repor ordem original
            }

            aplicarFiltros();
        });
    });

    async function alternarConcluida(id) {
        const obra = obras.find(item => Number(item.id) === Number(id));
        if (!obra) return;

        const novoEstado = !obra.concluida;
        const { error } = await supabaseClient
            .from('obras')
            .update({ concluida: novoEstado })
            .eq('id', id);

        if (error) {
            console.error('Erro UPDATE concluida:', error);
            mostrarMensagem('Erro ao atualizar estado: ' + error.message, 'erro');
            return;
        }

        obra.concluida = novoEstado;
        mostrarMensagem(novoEstado ? 'Obra marcada como concluída. ✅' : 'Obra reaberta. ↩️', 'sucesso');
        aplicarFiltros();
    }

    /* AUTOCOMPLETE DE EMPRESA (evita duplicados) */
    const inputEmpresa = document.getElementById('empresa');
    const dropdownEmpresa = document.getElementById('empresa-dropdown');

    function obterEmpresasUnicas() {
        const vistas = new Set();
        const lista = [];

        obras.forEach(obra => {
            const nome = (obra.empresa || '').trim();
            if (!nome) return;
            const chave = nome.toLowerCase();
            if (!vistas.has(chave)) {
                vistas.add(chave);
                lista.push(nome);
            }
        });

        return lista.sort((a, b) => a.localeCompare(b, 'pt', { sensitivity: 'base' }));
    }

    function abrirDropdownEmpresa() {
        const termo = inputEmpresa.value.trim().toLowerCase();
        const todas = obterEmpresasUnicas();

        const correspondencias = termo
            ? todas.filter(nome => nome.toLowerCase().includes(termo))
            : todas;

        indiceAtivoEmpresa = -1;

        if (!todas.length) {
            dropdownEmpresa.style.display = 'none';
            dropdownEmpresa.innerHTML = '';
            return;
        }

        if (!correspondencias.length) {
            dropdownEmpresa.innerHTML = `<div class="autocomplete-vazio">Nenhuma empresa existente corresponde — será criada uma nova ao guardar.</div>`;
            dropdownEmpresa.style.display = 'block';
            return;
        }

        dropdownEmpresa.innerHTML = correspondencias.map(nome =>
            `<div class="autocomplete-item" data-nome="${escaparHTML(nome)}">${escaparHTML(nome)}</div>`
        ).join('');
        dropdownEmpresa.style.display = 'block';
    }

    function fecharDropdownEmpresa() {
        dropdownEmpresa.style.display = 'none';
        dropdownEmpresa.innerHTML = '';
        indiceAtivoEmpresa = -1;
    }

    inputEmpresa.addEventListener('input', abrirDropdownEmpresa);
    inputEmpresa.addEventListener('focus', abrirDropdownEmpresa);

    dropdownEmpresa.addEventListener('mousedown', function (event) {
        const item = event.target.closest('.autocomplete-item');
        if (!item) return;
        inputEmpresa.value = item.dataset.nome;
        fecharDropdownEmpresa();
    });

    inputEmpresa.addEventListener('keydown', function (event) {
        const itens = Array.from(dropdownEmpresa.querySelectorAll('.autocomplete-item'));
        if (!itens.length || dropdownEmpresa.style.display === 'none') return;

        if (event.key === 'ArrowDown') {
            event.preventDefault();
            indiceAtivoEmpresa = Math.min(indiceAtivoEmpresa + 1, itens.length - 1);
        } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            indiceAtivoEmpresa = Math.max(indiceAtivoEmpresa - 1, 0);
        } else if (event.key === 'Enter' && indiceAtivoEmpresa >= 0) {
            event.preventDefault();
            inputEmpresa.value = itens[indiceAtivoEmpresa].dataset.nome;
            fecharDropdownEmpresa();
            return;
        } else if (event.key === 'Escape') {
            fecharDropdownEmpresa();
            return;
        } else {
            return;
        }

        itens.forEach((item, i) => item.classList.toggle('ativo', i === indiceAtivoEmpresa));
        itens[indiceAtivoEmpresa].scrollIntoView({ block: 'nearest' });
    });

    document.addEventListener('click', function (event) {
        if (event.target !== inputEmpresa && !dropdownEmpresa.contains(event.target)) {
            fecharDropdownEmpresa();
        }
    });

    /* SUBMETER FORMULÁRIO */
    document.getElementById('form-obra').addEventListener('submit', async function (event) {
        event.preventDefault();

        const numeroObra = document.getElementById('numero_obra').value.trim();
        const localObra = document.getElementById('local_obra').value.trim();
        const empresa = document.getElementById('empresa').value.trim();
        const concelho = document.getElementById('concelho').value.trim();

        if (!numeroObra) {
            mostrarMensagem('Introduza o número da obra.', 'erro');
            return;
        }
        if (!localObra) {
            mostrarMensagem('Introduza o local da obra.', 'erro');
            return;
        }

        fecharDropdownEmpresa();

        const botao = document.getElementById('btn-guardar');
        botao.disabled = true;
        botao.textContent = '⏳ A guardar...';

        try {
            if (obraEmEdicao) {
                await atualizarObra(obraEmEdicao, numeroObra, localObra, empresa, concelho);
            } else {
                await inserirObra(numeroObra, localObra, empresa, concelho);
            }
        } finally {
            botao.disabled = false;
            botao.textContent = obraEmEdicao ? '💾 Guardar Alterações' : '💾 Guardar Obra';
        }
    });

    /* INSERIR OBRA */
    async function inserirObra(numeroObra, localObra, empresa, concelho) {
        const { error } = await supabaseClient
            .from('obras')
            .insert([{
                numero_obra: numeroObra,
                local_obra: localObra,
                empresa: empresa || null,
                concelho: concelho || null
            }]);

        if (error) {
            console.error('Erro INSERT:', error);
            if (error.code === '23505') {
                mostrarMensagem('Já existe uma obra com esse número.', 'erro');
            } else {
                mostrarMensagem('Erro ao guardar obra: ' + error.message, 'erro');
            }
            return;
        }

        mostrarMensagem('Obra registada com sucesso! ✅', 'sucesso');
        limparFormulario();
        await carregarObras();
    }

    /* EDITAR OBRA */
    function editarObra(id) {
        const obra = obras.find(item => Number(item.id) === Number(id));

        if (!obra) {
            mostrarMensagem('Não foi possível encontrar a obra.', 'erro');
            return;
        }

        obraEmEdicao = obra.id;

        document.getElementById('numero_obra').value = obra.numero_obra || '';
        document.getElementById('local_obra').value = obra.local_obra || '';
        document.getElementById('empresa').value = obra.empresa || '';
        document.getElementById('concelho').value = obra.concelho || '';

        document.getElementById('titulo-formulario').textContent = '✏️ Editar Obra';
        document.getElementById('btn-guardar').textContent = '💾 Guardar Alterações';
        document.getElementById('btn-cancelar').style.display = 'inline-flex';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ATUALIZAR OBRA */
    async function atualizarObra(id, numeroObra, localObra, empresa, concelho) {
        const { error } = await supabaseClient
            .from('obras')
            .update({
                numero_obra: numeroObra,
                local_obra: localObra,
                empresa: empresa || null,
                concelho: concelho || null
            })
            .eq('id', id);

        if (error) {
            console.error('Erro UPDATE:', error);
            if (error.code === '23505') {
                mostrarMensagem('Já existe outra obra com esse número.', 'erro');
            } else {
                mostrarMensagem('Erro ao atualizar obra: ' + error.message, 'erro');
            }
            return;
        }

        mostrarMensagem('Obra atualizada com sucesso! ✅', 'sucesso');
        cancelarEdicao();
        await carregarObras();
    }

    /* APAGAR OBRA */
    async function apagarObra(id) {
        const obra = obras.find(item => Number(item.id) === Number(id));

        if (!obra) {
            mostrarMensagem('Obra não encontrada.', 'erro');
            return;
        }

        const total = contar(obra.pedidos) + contar(obra.atividades) + contar(obra.ocorrencias);
        const aviso = total
            ? `\n\nAtenção: tem ${total} registo(s) associado(s) (pedidos, atividades ou ocorrências) que ficarão sem obra.`
            : '';

        if (!confirm(`Tem a certeza que pretende apagar a obra "${obra.numero_obra}"?${aviso}`)) return;

        const { error } = await supabaseClient.from('obras').delete().eq('id', id);

        if (error) {
            console.error('Erro DELETE:', error);
            mostrarMensagem('Erro ao apagar obra: ' + error.message, 'erro');
            return;
        }

        mostrarMensagem('Obra apagada com sucesso. 🗑️', 'sucesso');
        await carregarObras();
    }

    /* NOVA OBRA / CANCELAR / LIMPAR */
    function novaObra() {
        cancelarEdicao();
        document.getElementById('numero_obra').focus();
    }

    function cancelarEdicao() {
        obraEmEdicao = null;
        limparFormulario();
        document.getElementById('titulo-formulario').textContent = '➕ Registar Nova Obra';
        document.getElementById('btn-guardar').textContent = '💾 Guardar Obra';
        document.getElementById('btn-cancelar').style.display = 'none';
    }

    function limparFormulario() {
        document.getElementById('form-obra').reset();
        fecharDropdownEmpresa();
    }

    /* DETALHE DA OBRA (pedidos, atividades, ocorrências) */
    let dadosObra = { pedidos: [], atividades: [], ocorrencias: [] };
    let separadorAtivo = 'pedidos';
    let obraAbertaId = null;

    async function abrirObra(id) {
        const obra = obras.find(o => Number(o.id) === Number(id));
        if (!obra) return;

        obraAbertaId = obra.id;
        separadorAtivo = 'pedidos';
        dadosObra = { pedidos: [], atividades: [], ocorrencias: [] };

        document.getElementById('modal-titulo').textContent = `🏗️ Obra ${obra.numero_obra}`;
        document.getElementById('modal-sub').innerHTML = [
            escaparHTML(obra.local_obra),
            obra.empresa ? '🏢 ' + escaparHTML(obra.empresa) : '',
            obra.concelho ? '📍 ' + escaparHTML(obra.concelho) : ''
        ].filter(Boolean).join(' &nbsp;•&nbsp; ');

        document.getElementById('modal-conteudo').innerHTML =
            `<div class="loading">⏳ A carregar dados da obra...</div>`;
        document.getElementById('modal-obra').classList.add('aberto');
        document.body.style.overflow = 'hidden';
        atualizarSeparadores();

        const [pedidos, atividades, ocorrencias] = await Promise.all([
            supabaseClient.from('pedidos').select('*').eq('obra_id', id).order('data_hora_pedido', { ascending: false, nullsFirst: false }),
            supabaseClient.from('atividades').select('*').eq('obra_id', id).order('data_hora_inicio', { ascending: false, nullsFirst: false }),
            supabaseClient.from('ocorrencias').select('*').eq('obra_id', id).order('data', { ascending: false, nullsFirst: false })
        ]);

        // Se o utilizador fechou/abriu outra obra entretanto, ignorar
        if (obraAbertaId !== obra.id) return;

        const erro = pedidos.error || atividades.error || ocorrencias.error;
        if (erro) {
            console.error('Erro ao carregar detalhe da obra:', erro);
            document.getElementById('modal-conteudo').innerHTML =
                `<div class="sem-resultados">❌ Erro ao carregar dados.<br><br><small>${escaparHTML(erro.message)}</small></div>`;
            return;
        }

        dadosObra = {
            pedidos: pedidos.data || [],
            atividades: atividades.data || [],
            ocorrencias: ocorrencias.data || []
        };

        atualizarSeparadores();
        desenharSeparador();
    }

    function fecharObra() {
        obraAbertaId = null;
        document.getElementById('modal-obra').classList.remove('aberto');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && obraAbertaId !== null) fecharObra();
    });

    function mudarSeparador(nome) {
        separadorAtivo = nome;
        atualizarSeparadores();
        desenharSeparador();
    }

    function atualizarSeparadores() {
        document.querySelectorAll('.tab').forEach(t =>
            t.classList.toggle('ativo', t.dataset.tab === separadorAtivo));

        ['pedidos', 'atividades', 'ocorrencias'].forEach(nome => {
            const n = dadosObra[nome].length;
            const el = document.getElementById('tab-count-' + nome);
            el.textContent = n;
            el.classList.toggle('zero', !n);
        });
    }

    /* FORMATAÇÃO */
    function formatarDataHora(valor) {
        if (!valor) return '-';
        const d = new Date(valor);
        if (isNaN(d)) return escaparHTML(valor);
        return d.toLocaleString('pt-PT', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    function texto(valor) {
        return valor ? escaparHTML(valor) : '-';
    }

    function estadoHTML(estado) {
        if (!estado) return '-';
        const classe = estado.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const seguro = classe.replace(/[^a-z]/g, '');
        return `<span class="estado ${seguro}">${escaparHTML(estado)}</span>`;
    }

    function linkAnexo(valor) {
        if (!valor) return '-';
        if (/^https?:\/\//i.test(valor)) {
            return `<a class="link-anexo" href="${escaparHTML(valor)}" target="_blank" rel="noopener">📎 Abrir</a>`;
        }
        return escaparHTML(valor);
    }

    function fotosHTML(fotos) {
        if (!fotos) return '-';
        let lista = fotos;
        if (typeof lista === 'string') {
            try { lista = JSON.parse(lista); } catch { lista = [lista]; }
        }
        if (!Array.isArray(lista)) lista = [lista];

        const urls = lista
            .map(f => (typeof f === 'string' ? f : (f && (f.url || f.publicUrl || f.src)) || ''))
            .filter(u => /^https?:\/\//i.test(u));

        if (!urls.length) return '-';

        return `<div class="fotos">${urls.map(u =>
            `<a href="${escaparHTML(u)}" target="_blank" rel="noopener"><img src="${escaparHTML(u)}" alt="Foto" loading="lazy"></a>`
        ).join('')}</div>`;
    }

    /* DESENHAR SEPARADOR ATIVO */
    function desenharSeparador() {
        const conteudo = document.getElementById('modal-conteudo');
        const lista = dadosObra[separadorAtivo];

        if (!lista.length) {
            const nomes = { pedidos: 'pedidos', atividades: 'atividades', ocorrencias: 'ocorrências' };
            conteudo.innerHTML = `<div class="sem-resultados">📭 Esta obra ainda não tem ${nomes[separadorAtivo]}.</div>`;
            return;
        }

        if (separadorAtivo === 'pedidos') {
            conteudo.innerHTML = `<table><thead><tr>
                <th>Data do pedido</th><th>Requerente</th><th>Serviço</th><th>Tipo</th>
                <th>Técnico</th><th>Limite</th><th>Estado</th><th>Observação</th>
            </tr></thead><tbody>${lista.map(p => `<tr>
                <td>${formatarDataHora(p.data_hora_pedido)}</td>
                <td>${texto(p.requerente)}</td>
                <td>${texto(p.servico)}</td>
                <td>${texto(p.tipo_trabalho)}</td>
                <td>${texto(p.tecnico)}</td>
                <td>${formatarDataHora(p.data_hora_limite)}</td>
                <td>${estadoHTML(p.estado)}</td>
                <td class="texto-longo">${texto(p.observacao)}</td>
            </tr>`).join('')}</tbody></table>`;
        } else if (separadorAtivo === 'atividades') {
            conteudo.innerHTML = `<table><thead><tr>
                <th>Início</th><th>Fim</th><th>Técnico</th><th>Serviço</th><th>Tipo de trabalho</th><th>Anexo</th>
            </tr></thead><tbody>${lista.map(a => `<tr>
                <td>${formatarDataHora(a.data_hora_inicio)}</td>
                <td>${formatarDataHora(a.data_hora_fim)}</td>
                <td>${texto(a.tecnico)}</td>
                <td class="texto-longo">${texto(a.servico)}</td>
                <td>${texto(a.tipo_trabalho)}</td>
                <td>${linkAnexo(a.anexo)}</td>
            </tr>`).join('')}</tbody></table>`;
        } else {
            conteudo.innerHTML = `<table><thead><tr>
                <th>Data</th><th>Ocorrência</th><th>Fotos</th>
            </tr></thead><tbody>${lista.map(o => `<tr>
                <td>${formatarDataHora(o.data)}</td>
                <td class="texto-longo">${texto(o.ocorrencia)}</td>
                <td>${fotosHTML(o.fotos)}</td>
            </tr>`).join('')}</tbody></table>`;
        }
    }

    /* UTILITÁRIOS */
    function voltarInicio() {
        window.location.href = 'index.html';
    }

    function escaparHTML(valor) {
        if (valor === null || valor === undefined) return '';
        return String(valor)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function mostrarMensagem(texto, tipo = 'info') {
        const container = document.getElementById('mensagens');
        const mensagem = document.createElement('div');
        mensagem.className = `mensagem ${tipo}`;
        mensagem.textContent = texto;
        container.appendChild(mensagem);

        setTimeout(() => {
            mensagem.style.opacity = '0';
            mensagem.style.transform = 'translateX(20px)';
            setTimeout(() => { mensagem.remove(); }, 250);
        }, 4000);
    }

    /* ALTERAÇÕES DE AUTENTICAÇÃO */
    supabaseClient.auth.onAuthStateChange(function (event, session) {
        if (!session && event !== 'INITIAL_SESSION') {
            window.location.href = 'index.html';
            return;
        }
        if (session) {
            mostrarUtilizador(session.user);
        }
    });
</script>
