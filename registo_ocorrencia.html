<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚨Registo de Ocorrência</title>
<link rel="icon" type="image/jpeg" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f172a; font-family: Arial, sans-serif; color: white; padding: 30px; }
.container { max-width: 900px; margin: auto; background: #1e293b; padding: 35px; border-radius: 18px; box-shadow: 0 0 30px rgba(0,0,0,0.4); }
.header-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
.user-info { color: #94a3b8; font-size: 0.9em; margin-bottom: 20px; }
h1 { font-size: 34px; }
.btn-voltar { background: #334155; color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: bold; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.full { grid-column: 1 / -1; }
label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
input, textarea, select { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #334155; color: white; font-size: 16px; }
textarea { min-height: 120px; resize: vertical; }

/* ===== Secção de associação de atividade ===== */
.atividade-association {
  background: #1e293b;
  border: 2px solid #3b82f6;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
.atividade-association h3 { color: #60a5fa; margin-bottom: 15px; font-size: 18px; }
.atividade-select { min-height: 50px; cursor: pointer; }
.atividade-select option { padding: 10px; background: #334155; }

/* ===== Painel com a informação completa da atividade selecionada ===== */
.atividade-details {
  display: none;
  margin-top: 12px;
  padding: 12px 15px;
  background: #334155;
  border-left: 4px solid #3b82f6;
  border-radius: 8px;
  font-size: 14px;
  color: #e2e8f0;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
}

/* ===== Input de fotografias direto e limpo ===== */
.foto-input-direto {
  width: 100%;
  padding: 16px;
  border: 2px dashed #475569;
  border-radius: 10px;
  background: #334155;
  color: #cbd5e1;
  font-size: 15px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  display: block;
  margin-top: 8px;
}

.foto-input-direto:hover { 
  border-color: #3b82f6; 
  background: #3b4a63; 
}

/* Estiliza o botão nativo "Escolher ficheiros" para ficar moderno */
.foto-input-direto::file-selector-button {
  background: #3b82f6;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  margin-right: 12px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: background 0.2s;
}

.foto-input-direto::file-selector-button:hover {
  background: #2563eb;
}

.foto-preview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 10px;
  margin-top: 14px;
}
.foto-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 10px;
  overflow: hidden;
  background: #0f172a;
  border: 1px solid #475569;
}
.foto-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(15, 23, 42, 0.85);
  color: #f87171;
  border: none;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin-top: 0;
}
.foto-upload-status {
  margin-top: 8px;
  font-size: 13px;
  color: #94a3b8;
}

button { width: 100%; margin-top: 25px; padding: 16px; border: none; border-radius: 10px; background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
button:disabled { background: #475569; cursor: not-allowed; }
.success { display: none; margin-top: 20px; background: #065f46; padding: 15px; border-radius: 10px; text-align: center; }

/* Ajuste para dispositivos móveis */
@media (max-width: 640px) {
  body { padding: 15px; }
  .container { padding: 20px; border-radius: 14px; }
  h1 { font-size: 24px; }
  .grid { grid-template-columns: 1fr; gap: 12px; }
  .atividade-association { padding: 15px; }
  
  .foto-input-direto {
    text-align: center;
    padding: 20px 10px;
  }
  .foto-input-direto::file-selector-button {
    display: block;
    width: 100%;
    margin-right: 0;
    margin-bottom: 10px;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="header-area">
    <h1>Registo de Ocorrência</h1>
    <a href="index.html" class="btn-voltar">⬅ Voltar</a>
  </div>

  <div class="user-info">
    Utilizador: <span id="user-display" style="color: #60a5fa;">A carregar...</span>
  </div>

  <!-- ===== Associação de atividade (opcional) ===== -->
  <div class="atividade-association">
    <h3>📊 Associar a Atividade (opcional)</h3>
    <label>Selecionar Atividade</label>
    <select id="selectAtividade" class="atividade-select">
      <option value="">-- Nenhuma atividade associada --</option>
    </select>
    <div id="detalhesAtividade" class="atividade-details"></div>
  </div>

  <form id="formularioOcorrencia">
    <div class="grid">

      <div class="full">
        <label>Data *</label>
        <input type="datetime-local" id="dataOcorrencia" name="data" required>
      </div>

      <!-- ===== Local / Obra com datalist (existente ou novo) ===== -->
      <div>
        <label>Local / Obra</label>
        <input type="text" name="local_obra" id="inputLocalObra" list="lista-local-obra" autocomplete="off">
        <datalist id="lista-local-obra"></datalist>
      </div>

      <!-- ===== Nº Obra com datalist (existente ou novo) ===== -->
      <div>
        <label>Nº Obra</label>
        <input type="text" name="numero_obra" id="inputNumeroObra" list="lista-numero-obra" autocomplete="off">
        <datalist id="lista-numero-obra"></datalist>
      </div>

      <div class="full">
        <label>Ocorrência *</label>
        <textarea name="ocorrencia" placeholder="Se algo correu mal ou houve imprevisto, descreve aqui... " required></textarea>
      </div>

      <!-- ===== Fotografias associadas à ocorrência (opcional) ===== -->
      <div class="full">
        <label>📷 Fotografias (opcional)</label>
        <input type="file" id="inputFotos" class="foto-input-direto" accept="image/*" multiple>
        <div id="previewFotos" class="foto-preview-grid"></div>
        <div id="fotoUploadStatus" class="foto-upload-status"></div>
      </div>

    </div>

    <button type="submit" id="btnEnviar">Gravar Ocorrência</button>
  </form>

  <div class="success" id="successMessage">✅ Ocorrência guardada com sucesso!</div>
</div>

<script>
const SUPABASE_URL = 'https://dunondjiqawovisnwavg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WekrBSs5JOjnJ1SGxFvmKQ_3v6AnBMs';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const selectAtividade = document.getElementById('selectAtividade');
const detalhesAtividade = document.getElementById('detalhesAtividade');

// ===== Mapas para preenchimento cruzado Local <-> Nº Obra =====
let mapaLocalParaObra = {};
let mapaObraParaLocal = {};

// ===== Fotografias selecionadas para esta ocorrência =====
const NOME_BUCKET_FOTOS = 'fotos-ocorrencias';
let ficheirosSelecionados = [];

const inputFotos = document.getElementById('inputFotos');
const previewFotos = document.getElementById('previewFotos');
const fotoUploadStatus = document.getElementById('fotoUploadStatus');

inputFotos.addEventListener('change', (e) => {
    const novosFicheiros = Array.from(e.target.files || []);
    ficheirosSelecionados = ficheirosSelecionados.concat(novosFicheiros);
    renderizarPreviewsFotos();
    // Permite voltar a escolher o mesmo ficheiro ou adicionar mais depois
    e.target.value = '';
});

function renderizarPreviewsFotos() {
    previewFotos.innerHTML = '';
    ficheirosSelecionados.forEach((file, index) => {
        const url = URL.createObjectURL(file);
        const thumb = document.createElement('div');
        thumb.className = 'foto-thumb';

        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Fotografia da ocorrência';

        const btnRemover = document.createElement('button');
        btnRemover.type = 'button';
        btnRemover.className = 'foto-remove';
        btnRemover.textContent = '✕';
        btnRemover.addEventListener('click', () => {
            ficheirosSelecionados.splice(index, 1);
            renderizarPreviewsFotos();
        });

        thumb.appendChild(img);
        thumb.appendChild(btnRemover);
        previewFotos.appendChild(thumb);
    });
}

// ===== Upload das fotografias para o Supabase Storage =====
async function carregarFotosParaStorage(ocorrenciaId) {
    const urls = [];
    for (let i = 0; i < ficheirosSelecionados.length; i++) {
        const file = ficheirosSelecionados[i];
        fotoUploadStatus.textContent = `A carregar fotografia ${i + 1} de ${ficheirosSelecionados.length}...`;

        const extensao = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const nomeFicheiro = `${ocorrenciaId}_${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${extensao}`;
        const caminho = `ocorrencias/${ocorrenciaId}/${nomeFicheiro}`;

        const { error: uploadError } = await supabaseClient.storage
            .from(NOME_BUCKET_FOTOS)
            .upload(caminho, file, { cacheControl: '3600', upsert: false });

        if (uploadError) {
            console.error('Erro ao carregar fotografia:', uploadError);
            continue;
        }

        const { data: urlData } = supabaseClient.storage
            .from(NOME_BUCKET_FOTOS)
            .getPublicUrl(caminho);

        if (urlData && urlData.publicUrl) {
            urls.push(urlData.publicUrl);
        }
    }
    fotoUploadStatus.textContent = '';
    return urls;
}

// ===== Carregar atividades para o dropdown =====
async function carregarAtividades() {
    selectAtividade.innerHTML = '<option value="">-- Nenhuma atividade associada --</option>';
    try {
        const { data: atividades, error } = await supabaseClient
            .from('atividades')
            .select('id, tecnico, local_obra, numero_obra, servico, data_hora_inicio')
            .order('data_hora_inicio', { ascending: false });

        if (error) throw error;

        if (atividades && atividades.length > 0) {
            atividades.forEach(atividade => {
                const option = document.createElement('option');
                option.value = atividade.id;
                option.dataset.localObra = atividade.local_obra || '';
                option.dataset.numeroObra = atividade.numero_obra || '';

                const tecnico = atividade.tecnico || 'Sem técnico';
                const localObra = atividade.local_obra || 'Sem local';
                const servico = atividade.servico || '';

                option.dataset.textoCompleto = `${tecnico} - ${localObra} (${servico})`;

                const servicoCurto = servico.substring(0, 40) + (servico.length > 40 ? '...' : '');
                option.textContent = `${tecnico} - ${localObra} (${servicoCurto})`;

                selectAtividade.appendChild(option);
            });
        }
    } catch (err) {
        console.error("Erro ao carregar atividades:", err);
        const option = document.createElement('option');
        option.value = "";
        option.textContent = "Erro ao carregar atividades";
        option.disabled = true;
        selectAtividade.appendChild(option);
    }
}

// ===== Carregar histórico de Locais e Nº Obra para os datalists =====
async function carregarHistoricoLocais() {
    try {
        const [{ data: atividadesData }, { data: pedidosData }, { data: ocorrenciasData }] = await Promise.all([
            supabaseClient.from('atividades').select('local_obra, numero_obra').order('id', { ascending: false }),
            supabaseClient.from('pedidos').select('local_obra, numero_obra').order('id', { ascending: false }),
            supabaseClient.from('ocorrencias').select('local_obra, numero_obra').order('id', { ascending: false })
        ]);

        const combos = [...(atividadesData || []), ...(pedidosData || []), ...(ocorrenciasData || [])];
        const locaisSet = new Set();
        const obrasSet = new Set();

        combos.forEach(item => {
            const local = (item.local_obra || '').trim();
            const obra = (item.numero_obra || '').trim();
            if (local) {
                locaisSet.add(local);
                if (obra && !(local in mapaLocalParaObra)) mapaLocalParaObra[local] = obra;
            }
            if (obra) {
                obrasSet.add(obra);
                if (local && !(obra in mapaObraParaLocal)) mapaObraParaLocal[obra] = local;
            }
        });

        const datalistLocal = document.getElementById('lista-local-obra');
        locaisSet.forEach(local => {
            const opt = document.createElement('option');
            opt.value = local;
            datalistLocal.appendChild(opt);
        });

        const datalistObra = document.getElementById('lista-numero-obra');
        obrasSet.forEach(obra => {
            const opt = document.createElement('option');
            opt.value = obra;
            datalistObra.appendChild(opt);
        });
    } catch (err) {
        console.error("Erro ao carregar histórico de Local/Obra e Nº Obra:", err);
    }
}

// ===== Preenchimento automático Local -> Nº Obra (ao digitar/selecionar) =====
document.getElementById('inputLocalObra').addEventListener('input', (e) => {
    const valor = e.target.value.trim();
    if (mapaLocalParaObra[valor]) {
        document.getElementById('inputNumeroObra').value = mapaLocalParaObra[valor];
    }
});

// ===== Preenchimento automático Nº Obra -> Local =====
document.getElementById('inputNumeroObra').addEventListener('input', (e) => {
    const valor = e.target.value.trim();
    if (mapaObraParaLocal[valor]) {
        document.getElementById('inputLocalObra').value = mapaObraParaLocal[valor];
    }
});

// ===== Auto-preenchimento + mostrar informação completa ao selecionar atividade =====
selectAtividade.addEventListener('change', () => {
    const inputLocal = document.getElementById('inputLocalObra');
    const inputObra = document.getElementById('inputNumeroObra');

    if (selectAtividade.value) {
        const selectedOption = selectAtividade.options[selectAtividade.selectedIndex];
        detalhesAtividade.textContent = '📄 ' + selectedOption.dataset.textoCompleto;
        detalhesAtividade.style.display = 'block';

        const localObra = selectedOption.dataset.localObra;
        const numeroObra = selectedOption.dataset.numeroObra;

        if (localObra) inputLocal.value = localObra;
        if (numeroObra) inputObra.value = numeroObra;
    } else {
        detalhesAtividade.style.display = 'none';
        inputLocal.value = '';
        inputObra.value = '';
    }
});

window.onload = async () => {
    const { data: { user }, error } = await supabaseClient.auth.getUser();
    if (error || !user) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('user-display').innerText = user.email;
        definirDataAtual();
        carregarHistoricoLocais();
        carregarAtividades();
    }
};

// Preenche a data com o momento atual
function definirDataAtual() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById("dataOcorrencia").value = now.toISOString().slice(0, 16);
}

const form = document.getElementById("formularioOcorrencia");
const btnEnviar = document.getElementById("btnEnviar");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btnEnviar.disabled = true;
    btnEnviar.innerText = "A gravar...";

    const dadosParaEnviar = {
        data: form.data.value,
        ocorrencia: form.ocorrencia.value,
        local_obra: form.local_obra.value,
        numero_obra: form.numero_obra.value
    };

    const atividadeId = selectAtividade.value;
    if (atividadeId) {
        dadosParaEnviar.atividade_id = parseInt(atividadeId);
    }

    console.log("Dados a enviar para o Supabase:", dadosParaEnviar);

    // Inserir a ocorrência primeiro, para obter o id e associar as fotos
    const { data, error } = await supabaseClient
        .from('ocorrencias')
        .insert([dadosParaEnviar])
        .select();

    if (error) {
        console.error("Erro detalhado do Supabase:", error);
        alert("Erro ao gravar no Supabase: " + error.message);
        btnEnviar.disabled = false;
        btnEnviar.innerText = "Gravar Ocorrência";
        return;
    }

    console.log("Inserido com sucesso:", data);
    const ocorrenciaInserida = data && data[0];

    // Se houver fotografias selecionadas, carregar para o Storage e associar à ocorrência
    if (ocorrenciaInserida && ficheirosSelecionados.length > 0) {
        btnEnviar.innerText = "A carregar fotografias...";
        try {
            const urlsFotos = await carregarFotosParaStorage(ocorrenciaInserida.id);
            if (urlsFotos.length > 0) {
                const { error: updateError } = await supabaseClient
                    .from('ocorrencias')
                    .update({ fotos: urlsFotos })
                    .eq('id', ocorrenciaInserida.id);

                if (updateError) {
                    console.error("Erro ao associar fotografias à ocorrência:", updateError);
                    alert("Ocorrência gravada, mas houve um erro ao associar as fotografias: " + updateError.message);
                }
            }
        } catch (err) {
            console.error("Erro inesperado ao carregar fotografias:", err);
            alert("Ocorrência gravada, mas houve um erro ao carregar as fotografias.");
        }
    }

    document.getElementById("successMessage").style.display = "block";
    form.reset();
    selectAtividade.value = "";
    detalhesAtividade.style.display = "none";
    ficheirosSelecionados = [];
    renderizarPreviewsFotos();
    fotoUploadStatus.textContent = '';
    definirDataAtual();
    carregarHistoricoLocais(); // Atualiza os datalists com o novo registo

    setTimeout(() => {
        document.getElementById("successMessage").style.display = "none";
    }, 5000);

    btnEnviar.disabled = false;
    btnEnviar.innerText = "Gravar Ocorrência";
});
</script>
</body>
</html>
