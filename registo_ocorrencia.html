<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🏗️ Registo de Obras</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        .header {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 20px 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            font-size: 42px;
        }

        .header-title h1 {
            font-size: 25px;
            color: #fff;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 14px;
            color: #94a3b8;
        }

        .user-box {
            background: #334155;
            border-radius: 12px;
            padding: 10px 15px;
            text-align: right;
        }

        .user-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        #user-email {
            font-size: 14px;
            font-weight: bold;
            color: #60a5fa;
        }

        /* =========================
           BOTÕES
        ========================= */

        .top-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            border: none;
            border-radius: 9px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-voltar {
            background: #334155;
            color: white;
        }

        .btn-voltar:hover {
            background: #475569;
        }

        .btn-nova {
            background: #3b82f6;
            color: white;
        }

        .btn-nova:hover {
            background: #2563eb;
        }

        .btn-guardar {
            background: #3b82f6;
            color: white;
        }

        .btn-guardar:hover {
            background: #2563eb;
        }

        .btn-cancelar {
            background: #64748b;
            color: white;
        }

        .btn-cancelar:hover {
            background: #475569;
        }

        /* =========================
           FORMULÁRIO
        ========================= */

        .form-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .form-card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;

            background: #0f172a;
            color: #fff;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        /* =========================
           LISTAGEM
        ========================= */

        .list-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .list-header h2 {
            font-size: 20px;
            color: #fff;
        }

        .contador {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .search-box {
            width: 300px;
        }

        .search-box input {
            background: #0f172a;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        thead {
            background: #334155;
        }

        th {
            padding: 13px 12px;
            text-align: left;
            font-size: 12px;
            color: #cbd5e1;
            text-transform: uppercase;
            border-bottom: 2px solid #475569;
        }

        td {
            padding: 13px 12px;
            border-bottom: 1px solid #334155;
            font-size: 14px;
            vertical-align: middle;
            color: #fff;
        }

        tbody tr {
            background: #1e293b;
            transition: 0.15s;
        }

        tbody tr:hover {
            background: #334155;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .numero-obra {
            font-weight: bold;
            color: #60a5fa;
        }

        .acoes {
            display: flex;
            gap: 7px;
        }

        .btn-editar {
            background: #334155;
            color: #60a5fa;
            border: 1px solid #475569;
            padding: 7px 10px;
            font-size: 12px;
        }

        .btn-editar:hover {
            background: #475569;
        }

        .btn-apagar {
            background: #ef4444;
            color: white;
            padding: 7px 10px;
            font-size: 12px;
        }

        .btn-apagar:hover {
            background: #dc2626;
        }

        .loading,
        .sem-resultados {
            text-align: center;
            padding: 35px !important;
            color: #94a3b8;
        }

        /* =========================
           MENSAGENS
        ========================= */

        #mensagens {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;

            display: flex;
            flex-direction: column;
            gap: 10px;

            max-width: 400px;
        }

        .mensagem {
            padding: 14px 18px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
            animation: aparecer 0.2s ease;
        }

        .mensagem.sucesso {
            background: #3b82f6;
        }

        .mensagem.erro {
            background: #ef4444;
        }

        .mensagem.info {
            background: #3b82f6;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .header {
                padding: 18px;
            }

            .header-left {
                width: 100%;
            }

            .user-box {
                width: 100%;
                text-align: left;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .search-box {
                width: 100%;
            }

            .list-header {
                flex-direction: column;
                align-items: stretch;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions .btn {
                width: 100%;
            }

            .top-buttons {
                flex-direction: column;
            }

            .top-buttons .btn {
                width: 100%;
            }

            .acoes {
                flex-direction: column;
            }

            #mensagens {
                left: 10px;
                right: 10px;
                max-width: none;
            }
        }
    </style>
</head>

<body>

<div id="mensagens"></div>

<div class="container">

    <div class="header">

        <div class="header-left">

            <div class="header-icon">
                🏗️
            </div>

            <div class="header-title">
                <h1>Registo de Obras</h1>
                <p>Gestão das obras de topografia</p>
            </div>

        </div>

        <div class="user-box">

            <div class="user-label">
                Utilizador
            </div>

            <div id="user-email">
                A carregar...
            </div>

        </div>

    </div>


    <div class="top-buttons">

        <button
            type="button"
            class="btn btn-voltar"
            onclick="voltarInicio()">
            ← Voltar
        </button>

        <button
            type="button"
            class="btn btn-nova"
            onclick="novaObra()">
            ➕ Nova Obra
        </button>

    </div>


    <div class="form-card">

        <h2 id="titulo-formulario">
            ➕ Registar Nova Obra
        </h2>

        <form id="form-obra">

            <div class="form-grid">

                <div class="form-group">

                    <label for="numero_obra">
                        Número da Obra *
                    </label>

                    <input
                        type="text"
                        id="numero_obra"
                        placeholder="Ex.: 2026-001"
                        required
                        autocomplete="off">

                </div>


                <div class="form-group">

                    <label for="local_obra">
                        Local da Obra *
                    </label>

                    <input
                        type="text"
                        id="local_obra"
                        placeholder="Ex.: Rua Principal, Vila do Conde"
                        required
                        autocomplete="off">

                </div>


                <div class="form-group">

                    <label for="empresa">
                        Empresa
                    </label>

                    <input
                        type="text"
                        id="empresa"
                        placeholder="Nome da empresa"
                        autocomplete="off">

                </div>


                <div class="form-group">

                    <label for="concelho">
                        Concelho
                    </label>

                    <input
                        type="text"
                        id="concelho"
                        placeholder="Ex.: Vila do Conde"
                        autocomplete="off">

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-guardar"
                    id="btn-guardar">
                    💾 Guardar Obra
                </button>

                <button
                    type="button"
                    class="btn btn-cancelar"
                    id="btn-cancelar"
                    onclick="cancelarEdicao()"
                    style="display:none;">
                    ✖ Cancelar
                </button>

            </div>

        </form>

    </div>


    <div class="list-card">

        <div class="list-header">

            <div>

                <h2>
                    📋 Obras Registadas
                </h2>

                <div
                    id="contador-obras"
                    class="contador">
                    A carregar...
                </div>

            </div>

            <div class="search-box">

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="🔎 Pesquisar obra..."
                    autocomplete="off">

            </div>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>N.º Obra</th>
                        <th>Local da Obra</th>
                        <th>Empresa</th>
                        <th>Concelho</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="tabela-obras">

                    <tr>
                        <td
                            colspan="5"
                            class="loading">
                            A carregar obras...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
        'https://dunondjiqawovisnwavg.supabase.co';

    const SUPABASE_ANON_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bm9uZGppcWF3b3Zpc253YXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTk3MjIsImV4cCI6MjA5NTYzNTcyMn0.KY5xnuHCixsO0a4yCzXP6CmO8e08v1wrDjoGCL-LTro';

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* =====================================================
       VARIÁVEIS
    ===================================================== */

    let obras = [];

    let obraEmEdicao = null;


    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    window.addEventListener(
        'DOMContentLoaded',
        inicializar
    );


    async function obterSessaoComRetry() {

        let ultimaResposta = {
            data: {
                session: null
            },
            error: null
        };

        for (
            let tentativa = 1;
            tentativa <= 8;
            tentativa++
        ) {

            try {

                const resposta =
                    await supabaseClient.auth.getSession();

                ultimaResposta =
                    resposta;

                console.log(
                    `Tentativa de sessão ${tentativa}/8:`,
                    resposta.data?.session
                        ? 'sessão encontrada'
                        : 'sem sessão'
                );


                if (
                    resposta.data?.session?.user
                ) {

                    return resposta;

                }

            } catch (erro) {

                ultimaResposta = {
                    data: {
                        session: null
                    },
                    error: erro
                };

                console.error(
                    `Erro na tentativa de sessão ${tentativa}:`,
                    erro
                );

            }


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        300
                    )
            );

        }


        return ultimaResposta;

    }


    async function inicializar() {

        console.log(
            '================================='
        );

        console.log(
            'INICIALIZAÇÃO REGISTO DE OBRAS'
        );

        console.log(
            '================================='
        );


        try {

            const {
                data: sessionData,
                error: sessionError
            } =
                await obterSessaoComRetry();


            const user =
                sessionData?.session?.user ||
                null;


            console.log(
                'Sessão obtida:',
                sessionData
            );

            console.log(
                'Erro sessão:',
                sessionError
            );


            const error =
                sessionError;


            if (error) {

                console.error(
                    'Erro ao obter sessão:',
                    error
                );

                mostrarMensagem(
                    'Erro ao verificar o utilizador: ' +
                    error.message,
                    'erro'
                );

                return;

            }


            if (!user) {

                console.warn(
                    'Não existe utilizador autenticado.'
                );

                mostrarMensagem(
                    'Não foi possível confirmar a sessão. A página vai permanecer aberta para diagnóstico.',
                    'erro'
                );

                return;

            }


            console.log(
                'UTILIZADOR AUTENTICADO:',
                user
            );


            mostrarUtilizador(
                user
            );


            await carregarObras();


        } catch (erro) {

            console.error(
                'Erro inesperado:',
                erro
            );

            mostrarMensagem(
                'Ocorreu um erro ao iniciar a página.',
                'erro'
            );

        }

    }


    /* =====================================================
       MOSTRAR UTILIZADOR
    ===================================================== */

    function mostrarUtilizador(user) {

        const elemento =
            document.getElementById(
                'user-email'
            );


        if (!elemento) {
            return;
        }


        const metadata =
            user.user_metadata || {};


        const nome =
            metadata.full_name ||
            metadata.name ||
            metadata.nome ||
            metadata.username ||
            metadata.user_name;


        const texto =
            nome ||
            user.email ||
            'Utilizador';


        elemento.textContent =
            texto;


        console.log(
            'Nome apresentado:',
            texto
        );

    }


    /* =====================================================
       CARREGAR OBRAS
    ===================================================== */

    async function carregarObras() {

        const tabela =
            document.getElementById(
                'tabela-obras'
            );

        const contador =
            document.getElementById(
                'contador-obras'
            );


        tabela.innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="loading">
                    ⏳ A carregar obras...
                </td>
            </tr>
        `;


        contador.textContent =
            'A consultar a base de dados...';


        console.log(
            'A consultar public.obras...'
        );


        const {
            data,
            error,
            status
        } =
            await supabaseClient
                .from('obras')
                .select(
                    'id, local_obra, numero_obra, empresa, concelho'
                )
                .order(
                    'id',
                    {
                        ascending: false
                    }
                );


        console.log(
            'Status Supabase:',
            status
        );

        console.log(
            'Dados recebidos:',
            data
        );

        console.log(
            'Erro:',
            error
        );


        if (error) {

            console.error(
                'ERRO AO CARREGAR OBRAS:',
                error
            );


            tabela.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="sem-resultados">
                        ❌ Erro ao carregar as obras.<br><br>
                        <small>
                            ${escaparHTML(
                                error.message
                            )}
                        </small>
                    </td>
                </tr>
            `;


            contador.textContent =
                'Erro ao consultar a tabela obras.';


            mostrarMensagem(
                'Erro ao carregar obras: ' +
                error.message,
                'erro'
            );


            return;

        }


        obras =
            data || [];


        console.log(
            'Número de obras:',
            obras.length
        );


        mostrarObras(
            obras
        );

    }


    /* =====================================================
       MOSTRAR OBRAS
    ===================================================== */

    function mostrarObras(lista) {

        const tabela =
            document.getElementById(
                'tabela-obras'
            );

        const contador =
            document.getElementById(
                'contador-obras'
            );


        contador.textContent =
            lista.length === 1
                ? '1 obra registada'
                : `${lista.length} obras registadas`;


        if (!lista.length) {

            tabela.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="sem-resultados">
                        📭 Não existem obras registadas.
                    </td>
                </tr>
            `;

            return;

        }


        tabela.innerHTML =
            lista
                .map(
                    obra => `

                        <tr>

                            <td class="numero-obra">
                                ${escaparHTML(
                                    obra.numero_obra
                                )}
                            </td>

                            <td>
                                ${escaparHTML(
                                    obra.local_obra
                                )}
                            </td>

                            <td>
                                ${escaparHTML(
                                    obra.empresa ||
                                    '-'
                                )}
                            </td>

                            <td>
                                ${escaparHTML(
                                    obra.concelho ||
                                    '-'
                                )}
                            </td>

                            <td>

                                <div class="acoes">

                                    <button
                                        type="button"
                                        class="btn btn-editar"
                                        onclick="editarObra(${obra.id})">
                                        ✏️ Editar
                                    </button>

                                    <button
                                        type="button"
                                        class="btn btn-apagar"
                                        onclick="apagarObra(${obra.id})">
                                        🗑️ Apagar
                                    </button>

                                </div>

                            </td>

                        </tr>

                    `
                )
                .join('');

    }


    /* =====================================================
       PESQUISA
    ===================================================== */

    document
        .getElementById('pesquisa')
        .addEventListener(
            'input',
            function () {

                const termo =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!termo) {

                    mostrarObras(
                        obras
                    );

                    return;

                }


                const filtradas =
                    obras.filter(
                        obra => {

                            return (

                                String(
                                    obra.numero_obra ||
                                    ''
                                )
                                .toLowerCase()
                                .includes(
                                    termo
                                )

                                ||

                                String(
                                    obra.local_obra ||
                                    ''
                                )
                                .toLowerCase()
                                .includes(
                                    termo
                                )

                                ||

                                String(
                                    obra.empresa ||
                                    ''
                                )
                                .toLowerCase()
                                .includes(
                                    termo
                                )

                                ||

                                String(
                                    obra.concelho ||
                                    ''
                                )
                                .toLowerCase()
                                .includes(
                                    termo
                                )

                            );

                        }
                    );


                mostrarObras(
                    filtradas
                );

            }
        );


    /* =====================================================
       SUBMETER FORMULÁRIO
    ===================================================== */

    document
        .getElementById('form-obra')
        .addEventListener(
            'submit',
            async function (event) {

                event.preventDefault();


                const numeroObra =
                    document
                        .getElementById(
                            'numero_obra'
                        )
                        .value
                        .trim();


                const localObra =
                    document
                        .getElementById(
                            'local_obra'
                        )
                        .value
                        .trim();


                const empresa =
                    document
                        .getElementById(
                            'empresa'
                        )
                        .value
                        .trim();


                const concelho =
                    document
                        .getElementById(
                            'concelho'
                        )
                        .value
                        .trim();


                if (!numeroObra) {

                    mostrarMensagem(
                        'Introduza o número da obra.',
                        'erro'
                    );

                    return;

                }


                if (!localObra) {

                    mostrarMensagem(
                        'Introduza o local da obra.',
                        'erro'
                    );

                    return;

                }


                const botao =
                    document.getElementById(
                        'btn-guardar'
                    );


                botao.disabled =
                    true;


                botao.textContent =
                    '⏳ A guardar...';


                try {

                    if (obraEmEdicao) {

                        await atualizarObra(
                            obraEmEdicao,
                            numeroObra,
                            localObra,
                            empresa,
                            concelho
                        );

                    } else {

                        await inserirObra(
                            numeroObra,
                            localObra,
                            empresa,
                            concelho
                        );

                    }

                } finally {

                    botao.disabled =
                        false;

                    botao.textContent =
                        obraEmEdicao
                            ? '💾 Guardar Alterações'
                            : '💾 Guardar Obra';

                }

            }
        );


    /* =====================================================
       INSERIR OBRA
    ===================================================== */

    async function inserirObra(
        numeroObra,
        localObra,
        empresa,
        concelho
    ) {

        console.log(
            'A inserir obra...'
        );


        const {
            data,
            error
        } =
            await supabaseClient
                .from('obras')
                .insert([
                    {
                        numero_obra:
                            numeroObra,

                        local_obra:
                            localObra,

                        empresa:
                            empresa || null,

                        concelho:
                            concelho || null
                    }
                ])
                .select()
                .single();


        console.log(
            'Insert data:',
            data
        );

        console.log(
            'Insert error:',
            error
        );


        if (error) {

            console.error(
                'Erro INSERT:',
                error
            );


            if (
                error.code ===
                '23505'
            ) {

                mostrarMensagem(
                    'Já existe uma obra com esse número.',
                    'erro'
                );

            } else {

                mostrarMensagem(
                    'Erro ao guardar obra: ' +
                    error.message,
                    'erro'
                );

            }

            return;

        }


        mostrarMensagem(
            'Obra registada com sucesso! ✅',
            'sucesso'
        );


        limparFormulario();


        await carregarObras();

    }


    /* =====================================================
       EDITAR OBRA
    ===================================================== */

    function editarObra(id) {

        const obra =
            obras.find(
                item =>
                    Number(item.id) ===
                    Number(id)
            );


        if (!obra) {

            mostrarMensagem(
                'Não foi possível encontrar a obra.',
                'erro'
            );

            return;

        }


        obraEmEdicao =
            obra.id;


        document.getElementById(
            'numero_obra'
        ).value =
            obra.numero_obra || '';


        document.getElementById(
            'local_obra'
        ).value =
            obra.local_obra || '';


        document.getElementById(
            'empresa'
        ).value =
            obra.empresa || '';


        document.getElementById(
            'concelho'
        ).value =
            obra.concelho || '';


        document.getElementById(
            'titulo-formulario'
        ).textContent =
            '✏️ Editar Obra';


        document.getElementById(
            'btn-guardar'
        ).textContent =
            '💾 Guardar Alterações';


        document.getElementById(
            'btn-cancelar'
        ).style.display =
            'inline-block';


        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    }


    /* =====================================================
       ATUALIZAR OBRA
    ===================================================== */

    async function atualizarObra(
        id,
        numeroObra,
        localObra,
        empresa,
        concelho
    ) {

        console.log(
            'A atualizar obra:',
            id
        );


        const {
            error
        } =
            await supabaseClient
                .from('obras')
                .update({

                    numero_obra:
                        numeroObra,

                    local_obra:
                        localObra,

                    empresa:
                        empresa || null,

                    concelho:
                        concelho || null

                })
                .eq(
                    'id',
                    id
                );


        if (error) {

            console.error(
                'Erro UPDATE:',
                error
            );


            if (
                error.code ===
                '23505'
            ) {

                mostrarMensagem(
                    'Já existe outra obra com esse número.',
                    'erro'
                );

            } else {

                mostrarMensagem(
                    'Erro ao atualizar obra: ' +
                    error.message,
                    'erro'
                );

            }

            return;

        }


        mostrarMensagem(
            'Obra atualizada com sucesso! ✅',
            'sucesso'
        );


        cancelarEdicao();


        await carregarObras();

    }


    /* =====================================================
       APAGAR OBRA
    ===================================================== */

    async function apagarObra(id) {

        const obra =
            obras.find(
                item =>
                    Number(item.id) ===
                    Number(id)
            );


        if (!obra) {

            mostrarMensagem(
                'Obra não encontrada.',
                'erro'
            );

            return;

        }


        const confirmar =
            confirm(
                `Tem a certeza que pretende apagar a obra "${obra.numero_obra}"?`
            );


        if (!confirmar) {
            return;
        }


        console.log(
            'A apagar obra:',
            id
        );


        const {
            error
        } =
            await supabaseClient
                .from('obras')
                .delete()
                .eq(
                    'id',
                    id
                );


        if (error) {

            console.error(
                'Erro DELETE:',
                error
            );


            mostrarMensagem(
                'Erro ao apagar obra: ' +
                error.message,
                'erro'
            );

            return;

        }


        mostrarMensagem(
            'Obra apagada com sucesso. 🗑️',
            'sucesso'
        );


        await carregarObras();

    }


    /* =====================================================
       NOVA OBRA
    ===================================================== */

    function novaObra() {

        obraEmEdicao =
            null;


        limparFormulario();


        document.getElementById(
            'titulo-formulario'
        ).textContent =
            '➕ Registar Nova Obra';


        document.getElementById(
            'btn-guardar'
        ).textContent =
            '💾 Guardar Obra';


        document.getElementById(
            'btn-cancelar'
        ).style.display =
            'none';


        document
            .getElementById(
                'numero_obra'
            )
            .focus();

    }


    /* =====================================================
       CANCELAR EDIÇÃO
    ===================================================== */

    function cancelarEdicao() {

        obraEmEdicao =
            null;


        limparFormulario();


        document.getElementById(
            'titulo-formulario'
        ).textContent =
            '➕ Registar Nova Obra';


        document.getElementById(
            'btn-guardar'
        ).textContent =
            '💾 Guardar Obra';


        document.getElementById(
            'btn-cancelar'
        ).style.display =
            'none';

    }


    /* =====================================================
       LIMPAR FORMULÁRIO
    ===================================================== */

    function limparFormulario() {

        document
            .getElementById(
                'form-obra'
            )
            .reset();

    }


    /* =====================================================
       VOLTAR
    ===================================================== */

    function voltarInicio() {

        window.location.href =
            'index.html';

    }


    /* =====================================================
       ESCAPAR HTML
    ===================================================== */

    function escaparHTML(valor) {

        if (
            valor === null ||
            valor === undefined
        ) {

            return '';

        }


        return String(valor)
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );

    }


    /* =====================================================
       MENSAGENS
    ===================================================== */

    function mostrarMensagem(
        texto,
        tipo = 'info'
    ) {

        const container =
            document.getElementById(
                'mensagens'
            );


        const mensagem =
            document.createElement(
                'div'
            );


        mensagem.className =
            `mensagem ${tipo}`;


        mensagem.textContent =
            texto;


        container.appendChild(
            mensagem
        );


        setTimeout(
            () => {

                mensagem.style.opacity =
                    '0';

                mensagem.style.transform =
                    'translateX(20px)';

                setTimeout(
                    () => {
                        mensagem.remove();
                    },
                    250
                );

            },
            4000
        );

    }


    /* =====================================================
       MONITORIZAÇÃO DA AUTENTICAÇÃO
    ===================================================== */

    supabaseClient.auth.onAuthStateChange(
        function (
            event,
            session
        ) {

            console.log(
                'Auth event:',
                event
            );

            console.log(
                'Auth session:',
                session
            );


            if (
                session &&
                session.user
            ) {

                mostrarUtilizador(
                    session.user
                );

            }


            /*
             * IMPORTANTE:
             *
             * Esta página NÃO redireciona
             * para index.html através
             * do listener de autenticação.
             *
             * A sessão pode estar a ser
             * restaurada pelo Supabase
             * enquanto a página é carregada.
             */

        }
    );

</script>
