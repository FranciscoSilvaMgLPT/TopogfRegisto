<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📥 Exportar Dados</title>
  <link rel="icon" type="image/jpeg" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Substituído xlsx por exceljs para suportar gráficos nativos no Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; font-family: Arial, sans-serif; color: white; padding: 30px; }
    .container { max-width: 900px; margin: auto; background: #1e293b; padding: 35px; border-radius: 18px; box-shadow: 0 0 30px rgba(0,0,0,0.4); }
    .header-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .user-info { color: #94a3b8; font-size: 0.9em; margin-bottom: 20px; }
    h1 { font-size: 34px; }
    .btn-voltar { background: #334155; color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: bold; }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .card {
      background: #334155;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .card h3 { font-size: 18px; color: #60a5fa; }
    .card .count { color: #94a3b8; font-size: 14px; }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }

    .btn-all {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: #059669;
      font-size: 16px;
    }
    .btn-all:hover { background: #047857; }

    .success { display: none; margin-top: 20px; background: #065f46; padding: 15px; border-radius: 10px; text-align: center; }

    @media (max-width: 640px) {
      body { padding: 15px; }
      .container { padding: 20px; border-radius: 14px; }
      h1 { font-size: 24px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-area">
      <h1>📥 Exportar Dados</h1>
      <a href="index.html" class="btn-voltar">⬅ Voltar</a>
    </div>

    <div class="user-info">
      Utilizador: <span id="user-display" style="color: #60a5fa;">A carregar...</span>
    </div>

    <div class="grid">
      <div class="card">
        <h3>📋 Pedidos</h3>
        <p class="count" id="countPedidos">A contar...</p>
        <button id="btnPedidos">⬇ Download Pedidos</button>
      </div>
      <div class="card">
        <h3>👣 Atividades</h3>
        <p class="count" id="countAtividades">A contar...</p>
        <button id="btnAtividades">⬇ Download Atividades</button>
      </div>
      <div class="card">
        <h3>🚨 Ocorrências</h3>
        <p class="count" id="countOcorrencias">A contar...</p>
        <button id="btnOcorrencias">⬇ Download Ocorrências</button>
      </div>
      <div class="card">
        <h3>📦 Stock</h3>
        <p class="count" id="countStock">A contar...</p>
        <button id="btnStock">⬇ Download Stock</button>
      </div>
    </div>

    <button id="btnTudo" class="btn-all">⬇ Download Completo (Dados + Folha "Dashboard" com Gráficos)</button>

    <div class="success" id="statusMsg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dunondjiqawovisnwavg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WekrBSs5JOjnJ1SGxFvmKQ_3v6AnBMs';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = async () => {
      const { data: { user }, error } = await supabaseClient.auth.getUser();
      if (error || !user) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('user-display').innerText = user.email;
        mostrarContagens();
      }
    };

    async function mostrarContagens() {
      const tabelas = [
        ['pedidos', 'countPedidos'],
        ['atividades', 'countAtividades'],
        ['ocorrencias', 'countOcorrencias'],
        ['stock', 'countStock']
      ];
      for (const [tabela, id] of tabelas) {
        const { count } = await supabaseClient
          .from(tabela)
          .select('*', { count: 'exact', head: true });
        document.getElementById(id).textContent = (count || 0) + ' registos';
      }
    }

    async function buscarTudo(tabela) {
      let tudo = [];
      let offset = 0;
      const passo = 1000;
      while (true) {
        const { data, error } = await supabaseClient
          .from(tabela)
          .select('*')
          .order('id', { ascending: true })
          .range(offset, offset + passo - 1);
        if (error) throw error;
        tudo = tudo.concat(data);
        if (data.length < passo) break;
        offset += passo;
      }
      return tudo;
    }

    // ===== FUNÇÕES DE PROCESSAMENTO DE DADOS PARA GRÁFICOS =====
    function calcularDuracaoHoras(a) {
      if (!a.data_hora_inicio || !a.data_hora_fim) return 0;
      const diffMs = new Date(a.data_hora_fim) - new Date(a.data_hora_inicio);
      return (isNaN(diffMs) || diffMs <= 0) ? 0 : diffMs / (1000 * 60 * 60);
    }

    function agruparPorMesObj(rows, campoData) {
      const cont = {};
      rows.forEach(r => {
        const d = r[campoData];
        if (!d) return;
        const mes = String(d).substring(0, 7); // "YYYY-MM"
        if (mes.length === 7) cont[mes] = (cont[mes] || 0) + 1;
      });
      return cont;
    }

    function agruparHorasPorLocal(atividades) {
      const horas = {};
      atividades.forEach(a => {
        const local = (a.local_obra || '(sem local)').toString().trim() || '(sem local)';
        horas[local] = (horas[local] || 0) + calcularDuracaoHoras(a);
      });
      return Object.entries(horas)
        .map(([local, h]) => ({ local, horas: h }))
        .sort((a, b) => b.horas - a.horas)
        .slice(0, 20);
    }

    // ===== FUNÇÃO PRINCIPAL: CRIAR EXCEL COM GRÁFICOS =====
    async function gerarExcelComGraficos() {
      const [pedidos, atividades, ocorrencias, stock, movimentos] = await Promise.all([
        buscarTudo('pedidos'),
        buscarTudo('atividades'),
        buscarTudo('ocorrencias'),
        buscarTudo('stock'),
        buscarTudo('movimentos_stock')
      ]);

      const workbook = new ExcelJS.Workbook();
      workbook.creator = 'Sistema Topogf';
      workbook.created = new Date();

      // 1. Adicionar folhas de dados brutos
      const addSheet = (name, data) => {
        const ws = workbook.addWorksheet(name);
        if (data.length === 0) {
          ws.addRow(['Sem registos']);
          return;
        }
        const headers = Object.keys(data[0]);
        ws.addRow(headers);
        ws.getRow(1).font = { bold: true };
        data.forEach(row => ws.addRow(headers.map(h => row[h])));
        ws.columns = headers.map(h => ({ header: h, key: h, width: 20 }));
      };

      addSheet('Pedidos', pedidos);
      addSheet('Atividades', atividades);
      addSheet('Ocorrencias', ocorrencias);
      addSheet('Stock', stock);
      addSheet('Movimentos', movimentos);

      // 2. Criar a folha "Dashboard" com Gráficos
      const wsDash = workbook.addWorksheet('📊 Dashboard');
      
      // --- GRÁFICO 1: Evolução Mensal ---
      wsDash.getCell('A1').value = 'EVOLUÇÃO MENSAL: PEDIDOS VS ATIVIDADES';
      wsDash.getCell('A1').font = { bold: true, size: 14, color: { argb: 'FF2563EB' } };
      
      wsDash.getCell('A3').value = 'Mês';
      wsDash.getCell('B3').value = 'Pedidos';
      wsDash.getCell('C3').value = 'Atividades';
      wsDash.getRow(3).font = { bold: true };

      const pedidosPorMes = agruparPorMesObj(pedidos, 'data_hora_pedido');
      const atividadesPorMes = agruparPorMesObj(atividades, 'data_hora_inicio');
      const todosOsMeses = [...new Set([...Object.keys(pedidosPorMes), ...Object.keys(atividadesPorMes)])].sort();

      let rowDash = 4;
      todosOsMeses.forEach(mes => {
        const [ano, mesNum] = mes.split('-');
        wsDash.getCell(`A${rowDash}`).value = `${mesNum}/${ano}`;
        wsDash.getCell(`B${rowDash}`).value = pedidosPorMes[mes] || 0;
        wsDash.getCell(`C${rowDash}`).value = atividadesPorMes[mes] || 0;
        rowDash++;
      });
      const lastRowGraf1 = rowDash - 1;

      // Adicionar Gráfico 1 (Colunas Agrupadas)
      wsDash.addChart({
        type: 'col',
        title: 'Evolução Mensal',
        series: [
          { label: 'Pedidos', values: `'📊 Dashboard'!$B$4:$B$${lastRowGraf1}`, fill: { color: { argb: 'FF3B82F6' } } },
          { label: 'Atividades', values: `'📊 Dashboard'!$C$4:$C$${lastRowGraf1}`, fill: { color: { argb: 'FF10B981' } } }
        ],
        categories: { label: 'Mês', values: `'📊 Dashboard'!$A$4:$A$${lastRowGraf1}` },
        anchor: 'E3',
        width: 800,
        height: 400
      });

      // --- GRÁFICO 2: Horas por Local (Top 20) ---
      const startRowGraf2 = lastRowGraf1 + 5;
      wsDash.getCell(`A${startRowGraf2}`).value = 'HORAS TRABALHADAS POR LOCAL/OBRA (TOP 20)';
      wsDash.getCell(`A${startRowGraf2}`).font = { bold: true, size: 14, color: { argb: 'FFA855F7' } };

      wsDash.getCell(`A${startRowGraf2 + 2}`).value = 'Local / Obra';
      wsDash.getCell(`B${startRowGraf2 + 2}`).value = 'Horas Totais';
      wsDash.getRow(startRowGraf2 + 2).font = { bold: true };

      const horasPorLocal = agruparHorasPorLocal(atividades);
      let rowDash2 = startRowGraf2 + 3;
      
      // Inverter para o gráfico de barras horizontal ficar legível (maior em cima)
      const horasInvertidas = [...horasPorLocal].reverse();
      
      horasInvertidas.forEach(item => {
        wsDash.getCell(`A${rowDash2}`).value = item.local;
        wsDash.getCell(`B${rowDash2}`).value = Math.round(item.horas * 100) / 100; // Arredondar a 2 casas
        rowDash2++;
      });
      const lastRowGraf2 = rowDash2 - 1;

      // Adicionar Gráfico 2 (Barras Horizontais)
      wsDash.addChart({
        type: 'bar',
        title: 'Horas por Local/Obra',
        series: [
          { label: 'Horas', values: `'📊 Dashboard'!$B$${startRowGraf2 + 3}:$B$${lastRowGraf2}`, fill: { color: { argb: 'FFA855F7' } } }
        ],
        categories: { label: 'Local', values: `'📊 Dashboard'!$A$${startRowGraf2 + 3}:$A$${lastRowGraf2}` },
        anchor: `E${startRowGraf2}`,
        width: 800,
        height: 500
      });

      // Ajustar larguras das colunas do Dashboard
      wsDash.getColumn('A').width = 30;
      wsDash.getColumn('B').width = 15;
      wsDash.getColumn('C').width = 15;
      wsDash.getColumn('E').width = 5; // Espaçamento
      wsDash.getColumn('F').width = 30;
      wsDash.getColumn('G').width = 15;

      // 3. Gerar e fazer download do ficheiro
      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Topogf_Relatorio_Completo_Com_Graficos_${new Date().toISOString().slice(0, 10)}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ===== FUNÇÕES DE EXPORTAÇÃO INDIVIDUAL (Rápidas, sem gráficos) =====
    function mostrarStatus(msg) {
      const el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    async function exportarTabelaSimples(tabela, btn) {
      btn.disabled = true;
      btn.innerText = 'A preparar...';
      try {
        const rows = await buscarTudo(tabela);
        if (!rows.length) {
          alert('Não existem dados na tabela ' + tabela + '.');
          return;
        }
        
        // Usando ExcelJS também aqui para manter consistência
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet(tabela.charAt(0).toUpperCase() + tabela.slice(1));
        const headers = Object.keys(rows[0]);
        ws.addRow(headers);
        ws.getRow(1).font = { bold: true };
        rows.forEach(row => ws.addRow(headers.map(h => row[h])));
        ws.columns = headers.map(h => ({ header: h, key: h, width: 20 }));

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${tabela}_${new Date().toISOString().slice(0, 10)}.xlsx`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        mostrarStatus(`✅ ${rows.length} registos de "${tabela}" exportados!`);
      } catch (err) {
        console.error('Erro ao exportar ' + tabela + ':', err);
        alert('Erro ao exportar ' + tabela + ': ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⬇ Download ' + tabela.charAt(0).toUpperCase() + tabela.slice(1);
      }
    }

    // ===== EVENT LISTENERS =====
    document.getElementById('btnPedidos').addEventListener('click', (e) => exportarTabelaSimples('pedidos', e.target));
    document.getElementById('btnAtividades').addEventListener('click', (e) => exportarTabelaSimples('atividades', e.target));
    document.getElementById('btnOcorrencias').addEventListener('click', (e) => exportarTabelaSimples('ocorrencias', e.target));
    
    document.getElementById('btnStock').addEventListener('click', async (e) => {
      e.target.disabled = true; e.target.innerText = 'A preparar...';
      try {
        const [stock, movimentos] = await Promise.all([buscarTudo('stock'), buscarTudo('movimentos_stock')]);
        const wb = new ExcelJS.Workbook();
        
        const ws1 = wb.addWorksheet('Stock');
        if(stock.length) { const h = Object.keys(stock[0]); ws1.addRow(h); ws1.getRow(1).font={bold:true}; stock.forEach(r=>ws1.addRow(h.map(k=>r[k]))); }
        
        const ws2 = wb.addWorksheet('Movimentos');
        if(movimentos.length) { const h = Object.keys(movimentos[0]); ws2.addRow(h); ws2.getRow(1).font={bold:true}; movimentos.forEach(r=>ws2.addRow(h.map(k=>r[k]))); }

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `stock_${new Date().toISOString().slice(0, 10)}.xlsx`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        mostrarStatus(`✅ Stock e movimentos exportados!`);
      } catch(err) { alert('Erro: ' + err.message); }
      finally { e.target.disabled = false; e.target.innerText = '⬇ Download Stock'; }
    });

    document.getElementById('btnTudo').addEventListener('click', async (e) => {
      e.target.disabled = true;
      e.target.innerText = '⏳ A gerar ficheiro com gráficos (pode demorar alguns segundos)...';
      try {
        await gerarExcelComGraficos();
        mostrarStatus('✅ Ficheiro completo com Dashboard e Gráficos exportado!');
      } catch (err) {
        console.error('Erro ao exportar tudo:', err);
        alert('Erro ao exportar: ' + err.message);
      } finally {
        e.target.disabled = false;
        e.target.innerText = '⬇ Download Completo (Dados + Folha "Dashboard" com Gráficos)';
      }
    });
  </script>
</body>
</html>
