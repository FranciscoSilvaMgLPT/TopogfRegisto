<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📥 Exportar Dados</title>
  <link rel="icon" type="image/jpeg" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; font-family: Arial, sans-serif; color: white; padding: 30px; }
    .container { max-width: 1100px; margin: auto; background: #1e293b; padding: 35px; border-radius: 18px; box-shadow: 0 0 30px rgba(0,0,0,0.4); }
    .header-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .user-info { color: #94a3b8; font-size: 0.9em; margin-bottom: 20px; }
    h1 { font-size: 34px; }
    .btn-voltar { background: #334155; color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: bold; }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .card {
      background: #334155;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .card h3 { font-size: 18px; color: #60a5fa; }
    .card .count { color: #94a3b8; font-size: 14px; }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }

    .btn-all {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: #059669;
      font-size: 16px;
    }
    .btn-all:hover { background: #047857; }

    .success { display: none; margin-top: 20px; background: #065f46; padding: 15px; border-radius: 10px; text-align: center; }

    @media (max-width: 640px) {
      body { padding: 15px; }
      .container { padding: 20px; border-radius: 14px; }
      h1 { font-size: 24px; }
      .grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-area">
      <h1>📥 Exportar Dados</h1>
      <a href="index.html" class="btn-voltar">⬅ Voltar</a>
    </div>

    <div class="user-info">
      Utilizador: <span id="user-display" style="color: #60a5fa;">A carregar...</span>
    </div>

    <div class="grid">
      <div class="card">
        <h3>📋 Pedidos</h3>
        <p class="count" id="countPedidos">A contar...</p>
        <button id="btnPedidos">⬇ Download Pedidos</button>
      </div>
      <div class="card">
        <h3>👣 Atividades</h3>
        <p class="count" id="countAtividades">A contar...</p>
        <button id="btnAtividades">⬇ Download Atividades</button>
      </div>
      <div class="card">
        <h3>🚨 Ocorrências</h3>
        <p class="count" id="countOcorrencias">A contar...</p>
        <button id="btnOcorrencias">⬇ Download Ocorrências</button>
      </div>
      <div class="card">
        <h3>🏗️ Obras</h3>
        <p class="count" id="countObras">A contar...</p>
        <button id="btnObras">⬇ Download Obras</button>
      </div>
      <div class="card">
        <h3>📦 Stock</h3>
        <p class="count" id="countStock">A contar...</p>
        <button id="btnStock">⬇ Download Stock</button>
      </div>
      <div class="card">
        <h3>📜 Movimentos</h3>
        <p class="count" id="countMovimentos">A contar...</p>
        <button id="btnMovimentos">⬇ Download Movimentos</button>
      </div>
    </div>

    <button id="btnTudo" class="btn-all">⬇ Download Tudo (6 tabelas + Resumo + Resumo Mensal + 1 folha por cada mês)</button>

    <div class="success" id="statusMsg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dunondjiqawovisnwavg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WekrBSs5JOjnJ1SGxFvmKQ_3v6AnBMs';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let mapaObras = {};

    // ============================================================
    // 🛡️ SANITIZAÇÃO - evita o erro "Text length must not exceed 32767"
    // ============================================================
    const LIMITE_CELULA_EXCEL = 32000;

    function truncarTexto(valor, limite) {
      if (valor === null || valor === undefined) return valor;
      const str = String(valor);
      if (str.length <= limite) return str;
      return str.substring(0, limite - 3) + '...';
    }

    const CAMPOS_LONGOS = [
      'servico', 'observacao', 'ocorrencia', 'fotos', 'anexo',
      'tipo_trabalho', 'tecnico', 'frequencia', 'via', 'requerente',
      'local_obra', 'empresa', 'concelho', 'numero_obra'
    ];

    function sanitizarLinha(linha) {
      const resultado = {};
      for (const chave in linha) {
        const valor = linha[chave];
        if (CAMPOS_LONGOS.includes(chave) && typeof valor === 'string') {
          resultado[chave] = truncarTexto(valor, LIMITE_CELULA_EXCEL);
        } else if (Array.isArray(valor)) {
          resultado[chave] = truncarTexto(valor.join(' | '), LIMITE_CELULA_EXCEL);
        } else if (typeof valor === 'object' && valor !== null) {
          resultado[chave] = truncarTexto(JSON.stringify(valor), LIMITE_CELULA_EXCEL);
        } else {
          resultado[chave] = valor;
        }
      }
      return resultado;
    }

    function sanitizarLista(lista) {
      return lista.map(sanitizarLinha);
    }

    // ============================================================
    // ✅ FIX DO BUG "concluida": em JS a string 'Não' é truthy!
    // ============================================================
    function obraEstaConcluida(o) {
      const v = o.concluida;
      if (typeof v === 'boolean') return v;
      if (typeof v === 'string') {
        const s = v.trim().toLowerCase();
        return s === 'sim' || s === 'true' || s === '1';
      }
      return !!v;
    }

    // ============================================================
    // 📅 UTILITÁRIOS MENSAIS
    // ============================================================
    function mesDe(valor) {
      if (!valor) return null;
      const m = String(valor).substring(0, 7);
      return /^\d{4}-\d{2}$/.test(m) ? m : null;
    }

    function recolherMeses(conjuntos) {
      const meses = new Set();
      conjuntos.forEach(([rows, campo]) => {
        (rows || []).forEach(r => {
          const m = mesDe(r[campo]);
          if (m) meses.add(m);
        });
      });
      return Array.from(meses).sort();
    }

    function fmtData(v) {
      if (!v) return '';
      const d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      const p = n => String(n).padStart(2, '0');
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function contarFotos(r) {
      const f = r.fotos;
      if (Array.isArray(f)) return f.length;
      if (typeof f === 'string' && f.trim()) return f.split(' | ').filter(Boolean).length;
      return 0;
    }

    function nomeFolhaSeguro(nome) {
      return String(nome).replace(/[\[\]\:\*\?\/\\]/g, '-').substring(0, 31);
    }

    // ============================================================

    window.onload = async () => {
      const { data: { user }, error } = await supabaseClient.auth.getUser();
      if (error || !user) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('user-display').innerText = user.email;
        await carregarMapaObras();
        mostrarContagens();
      }
    };

    async function carregarMapaObras() {
      const { data, error } = await supabaseClient
        .from('obras')
        .select('id, numero_obra, local_obra, empresa, concelho, concluida');
      if (!error && data) {
        data.forEach(o => { mapaObras[o.id] = o; });
      }
    }

    async function mostrarContagens() {
      const tabelas = [
        ['pedidos', 'countPedidos'],
        ['atividades', 'countAtividades'],
        ['ocorrencias', 'countOcorrencias'],
        ['obras', 'countObras'],
        ['stock', 'countStock'],
        ['movimentos_stock', 'countMovimentos']
      ];
      for (const [tabela, id] of tabelas) {
        const { count } = await supabaseClient
          .from(tabela)
          .select('*', { count: 'exact', head: true });
        document.getElementById(id).textContent = (count || 0) + ' registos';
      }
    }

    async function buscarTudo(tabela) {
      let tudo = [];
      let offset = 0;
      const passo = 1000;
      while (true) {
        const { data, error } = await supabaseClient
          .from(tabela)
          .select('*')
          .order('id', { ascending: true })
          .range(offset, offset + passo - 1);
        if (error) throw error;
        tudo = tudo.concat(data);
        if (data.length < passo) break;
        offset += passo;
      }
      return tudo;
    }

    function enriquecerComObra(rows) {
      return rows.map(r => {
        const obra = mapaObras[r.obra_id] || null;
        return {
          ...r,
          empresa: obra ? (obra.empresa || '') : '',
          numero_obra: obra ? (obra.numero_obra || '') : '',
          local_obra: obra ? (obra.local_obra || '') : '',
          concelho: obra ? (obra.concelho || '') : '',
          obra_concluida: obra ? (obraEstaConcluida(obra) ? 'Sim' : 'Não') : ''
        };
      });
    }

    function enriquecerOcorrencias(ocorrencias, atividades) {
      const mapaAtividades = {};
      atividades.forEach(a => {
        mapaAtividades[a.id] = {
          tecnico: a.tecnico || '',
          servico: a.servico || '',
          data_hora_inicio: a.data_hora_inicio || ''
        };
      });
      return ocorrencias.map(o => {
        const obra = mapaObras[o.obra_id] || null;
        const atividade = mapaAtividades[o.atividade_id] || null;
        const fotos = Array.isArray(o.fotos) ? o.fotos.join(' | ') : (o.fotos || '');
        return {
          ...o,
          fotos: fotos,
          tecnico_atividade: atividade ? atividade.tecnico : '',
          servico_atividade: atividade ? atividade.servico : '',
          data_atividade: atividade ? atividade.data_hora_inicio : '',
          empresa: obra ? (obra.empresa || '') : '',
          numero_obra: obra ? (obra.numero_obra || '') : '',
          local_obra: obra ? (obra.local_obra || '') : (o.local_obra || ''),
          concelho: obra ? (obra.concelho || '') : ''
        };
      });
    }

    function enriquecerAtividades(atividades, pedidos) {
      const mapaPedidos = {};
      pedidos.forEach(p => {
        mapaPedidos[p.id] = {
          requerente: p.requerente || '',
          estado: p.estado || ''
        };
      });
      return atividades.map(a => {
        const pedido = mapaPedidos[a.pedido_id] || null;
        const obra = mapaObras[a.obra_id] || null;
        return {
          ...a,
          pedido_requerente: pedido ? pedido.requerente : '',
          pedido_estado: pedido ? pedido.estado : '',
          empresa: obra ? (obra.empresa || '') : '',
          numero_obra: obra ? (obra.numero_obra || '') : '',
          local_obra: obra ? (obra.local_obra || '') : '',
          concelho: obra ? (obra.concelho || '') : ''
        };
      });
    }

    function obterColunas(rows) {
      const cols = [];
      rows.forEach(r => Object.keys(r).forEach(k => {
        if (!cols.includes(k)) cols.push(k);
      }));
      return cols;
    }

    function ajustarLarguras(ws, rows, cols) {
      ws['!cols'] = cols.map(c => {
        let max = c.length;
        rows.slice(0, 100).forEach(r => {
          const v = r[c];
          if (v !== null && v !== undefined) max = Math.max(max, String(v).length);
        });
        return { wch: Math.min(max + 2, 60) };
      });
    }

    function criarFolha(rows) {
      if (!rows || rows.length === 0) {
        return XLSX.utils.aoa_to_sheet([['Sem registos']]);
      }
      const dadosLimpos = sanitizarLista(rows);
      const ws = XLSX.utils.json_to_sheet(dadosLimpos);
      ajustarLarguras(ws, dadosLimpos, obterColunas(dadosLimpos));
      return ws;
    }

    function contarSeparados(rows, campo, separador) {
      const cont = {};
      rows.forEach(r => {
        (r[campo] || '').split(separador).map(v => v.trim()).filter(Boolean).forEach(v => {
          cont[v] = (cont[v] || 0) + 1;
        });
      });
      return Object.entries(cont).sort((a, b) => b[1] - a[1]);
    }

    function agruparPorCampo(rows, campo) {
      const cont = {};
      rows.forEach(r => {
        const v = (r[campo] || '(vazio)').toString().trim() || '(vazio)';
        cont[v] = (cont[v] || 0) + 1;
      });
      return Object.entries(cont).sort((a, b) => b[1] - a[1]);
    }

    function agruparPorMes(rows, campoData) {
      const cont = {};
      rows.forEach(r => {
        const d = r[campoData];
        if (!d) return;
        const mes = String(d).substring(0, 7);
        if (mes.length === 7) cont[mes] = (cont[mes] || 0) + 1;
      });
      return Object.entries(cont).sort((a, b) => a[0].localeCompare(b[0]));
    }

    function calcularDuracaoHoras(a) {
      if (!a.data_hora_inicio || !a.data_hora_fim) return 0;
      const inicio = new Date(a.data_hora_inicio);
      const fim = new Date(a.data_hora_fim);
      const diffMs = fim - inicio;
      if (isNaN(diffMs) || diffMs <= 0) return 0;
      return diffMs / (1000 * 60 * 60);
    }

    function agruparHorasPorLocal(atividades) {
      const horas = {};
      const contagem = {};
      atividades.forEach(a => {
        const local = (a.local_obra || '(sem local)').toString().trim() || '(sem local)';
        const h = calcularDuracaoHoras(a);
        horas[local] = (horas[local] || 0) + h;
        contagem[local] = (contagem[local] || 0) + 1;
      });
      return Object.entries(horas)
        .map(([local, h]) => [local, h, contagem[local], contagem[local] ? h / contagem[local] : 0])
        .sort((a, b) => b[1] - a[1]);
    }

    function agruparHorasPorLocalETecnico(atividades) {
      const porLocal = {};
      atividades.forEach(a => {
        const local = (a.local_obra || '(sem local)').toString().trim() || '(sem local)';
        const h = calcularDuracaoHoras(a);
        const tecnicos = (a.tecnico || '').split(',').map(t => t.trim()).filter(Boolean);
        if (!porLocal[local]) porLocal[local] = { total: 0, tecnicos: {} };
        porLocal[local].total += h;
        const lista = tecnicos.length ? tecnicos : ['(sem técnico)'];
        lista.forEach(t => {
          if (!porLocal[local].tecnicos[t]) porLocal[local].tecnicos[t] = { horas: 0, n: 0 };
          porLocal[local].tecnicos[t].horas += h;
          porLocal[local].tecnicos[t].n += 1;
        });
      });
      return porLocal;
    }

    function percent(num, den) {
      if (!den) return '0%';
      return (num / den * 100).toFixed(1) + '%';
    }

    function estaConcluido(p) {
      return (p.estado || '').trim().toLowerCase() === 'concluido';
    }

    // ============================================================
    // 📅 FOLHA: RESUMO MENSAL (uma linha por mês + total)
    // ============================================================
    function construirFolhaResumoMensal(pedidos, atividades, ocorrencias, movimentos) {
      pedidos = pedidos || []; atividades = atividades || [];
      ocorrencias = ocorrencias || []; movimentos = movimentos || [];
      const meses = recolherMeses([
        [pedidos, 'data_hora_pedido'],
        [atividades, 'data_hora_inicio'],
        [ocorrencias, 'data'],
        [movimentos, 'created_at']
      ]);
      const linhas = [];
      linhas.push(['RESUMO MENSAL — visão mês a mês']);
      linhas.push([]);
      linhas.push(['Mês', 'Pedidos', 'Pedidos Concluídos', 'Taxa Conclusão', 'Atividades', 'Horas Trabalhadas', 'Média Horas/Atividade', 'Ocorrências', 'Entradas Stock', 'Saídas Stock']);
      let totP = 0, totPC = 0, totA = 0, totH = 0, totO = 0, totE = 0, totS = 0;
      meses.forEach(mes => {
        const p = pedidos.filter(r => mesDe(r.data_hora_pedido) === mes);
        const pc = p.filter(estaConcluido).length;
        const a = atividades.filter(r => mesDe(r.data_hora_inicio) === mes);
        const horas = a.reduce((s, r) => s + calcularDuracaoHoras(r), 0);
        const o = ocorrencias.filter(r => mesDe(r.data) === mes);
        const mov = movimentos.filter(r => mesDe(r.created_at) === mes);
        const ent = mov.filter(m => m.tipo === 'entrada').reduce((s, m) => s + (m.quantidade || 0), 0);
        const sai = mov.filter(m => m.tipo !== 'entrada').reduce((s, m) => s + (m.quantidade || 0), 0);
        totP += p.length; totPC += pc; totA += a.length; totH += horas; totO += o.length; totE += ent; totS += sai;
        linhas.push([
          mes, p.length, pc, percent(pc, p.length), a.length,
          Number(horas.toFixed(2)), a.length ? Number((horas / a.length).toFixed(2)) : 0,
          o.length, ent, sai
        ]);
      });
      linhas.push([]);
      linhas.push(['TOTAL', totP, totPC, percent(totPC, totP), totA, Number(totH.toFixed(2)), totA ? Number((totH / totA).toFixed(2)) : 0, totO, totE, totS]);
      const ws = XLSX.utils.aoa_to_sheet(linhas);
      ws['!cols'] = [{ wch: 10 }, { wch: 10 }, { wch: 18 }, { wch: 14 }, { wch: 12 }, { wch: 16 }, { wch: 20 }, { wch: 12 }, { wch: 14 }, { wch: 14 }];
      return ws;
    }

    // ============================================================
    // 📅 FOLHA: DETALHE DE UM MÊS (pedidos, atividades, ocorrências, movimentos)
    // ============================================================
    function construirFolhaMensalDetalhada(mes, pedidos, atividades, ocorrencias, movimentos) {
      const p = (pedidos || []).filter(r => mesDe(r.data_hora_pedido) === mes)
        .sort((x, y) => String(x.data_hora_pedido || '').localeCompare(String(y.data_hora_pedido || '')));
      const a = (atividades || []).filter(r => mesDe(r.data_hora_inicio) === mes)
        .sort((x, y) => String(x.data_hora_inicio || '').localeCompare(String(y.data_hora_inicio || '')));
      const o = (ocorrencias || []).filter(r => mesDe(r.data) === mes)
        .sort((x, y) => String(x.data || '').localeCompare(String(y.data || '')));
      const mov = (movimentos || []).filter(r => mesDe(r.created_at) === mes)
        .sort((x, y) => String(x.created_at || '').localeCompare(String(y.created_at || '')));

      const horas = a.reduce((s, r) => s + calcularDuracaoHoras(r), 0);
      const pc = p.filter(estaConcluido).length;

      const linhas = [];
      linhas.push(['RELATÓRIO DO MÊS ' + mes]);
      linhas.push([]);
      linhas.push(['RESUMO DO MÊS']);
      linhas.push(['Pedidos', p.length]);
      linhas.push(['Pedidos concluídos', pc, percent(pc, p.length)]);
      linhas.push(['Atividades', a.length]);
      linhas.push(['Horas trabalhadas', Number(horas.toFixed(2))]);
      linhas.push(['Ocorrências', o.length]);
      linhas.push(['Movimentos de stock', mov.length]);
      linhas.push([]);

      linhas.push(['PEDIDOS DO MÊS']);
      if (p.length === 0) linhas.push(['(sem pedidos neste mês)']);
      else {
        linhas.push(['ID', 'Data Pedido', 'Requerente', 'Empresa', 'Nº Obra', 'Local/Obra', 'Concelho', 'Serviço', 'Tipo de Trabalho', 'Importância', 'Via', 'Frequência', 'Estado', 'Data Conclusão']);
        p.forEach(r => linhas.push([
          r.id, fmtData(r.data_hora_pedido), r.requerente || '', r.empresa || '', r.numero_obra || '', r.local_obra || '', r.concelho || '',
          truncarTexto(r.servico || '', 1000), r.tipo_trabalho || '', r.importancia || '', r.via || '', r.frequencia || '', r.estado || '', fmtData(r.data_conclusao)
        ]));
      }
      linhas.push([]);

      linhas.push(['ATIVIDADES DO MÊS']);
      if (a.length === 0) linhas.push(['(sem atividades neste mês)']);
      else {
        linhas.push(['ID', 'Início', 'Fim', 'Duração (h)', 'Técnico(s)', 'Empresa', 'Nº Obra', 'Local/Obra', 'Serviço', 'Tipo de Trabalho', 'Pedido #']);
        a.forEach(r => linhas.push([
          r.id, fmtData(r.data_hora_inicio), fmtData(r.data_hora_fim), Number(calcularDuracaoHoras(r).toFixed(2)),
          r.tecnico || '', r.empresa || '', r.numero_obra || '', r.local_obra || '',
          truncarTexto(r.servico || '', 1000), r.tipo_trabalho || '', r.pedido_id || ''
        ]));
      }
      linhas.push([]);

      linhas.push(['OCORRÊNCIAS DO MÊS']);
      if (o.length === 0) linhas.push(['(sem ocorrências neste mês)']);
      else {
        linhas.push(['ID', 'Data', 'Descrição', 'Empresa', 'Nº Obra', 'Local/Obra', 'Atividade #', 'Nº Fotos']);
        o.forEach(r => linhas.push([
          r.id, fmtData(r.data), truncarTexto(r.ocorrencia || '', 2000), r.empresa || '', r.numero_obra || '', r.local_obra || '', r.atividade_id || '', contarFotos(r)
        ]));
      }
      linhas.push([]);

      linhas.push(['MOVIMENTOS DE STOCK DO MÊS']);
      if (mov.length === 0) linhas.push(['(sem movimentos neste mês)']);
      else {
        linhas.push(['Data', 'Material', 'Tipo', 'Quantidade']);
        mov.forEach(r => linhas.push([fmtData(r.created_at), r.material || '', r.tipo || '', r.quantidade || 0]));
      }

      const ws = XLSX.utils.aoa_to_sheet(linhas);
      ws['!cols'] = [{ wch: 8 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 12 }, { wch: 10 }, { wch: 24 }, { wch: 40 }, { wch: 24 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 18 }];
      return ws;
    }

    // ============================================================
    // FOLHA: RESUMO GERAL
    // ============================================================
    function construirFolhaResumo(pedidos, atividades, ocorrencias, obras, stock, movimentos) {
      stock = stock || [];
      movimentos = movimentos || [];
      obras = obras || [];
      const linhas = [];
      const agora = new Date();
      const dataGeracao = agora.toLocaleDateString('pt-PT') + ' ' + agora.toLocaleTimeString('pt-PT').slice(0, 5);

      const concluidos = pedidos.filter(estaConcluido).length;
      const pendentes = pedidos.length - concluidos;
      const obrasConcluidas = obras.filter(obraEstaConcluida).length;
      const obrasAtivas = obras.length - obrasConcluidas;

      linhas.push(['RELATÓRIO RESUMO — gerado em ' + dataGeracao]);
      linhas.push([]);

      linhas.push(['TOTAIS GERAIS']);
      linhas.push(['Pedidos totais', pedidos.length]);
      linhas.push(['Pedidos concluídos', concluidos, percent(concluidos, pedidos.length)]);
      linhas.push(['Pedidos pendentes', pendentes, percent(pendentes, pedidos.length)]);
      linhas.push(['Atividades totais', atividades.length]);
      linhas.push(['Ocorrências totais', ocorrencias.length]);
      linhas.push(['Obras totais', obras.length]);
      linhas.push(['Obras concluídas', obrasConcluidas, percent(obrasConcluidas, obras.length)]);
      linhas.push(['Obras ativas', obrasAtivas, percent(obrasAtivas, obras.length)]);
      linhas.push(['Materiais em stock (referências)', stock.length]);
      linhas.push(['Unidades totais em stock', stock.reduce((s, i) => s + (i.stockatual || 0), 0)]);
      linhas.push(['Total de compras (unidades)', stock.reduce((s, i) => s + (i.totalcompradas || 0), 0)]);
      linhas.push(['Total de gastos (unidades)', stock.reduce((s, i) => s + (i.totalgastas || 0), 0)]);
      linhas.push(['Materiais com stock crítico/esgotado', stock.filter(i => (i.stockatual || 0) <= (i.stockminimo || 0)).length]);
      linhas.push([]);

      linhas.push(['PEDIDOS POR EMPRESA']);
      linhas.push(['Empresa', 'Total', 'Concluídos', 'Pendentes', 'Taxa conclusão']);
      const porEmpresa = {};
      pedidos.forEach(p => {
        const emp = (p.empresa || '(sem empresa)').trim();
        if (!porEmpresa[emp]) porEmpresa[emp] = { total: 0, conc: 0 };
        porEmpresa[emp].total++;
        if (estaConcluido(p)) porEmpresa[emp].conc++;
      });
      Object.entries(porEmpresa)
        .sort((a, b) => b[1].total - a[1].total)
        .forEach(([emp, v]) => linhas.push([emp, v.total, v.conc, v.total - v.conc, percent(v.conc, v.total)]));
      linhas.push([]);

      linhas.push(['PEDIDOS POR REQUERENTE (TOP 15)']);
      linhas.push(['Requerente', 'Pedidos']);
      agruparPorCampo(pedidos, 'requerente').slice(0, 15)
        .forEach(([req, n]) => linhas.push([req, n]));
      linhas.push([]);

      linhas.push(['PEDIDOS POR VIA DE COMUNICAÇÃO']);
      linhas.push(['Via', 'Pedidos', '%']);
      const porVia = agruparPorCampo(pedidos, 'via');
      porVia.forEach(([via, n]) => linhas.push([via, n, percent(n, pedidos.length)]));
      linhas.push([]);

      linhas.push(['PEDIDOS POR IMPORTÂNCIA']);
      linhas.push(['Importância', 'Pedidos', '%']);
      agruparPorCampo(pedidos, 'importancia').forEach(([u, n]) => linhas.push([u, n, percent(n, pedidos.length)]));
      linhas.push([]);

      linhas.push(['PEDIDOS POR FREQUÊNCIA']);
      linhas.push(['Frequência', 'Pedidos', '%']);
      agruparPorCampo(pedidos, 'frequencia').forEach(([f, n]) => linhas.push([f, n, percent(n, pedidos.length)]));
      linhas.push([]);

      linhas.push(['ATIVIDADES POR TÉCNICO']);
      linhas.push(['Técnico', 'Atividades']);
      contarSeparados(atividades, 'tecnico', ',').forEach(([t, n]) => linhas.push([t, n]));
      linhas.push([]);

      linhas.push(['TIPOS DE TRABALHO (PEDIDOS)']);
      linhas.push(['Tipo', 'Quantidade', '%']);
      const tiposP = contarSeparados(pedidos, 'tipo_trabalho', ';');
      const totalTiposP = tiposP.reduce((s, [, n]) => s + n, 0);
      tiposP.forEach(([t, n]) => linhas.push([t, n, percent(n, totalTiposP)]));
      linhas.push([]);

      linhas.push(['TIPOS DE TRABALHO (ATIVIDADES)']);
      linhas.push(['Tipo', 'Quantidade', '%']);
      const tiposA = contarSeparados(atividades, 'tipo_trabalho', ';');
      const totalTiposA = tiposA.reduce((s, [, n]) => s + n, 0);
      tiposA.forEach(([t, n]) => linhas.push([t, n, percent(n, totalTiposA)]));
      linhas.push([]);

      linhas.push(['OBRAS POR CONCELHO']);
      linhas.push(['Concelho', 'Total', 'Ativas', 'Concluídas']);
      const porConcelho = {};
      obras.forEach(o => {
        const c = (o.concelho || '(sem concelho)').trim();
        if (!porConcelho[c]) porConcelho[c] = { total: 0, conc: 0 };
        porConcelho[c].total++;
        if (obraEstaConcluida(o)) porConcelho[c].conc++;
      });
      Object.entries(porConcelho)
        .sort((a, b) => b[1].total - a[1].total)
        .forEach(([c, v]) => linhas.push([c, v.total, v.total - v.conc, v.conc]));
      linhas.push([]);

      linhas.push(['LOCAIS / OBRAS MAIS FREQUENTES — ATIVIDADES (TOP 15)']);
      linhas.push(['Local / Obra', 'Atividades']);
      const porLocalA = {};
      atividades.forEach(a => {
        const local = (a.local_obra || '').trim();
        if (local) porLocalA[local] = (porLocalA[local] || 0) + 1;
      });
      Object.entries(porLocalA).sort((a, b) => b[1] - a[1]).slice(0, 15)
        .forEach(([local, n]) => linhas.push([local, n]));
      linhas.push([]);

      linhas.push(['HORAS TRABALHADAS POR LOCAL / OBRA (TOP 20)']);
      linhas.push(['Local / Obra', 'Total Horas', 'Nº Atividades', 'Média Horas/Atividade']);
      const horasPorLocal = agruparHorasPorLocal(atividades);
      if (horasPorLocal.length === 0) linhas.push(['(sem registos com data de início e fim)']);
      else horasPorLocal.slice(0, 20).forEach(([local, h, n, media]) => linhas.push([local, h.toFixed(2), n, media.toFixed(2)]));
      linhas.push([]);

      linhas.push(['HORAS POR LOCAL/OBRA E TÉCNICO (TOP 15 OBRAS)']);
      linhas.push(['Local / Obra', 'Técnico', 'Total Horas', 'Nº Atividades']);
      const dadosLocalTecnico = agruparHorasPorLocalETecnico(atividades);
      const locaisOrdenadosLT = Object.entries(dadosLocalTecnico)
        .sort((a, b) => b[1].total - a[1].total).slice(0, 15);
      if (locaisOrdenadosLT.length === 0) linhas.push(['(sem registos)']);
      else {
        locaisOrdenadosLT.forEach(([local, info]) => {
          const tecnicosOrdenados = Object.entries(info.tecnicos).sort((a, b) => b[1].horas - a[1].horas);
          tecnicosOrdenados.forEach(([tec, v], idx) => {
            linhas.push([idx === 0 ? local : '', tec, v.horas.toFixed(2), v.n]);
          });
        });
      }
      linhas.push([]);

      linhas.push(['OCORRÊNCIAS POR LOCAL (TOP 15)']);
      linhas.push(['Local / Obra', 'Ocorrências']);
      const porLocalO = {};
      ocorrencias.forEach(o => {
        const local = (o.local_obra || '').trim();
        if (local) porLocalO[local] = (porLocalO[local] || 0) + 1;
      });
      const locaisOc = Object.entries(porLocalO).sort((a, b) => b[1] - a[1]);
      if (locaisOc.length === 0) linhas.push(['(sem registos)']);
      else locaisOc.slice(0, 15).forEach(([local, n]) => linhas.push([local, n]));
      linhas.push([]);

      linhas.push(['EVOLUÇÃO MENSAL — PEDIDOS']);
      linhas.push(['Mês', 'Pedidos']);
      const pedidosMes = agruparPorMes(pedidos, 'data_hora_pedido');
      if (pedidosMes.length === 0) linhas.push(['(sem registos)']);
      else pedidosMes.forEach(([mes, n]) => linhas.push([mes, n]));
      linhas.push([]);

      linhas.push(['EVOLUÇÃO MENSAL — ATIVIDADES']);
      linhas.push(['Mês', 'Atividades']);
      const ativMes = agruparPorMes(atividades, 'data_hora_inicio');
      if (ativMes.length === 0) linhas.push(['(sem registos)']);
      else ativMes.forEach(([mes, n]) => linhas.push([mes, n]));
      linhas.push([]);

      linhas.push(['EVOLUÇÃO MENSAL — OCORRÊNCIAS']);
      linhas.push(['Mês', 'Ocorrências']);
      const ocMes = agruparPorMes(ocorrencias, 'data');
      if (ocMes.length === 0) linhas.push(['(sem registos)']);
      else ocMes.forEach(([mes, n]) => linhas.push([mes, n]));
      linhas.push([]);

      linhas.push(['STOCK POR CATEGORIA']);
      linhas.push(['Categoria', 'Nº Materiais', 'Unidades em Stock', 'Total Compradas', 'Total Gastas']);
      const stockPorCategoria = {};
      stock.forEach(i => {
        const cat = (i.categoria || '(sem categoria)').trim() || '(sem categoria)';
        if (!stockPorCategoria[cat]) stockPorCategoria[cat] = { n: 0, unidades: 0, compradas: 0, gastas: 0 };
        stockPorCategoria[cat].n++;
        stockPorCategoria[cat].unidades += (i.stockatual || 0);
        stockPorCategoria[cat].compradas += (i.totalcompradas || 0);
        stockPorCategoria[cat].gastas += (i.totalgastas || 0);
      });
      if (stock.length === 0) linhas.push(['(sem registos)']);
      else Object.entries(stockPorCategoria).sort((a, b) => b[1].unidades - a[1].unidades)
        .forEach(([cat, v]) => linhas.push([cat, v.n, v.unidades, v.compradas, v.gastas]));
      linhas.push([]);

      linhas.push(['MATERIAIS COM STOCK CRÍTICO / ESGOTADO']);
      linhas.push(['Material', 'Categoria', 'Stock Atual', 'Qt. Alerta', 'Estado']);
      const criticos = stock.filter(i => (i.stockatual || 0) <= (i.stockminimo || 0));
      if (criticos.length === 0) linhas.push(['(nenhum material em estado crítico)']);
      else criticos.sort((a, b) => (a.stockatual || 0) - (b.stockatual || 0))
        .forEach(i => linhas.push([i.material, i.categoria, i.stockatual || 0, i.stockminimo || 0, (i.stockatual || 0) === 0 ? 'Esgotado' : 'Crítico']));
      linhas.push([]);

      linhas.push(['MATERIAIS MAIS GASTOS (TOP 15)']);
      linhas.push(['Material', 'Total Gastas', 'Total Compradas', 'Stock Atual']);
      const maisGastos = [...stock].filter(i => (i.totalgastas || 0) > 0).sort((a, b) => (b.totalgastas || 0) - (a.totalgastas || 0));
      if (maisGastos.length === 0) linhas.push(['(sem registos)']);
      else maisGastos.slice(0, 15).forEach(i => linhas.push([i.material, i.totalgastas || 0, i.totalcompradas || 0, i.stockatual || 0]));
      linhas.push([]);

      linhas.push(['MOVIMENTOS DE STOCK POR MÊS']);
      linhas.push(['Mês', 'Entradas (compras)', 'Saídas (gastos)']);
      const movPorMes = {};
      movimentos.forEach(m => {
        const d = m.created_at;
        if (!d) return;
        const mes = String(d).substring(0, 7);
        if (mes.length !== 7) return;
        if (!movPorMes[mes]) movPorMes[mes] = { entradas: 0, saidas: 0 };
        if (m.tipo === 'entrada') movPorMes[mes].entradas += (m.quantidade || 0);
        else movPorMes[mes].saidas += (m.quantidade || 0);
      });
      const mesesMov = Object.keys(movPorMes).sort();
      if (mesesMov.length === 0) linhas.push(['(sem registos)']);
      else mesesMov.forEach(mes => linhas.push([mes, movPorMes[mes].entradas, movPorMes[mes].saidas]));

      const ws = XLSX.utils.aoa_to_sheet(linhas);
      ws['!cols'] = [{ wch: 48 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 16 }];
      return ws;
    }

    function gerarExcel(folhas, nomeFicheiro) {
      const wb = XLSX.utils.book_new();
      folhas.forEach(f => {
        XLSX.utils.book_append_sheet(wb, criarFolha(f.rows), f.nome);
      });
      XLSX.writeFile(wb, nomeFicheiro);
    }

    function hoje() {
      return new Date().toISOString().slice(0, 10);
    }

    function mostrarStatus(msg) {
      const el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    // ===== Preparação central dos dados (usada por vários exports) =====
    async function prepararDadosEnriquecidos() {
      const [pedidos, atividades, ocorrencias, obras, stock, movimentos] = await Promise.all([
        buscarTudo('pedidos'),
        buscarTudo('atividades'),
        buscarTudo('ocorrencias'),
        buscarTudo('obras'),
        buscarTudo('stock'),
        buscarTudo('movimentos_stock')
      ]);
      return {
        pedidosR: sanitizarLista(enriquecerComObra(pedidos)),
        atividadesR: sanitizarLista(enriquecerAtividades(enriquecerComObra(atividades), pedidos)),
        ocorrenciasR: sanitizarLista(enriquecerOcorrencias(ocorrencias, atividades)),
        obrasR: sanitizarLista(obras.map(o => ({ ...o, concluida: obraEstaConcluida(o) ? 'Sim' : 'Não' }))),
        stockR: sanitizarLista(stock),
        movimentosR: sanitizarLista(movimentos)
      };
    }

    function listaDeMeses(d) {
      return recolherMeses([
        [d.pedidosR, 'data_hora_pedido'],
        [d.atividadesR, 'data_hora_inicio'],
        [d.ocorrenciasR, 'data'],
        [d.movimentosR, 'created_at']
      ]);
    }

    // ===== Downloads individuais =====
    async function exportarPedidos(btn) {
      btn.disabled = true;
      btn.innerText = 'A preparar...';
      try {
        const pedidos = await buscarTudo('pedidos');
        if (!pedidos.length) { alert('Não existem pedidos.'); return; }
        const enriquecidos = sanitizarLista(enriquecerComObra(pedidos));
        gerarExcel([{ nome: 'Pedidos', rows: enriquecidos }], `pedidos_${hoje()}.xlsx`);
        mostrarStatus(`✅ ${enriquecidos.length} pedidos exportados!`);
      } catch (err) {
        console.error(err);
        alert('Erro: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⬇ Download Pedidos';
      }
    }

    async function exportarAtividades(btn) {
      btn.disabled = true;
      btn.innerText = 'A preparar...';
      try {
        const [atividades, pedidos] = await Promise.all([
          buscarTudo('atividades'),
          buscarTudo('pedidos')
        ]);
        if (!atividades.length) { alert('Não existem atividades.'); return; }
        const enriquecidas = sanitizarLista(enriquecerAtividades(enriquecerComObra(atividades), pedidos));
        gerarExcel([{ nome: 'Atividades', rows: enriquecidas }], `atividades_${hoje()}.xlsx`);
        mostrarStatus(`✅ ${enriquecidas.length} atividades exportadas!`);
      } catch (err) {
        console.error(err);
        alert('Erro: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⬇ Download Atividades';
      }
    }

    async function exportarOcorrencias(btn) {
      btn.disabled = true;
      btn.innerText = 'A preparar...';
      try {
        const [ocorrencias, atividades] = await Promise.all([
          buscarTudo('ocorrencias'),
          buscarTudo('atividades')
        ]);
        if (!ocorrencias.length) { alert('Não existem ocorrências.'); return; }
        const enriquecidas = sanitizarLista(enriquecerOcorrencias(ocorrencias, atividades));
        gerarExcel([{ nome: 'Ocorrências', rows: enriquecidas }], `ocorrencias_${hoje()}.xlsx`);
        mostrarStatus(`✅ ${enriquecidas.length} ocorrências exportadas!`);
      } catch (err) {
        console.error(err);
        alert('Erro: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⬇ Download Ocorrências';
      }
    }

    async function exportarObras(btn) {
      btn.disabled = true;
      btn.innerText = 'A preparar...';
      try {
        const obras = await buscarTudo('obras');
        if (!obras.length) { alert('Não existem obras.'); return; }
        const formatadas = sanitizarLista(obras.map(o => ({ ...o, concluida: obraEstaConcluida(o) ? 'Sim' : 'Não' })));
        gerarExcel([{ nome: 'Obras', rows: formatadas }], `obras_${hoje()}.xlsx`);
        mostrarStatus(`✅ ${formatadas.length} obras exportadas!`);
      } catch (err) {
        console.error(err);
        alert('Erro: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⬇ Download Obras';
      }
    }

    async function exportarStock(btn) {
      btn.disabled = true;
      btn.innerText = 'A preparar...';
      try {
        const [stock, movimentos] = await Promise.all([
          buscarTudo('stock'),
          buscarTudo('movimentos_stock')
        ]);
        if (!stock.length) { alert('Não existem materiais no stock.'); return; }
        gerarExcel([
          { nome: 'Stock', rows: sanitizarLista(stock) },
          { nome: 'Movimentos', rows: sanitizarLista(movimentos) }
        ], `stock_${hoje()}.xlsx`);
        mostrarStatus(`✅ ${stock.length} materiais e ${movimentos.length} movimentos exportados!`);
      } catch (err) {
        console.error(err);
        alert('Erro: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⬇ Download Stock';
      }
    }

    async function exportarMovimentos(btn) {
      btn.disabled = true;
      btn.innerText = 'A preparar...';
      try {
        const movimentos = await buscarTudo('movimentos_stock');
        if (!movimentos.length) { alert('Não existem movimentos.'); return; }
        gerarExcel([{ nome: 'Movimentos', rows: sanitizarLista(movimentos) }], `movimentos_stock_${hoje()}.xlsx`);
        mostrarStatus(`✅ ${movimentos.length} movimentos exportados!`);
      } catch (err) {
        console.error(err);
        alert('Erro: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⬇ Download Movimentos';
      }
    }

    // ===== DOWNLOAD TUDO =====
    async function exportarTudo(btn) {
      btn.disabled = true;
      btn.innerText = 'A preparar ficheiro completo...';
      try {
        const d = await prepararDadosEnriquecidos();

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, criarFolha(d.pedidosR), 'Pedidos');
        XLSX.utils.book_append_sheet(wb, criarFolha(d.atividadesR), 'Atividades');
        XLSX.utils.book_append_sheet(wb, criarFolha(d.ocorrenciasR), 'Ocorrencias');
        XLSX.utils.book_append_sheet(wb, criarFolha(d.obrasR), 'Obras');
        XLSX.utils.book_append_sheet(wb, criarFolha(d.stockR), 'Stock');
        XLSX.utils.book_append_sheet(wb, criarFolha(d.movimentosR), 'Movimentos');
        XLSX.utils.book_append_sheet(wb, construirFolhaResumo(d.pedidosR, d.atividadesR, d.ocorrenciasR, d.obrasR, d.stockR, d.movimentosR), 'Resumo');
        XLSX.utils.book_append_sheet(wb, construirFolhaResumoMensal(d.pedidosR, d.atividadesR, d.ocorrenciasR, d.movimentosR), 'Resumo Mensal');
        listaDeMeses(d).forEach(mes => {
          XLSX.utils.book_append_sheet(wb, construirFolhaMensalDetalhada(mes, d.pedidosR, d.atividadesR, d.ocorrenciasR, d.movimentosR), nomeFolhaSeguro(mes));
        });
        XLSX.writeFile(wb, `topogf_dados_completos_${hoje()}.xlsx`);

        mostrarStatus('✅ Ficheiro completo exportado com sucesso!');
      } catch (err) {
        console.error('Erro ao exportar tudo:', err);
        alert('Erro ao exportar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⬇ Download Tudo (6 tabelas + Resumo + Resumo Mensal + 1 folha por cada mês)';
      }
    }

    document.getElementById('btnPedidos').addEventListener('click', (e) => exportarPedidos(e.target));
    document.getElementById('btnAtividades').addEventListener('click', (e) => exportarAtividades(e.target));
    document.getElementById('btnOcorrencias').addEventListener('click', (e) => exportarOcorrencias(e.target));
    document.getElementById('btnObras').addEventListener('click', (e) => exportarObras(e.target));
    document.getElementById('btnStock').addEventListener('click', (e) => exportarStock(e.target));
    document.getElementById('btnMovimentos').addEventListener('click', (e) => exportarMovimentos(e.target));
    document.getElementById('btnTudo').addEventListener('click', (e) => exportarTudo(e.target));
  </script>
