<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👣Registo de Atividade</title>
  <link rel="icon" type="image/jpeg" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; font-family: Arial, sans-serif; color: white; padding: 30px; }
    .container { max-width: 900px; margin: auto; background: #1e293b; padding: 35px; border-radius: 18px; box-shadow: 0 0 30px rgba(0,0,0,0.4); }
    .header-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .user-info { color: #94a3b8; font-size: 0.9em; margin-bottom: 20px; }
    h1 { font-size: 34px; }
    .btn-voltar { background: #334155; color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: bold; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .full { grid-column: 1 / -1; }

    label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
    input, textarea, select { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #334155; color: white; font-size: 16px; }
    input[readonly] { cursor: pointer; }
    textarea { min-height: 80px; resize: vertical; }

    .tecnico-picker { background: #334155; padding: 14px; border-radius: 10px; min-height: 50px; display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap; gap: 10px; }
    .tecnico-picker label { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 0; font-size: 15px; color: white; }
    .tecnico-picker input[type="checkbox"] { width: auto; }

    .pedido-association {
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .pedido-association h3 { color: #60a5fa; margin-bottom: 15px; font-size: 18px; }
    .pedido-select { min-height: 50px; cursor: pointer; }
    .pedido-select option { padding: 10px; background: #334155; }

    .checkbox-container {
      display: flex; align-items: center; gap: 10px;
      margin-top: 15px; padding: 15px;
      background: #334155; border-radius: 10px;
      cursor: pointer; transition: background 0.2s;
    }
    .checkbox-container:hover { background: #475569; }
    .checkbox-container input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
    .checkbox-container label { margin: 0; font-size: 15px; color: white; cursor: pointer; flex: 1; }
    .checkbox-container:has(input:disabled) { opacity: 0.5; cursor: not-allowed; }

    .ocorrencia-association {
      background: #1e293b;
      border: 2px solid #a855f7;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .ocorrencia-association h3 { color: #c084fc; margin-bottom: 15px; font-size: 18px; }

    .foto-input-direto {
      width: 100%;
      padding: 16px;
      border: 2px dashed #475569;
      border-radius: 10px;
      background: #334155;
      color: #cbd5e1;
      font-size: 15px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: block;
      margin-top: 8px;
    }
    .foto-input-direto:hover { border-color: #a855f7; background: #3b4a63; }
    
    .foto-input-direto::file-selector-button {
      background: #a855f7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      margin-right: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.2s;
    }
    .foto-input-direto::file-selector-button:hover { background: #9333ea; }

    .foto-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .foto-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid #475569;
    }
    .foto-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .foto-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      color: #f87171;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .foto-upload-status {
      margin-top: 8px;
      font-size: 13px;
      color: #94a3b8;
    }

    button { width: 100%; margin-top: 25px; padding: 16px; border: none; border-radius: 10px; background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .success { display: none; margin-top: 20px; background: #065f46; padding: 15px; border-radius: 10px; text-align: center; }

    @media (max-width: 640px) {
      body { padding: 15px; }
      .container { padding: 20px; border-radius: 14px; }
      h1 { font-size: 24px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .pedido-association, .ocorrencia-association { padding: 15px; }
      .foto-input-direto { padding: 20px 10px; }
      .foto-input-direto::file-selector-button {
        display: block;
        width: 100%;
        margin-right: 0;
        margin-bottom: 10px;
      }
    }

    /* ===== Custom Date/Time Picker ===== */
    .dt-picker-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    .dt-picker-overlay.open { display: flex; }
    .dt-picker {
      background: #1e293b;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .dt-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .dt-picker-header span {
      font-weight: bold;
      font-size: 17px;
      text-transform: capitalize;
    }
    .dt-nav {
      width: 38px;
      margin-top: 0;
      padding: 8px 0;
      background: #334155;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1;
      border: none;
      color: white;
      cursor: pointer;
    }
    .dt-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      color: #93c5fd;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .dt-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .dt-day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      background: transparent;
      color: white;
    }
    .dt-day:hover { background: #334155; }
    .dt-day.dt-empty { cursor: default; }
    .dt-day.dt-empty:hover { background: transparent; }
    .dt-day.dt-today { border: 1px solid #60a5fa; }
    .dt-day.dt-selected { background: #2563eb; font-weight: bold; }
    .dt-time {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }
    .dt-time label { margin-bottom: 0; white-space: nowrap; }
    .dt-time input {
      width: 60px;
      padding: 10px;
      text-align: center;
      font-size: 15px;
    }
    /* Esconder setas de número no Chrome/Safari mobile */
    .dt-time input[type="number"]::-webkit-inner-spin-button, 
    .dt-time input[type="number"]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    .dt-time input[type="number"] {
      -moz-appearance: textfield; /* Firefox */
    }
    .dt-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .dt-actions button {
      margin-top: 0;
      flex: 1;
      padding: 12px;
      font-size: 14px;
    }
    #dtCancel { background: #334155; }

    @media (max-width: 400px) {
      .dt-picker {
        padding: 14px;
        max-width: 100%;
      }
      .dt-day {
        font-size: 13px;
      }
      .dt-time input {
        width: 50px;
        padding: 8px;
      }
      .dt-actions button {
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-area">
      <h1>Registo de Atividade</h1>
      <a href="index.html" class="btn-voltar">⬅ Voltar</a>
    </div>

    <div class="user-info">
      Utilizador: <span id="user-display" style="color: #60a5fa;">A carregar...</span>
    </div>

    <div class="pedido-association">
      <h3>📋 Associar a Pedido (opcional)</h3>
      <label>Selecionar Pedido</label>
      <select id="selectPedido" class="pedido-select">
        <option value="">-- Nenhum pedido associado --</option>
      </select>

      <div class="checkbox-container">
        <input type="checkbox" id="checkboxConcluido" disabled>
        <label for="checkboxConcluido">✓ Marcar pedido como <strong>concluído</strong></label>
      </div>
    </div>

    <form id="formularioAtividade">

      <div class="ocorrencia-association">
        <h3>🚨 Ocorrência (opcional)</h3>
        <label>Descrição da ocorrência</label>
        <textarea id="ocorrenciaTexto" placeholder="Se algo correu mal ou houve imprevisto, descreve aqui. A ocorrência fica associada a esta atividade."></textarea>
        
        <label style="margin-top: 15px;">📷 Fotografias da Ocorrência (opcional)</label>
        <input type="file" id="inputFotosOcorrencia" class="foto-input-direto" accept="image/*" multiple>
        <div id="previewFotosOcorrencia" class="foto-preview-grid"></div>
        <div id="fotoOcorrenciaStatus" class="foto-upload-status"></div>
      </div>

      <div class="grid">
        <div class="full">
          <label>Nome do Técnico *</label>
          <div class="tecnico-picker">
            <label><input type="checkbox" name="Tecnico_Nome" value="Daniel P" class="tecnicoCheck"> Daniel P</label>
            <label><input type="checkbox" name="Tecnico_Nome" value="Francisco S" class="tecnicoCheck"> Francisco S</label>
          </div>
        </div>

        <div>
          <label>Início *</label>
          <input type="text" id="dataHoraInicioDisplay" placeholder="Selecionar data e hora" readonly required autocomplete="off">
          <input type="hidden" id="dataHoraInicio" name="data_hora_inicio">
        </div>

        <div>
          <label>Fim *</label>
          <input type="text" id="dataHoraFimDisplay" placeholder="Selecionar data e hora" readonly required autocomplete="off">
          <input type="hidden" id="dataHoraFim" name="data_hora_fim">
        </div>

        <div class="full">
          <label>Local / Obra *</label>
          <input type="text" name="Atividade_Local_Obra" id="inputLocalObra" list="lista-local-obra" autocomplete="off" required>
          <datalist id="lista-local-obra"></datalist>
        </div>

        <div>
          <label>Nº Obra</label>
          <input type="text" name="numero_obra" id="inputNumeroObra" list="lista-numero-obra" autocomplete="off">
          <datalist id="lista-numero-obra"></datalist>
        </div>

        <div class="full">
          <label>Serviço realizado *</label>
          <textarea name="Atividade_Servico" required></textarea>
        </div>

        <div class="full">
          <label>Tipo de Trabalho *</label>
          <div class="tecnico-picker">
            <label><input type="checkbox" name="tipo_trabalho" value="Lev. Topográfico" class="tipoTrabalhoCheck"> Lev. Topográfico</label>
            <label><input type="checkbox" name="tipo_trabalho" value="Monitorização" class="tipoTrabalhoCheck"> Monitorização</label>
            <label><input type="checkbox" name="tipo_trabalho" value="Implantação" class="tipoTrabalhoCheck"> Implantação</label>
            <label><input type="checkbox" name="tipo_trabalho" value="Gabinete / Estudos" class="tipoTrabalhoCheck"> Gabinete / Estudos</label>
          </div>
        </div>

        <div class="full">
          <label>Anexar Foto (da Atividade)</label>
          <input type="file" id="fotoAnexo" name="anexo" accept="image/*">
        </div>
      </div>

      <button type="submit" id="btnEnviar">Gravar Atividade</button>
    </form>

    <div class="success" id="successMessage">✅ Atividade guardada com sucesso!</div>
  </div>

  <!-- Popup do calendário personalizado -->
  <div class="dt-picker-overlay" id="dtPickerOverlay">
    <div class="dt-picker">
      <div class="dt-picker-header">
        <button type="button" class="dt-nav" id="dtPrevMonth">‹</button>
        <span id="dtMonthLabel"></span>
        <button type="button" class="dt-nav" id="dtNextMonth">›</button>
      </div>
      <div class="dt-weekdays">
        <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
      </div>
      <div class="dt-days" id="dtDays"></div>
      <div class="dt-time">
        <label>Hora:</label>
        <input type="number" inputmode="numeric" id="dtHour" min="0" max="23" value="00">
        <span>:</span>
        <input type="number" inputmode="numeric" id="dtMinute" min="0" max="59" value="00">
      </div>
      <div class="dt-actions">
        <button type="button" id="dtCancel">Cancelar</button>
        <button type="button" id="dtConfirm">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dunondjiqawovisnwavg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WekrBSs5JOjnJ1SGxFvmKQ_3v6AnBMs';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let ficheirosOcorrencia = [];
    const inputFotosOcorrencia = document.getElementById('inputFotosOcorrencia');
    const previewFotosOcorrencia = document.getElementById('previewFotosOcorrencia');
    const fotoOcorrenciaStatus = document.getElementById('fotoOcorrenciaStatus');

    inputFotosOcorrencia.addEventListener('change', (e) => {
      const novosFicheiros = Array.from(e.target.files || []);
      ficheirosOcorrencia = ficheirosOcorrencia.concat(novosFicheiros);
      renderizarPreviewsOcorrencia();
      e.target.value = ''; 
    });

    function renderizarPreviewsOcorrencia() {
      previewFotosOcorrencia.innerHTML = '';
      ficheirosOcorrencia.forEach((file, index) => {
        const url = URL.createObjectURL(file);
        const thumb = document.createElement('div');
        thumb.className = 'foto-thumb';

        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Fotografia da ocorrência';

        const btnRemover = document.createElement('button');
        btnRemover.type = 'button';
        btnRemover.className = 'foto-remove';
        btnRemover.textContent = '✕';
        btnRemover.addEventListener('click', () => {
          ficheirosOcorrencia.splice(index, 1);
          renderizarPreviewsOcorrencia();
        });

        thumb.appendChild(img);
        thumb.appendChild(btnRemover);
        previewFotosOcorrencia.appendChild(thumb);
      });
    }

    function converterFicheiroParaBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function converterTodasFotosParaBase64() {
      const base64Array = [];
      for (let i = 0; i < ficheirosOcorrencia.length; i++) {
        const file = ficheirosOcorrencia[i];
        fotoOcorrenciaStatus.textContent = `A processar fotografia ${i + 1} de ${ficheirosOcorrencia.length}...`;
        try {
          const base64 = await converterFicheiroParaBase64(file);
          base64Array.push(base64);
        } catch (err) {
          console.error('Erro ao converter foto:', err);
        }
      }
      fotoOcorrenciaStatus.textContent = '';
      return base64Array;
    }

    async function carregarPedidosPendentes() {
      const selectPedido = document.getElementById('selectPedido');
      selectPedido.innerHTML = '<option value="">-- Nenhum pedido associado --</option>';

      try {
        const { data: pedidos, error } = await supabaseClient
          .from('pedidos')
          .select('id, requerente, empresa, servico, local_obra, numero_obra, tipo_trabalho, data_hora_pedido')
          .is('data_conclusao', null)
          .eq('estado', 'Pendente')
          .order('data_hora_pedido', { ascending: false });

        if (error) throw error;

        if (pedidos && pedidos.length > 0) {
          pedidos.forEach(pedido => {
            const option = document.createElement('option');
            option.value = pedido.id;
            option.dataset.localObra = pedido.local_obra || '';
            option.dataset.numeroObra = pedido.numero_obra || '';
            
            const requerente = pedido.requerente || 'Sem requerente';
            const empresa = pedido.empresa || '';
            const servicoCurto = (pedido.servico || '').substring(0, 40) + ((pedido.servico || '').length > 40 ? '...' : '');
            const localObra = pedido.local_obra || 'Sem local';
            const tipoTrabalho = pedido.tipo_trabalho || 'Sem tipo';
            
            option.textContent = `${requerente} (${empresa}) - ${servicoCurto} (${localObra}) - ${tipoTrabalho}`;
            selectPedido.appendChild(option);
          });
        }
      } catch (err) {
        console.error("Erro ao carregar pedidos:", err);
      }
    }

    const selectPedido = document.getElementById('selectPedido');
    const checkboxConcluido = document.getElementById('checkboxConcluido');

    selectPedido.addEventListener('change', () => {
      if (selectPedido.value) {
        checkboxConcluido.disabled = false;
        const selectedOption = selectPedido.options[selectPedido.selectedIndex];
        if (selectedOption.dataset.localObra) document.getElementById('inputLocalObra').value = selectedOption.dataset.localObra;
        if (selectedOption.dataset.numeroObra) document.getElementById('inputNumeroObra').value = selectedOption.dataset.numeroObra;
      } else {
        checkboxConcluido.disabled = true;
        checkboxConcluido.checked = false;
      }
    });

    async function preSelecionarPedidoPorUrl() {
      const params = new URLSearchParams(window.location.search);
      const pedidoId = params.get('pedido');
      if (!pedidoId) return;

      const select = document.getElementById('selectPedido');
      if (select.querySelector('option[value="' + pedidoId + '"]')) {
        select.value = pedidoId;
        select.dispatchEvent(new Event('change'));
      }
    }

    let mapaLocalParaObra = {};
    let mapaObraParaLocal = {};

    async function carregarHistoricoLocais() {
      try {
        const [{ data: atividadesData }, { data: pedidosData }] = await Promise.all([
          supabaseClient.from('atividades').select('local_obra, numero_obra').order('id', { ascending: false }),
          supabaseClient.from('pedidos').select('local_obra, numero_obra').order('id', { ascending: false })
        ]);

        const combos = [...(atividadesData || []), ...(pedidosData || [])];
        const locaisSet = new Set();
        const obrasSet = new Set();

        combos.forEach(item => {
          const local = (item.local_obra || '').trim();
          const obra = (item.numero_obra || '').trim();
          if (local) {
            locaisSet.add(local);
            if (obra && !(local in mapaLocalParaObra)) mapaLocalParaObra[local] = obra;
          }
          if (obra) {
            obrasSet.add(obra);
            if (local && !(obra in mapaObraParaLocal)) mapaObraParaLocal[obra] = local;
          }
        });

        const datalistLocal = document.getElementById('lista-local-obra');
        locaisSet.forEach(local => {
          const opt = document.createElement('option');
          opt.value = local;
          datalistLocal.appendChild(opt);
        });

        const datalistObra = document.getElementById('lista-numero-obra');
        obrasSet.forEach(obra => {
          const opt = document.createElement('option');
          opt.value = obra;
          datalistObra.appendChild(opt);
        });
      } catch (err) {
        console.error("Erro ao carregar histórico:", err);
      }
    }

    document.getElementById('inputLocalObra').addEventListener('input', (e) => {
      const valor = e.target.value.trim();
      if (mapaLocalParaObra[valor]) document.getElementById('inputNumeroObra').value = mapaLocalParaObra[valor];
    });

    document.getElementById('inputNumeroObra').addEventListener('input', (e) => {
      const valor = e.target.value.trim();
      if (mapaObraParaLocal[valor]) document.getElementById('inputLocalObra').value = mapaObraParaLocal[valor];
    });

    // ===== Utilitários de data e Calendário Personalizado =====
    function pad2(n) { return String(n).padStart(2, '0'); }

    function toIsoLocal(date) {
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}T${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    const nomesDiaSemana = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
    function toDisplayFormat(date) {
      const diaSemana = nomesDiaSemana[date.getDay()];
      return `${diaSemana}, ${pad2(date.getDate())}/${pad2(date.getMonth() + 1)}/${date.getFullYear()} ${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    function definirDatasAtuais() {
      const now = new Date();
      const fim = new Date(now.getTime() + 60 * 60 * 1000); // +1 hora para o fim por defeito
      
      document.getElementById("dataHoraInicio").value = toIsoLocal(now);
      document.getElementById("dataHoraInicioDisplay").value = toDisplayFormat(now);
      
      document.getElementById("dataHoraFim").value = toIsoLocal(fim);
      document.getElementById("dataHoraFimDisplay").value = toDisplayFormat(fim);
    }

    const overlay = document.getElementById('dtPickerOverlay');
    const monthLabel = document.getElementById('dtMonthLabel');
    const daysGrid = document.getElementById('dtDays');
    const hourInput = document.getElementById('dtHour');
    const minuteInput = document.getElementById('dtMinute');
    const btnPrevMonth = document.getElementById('dtPrevMonth');
    const btnNextMonth = document.getElementById('dtNextMonth');
    const btnCancel = document.getElementById('dtCancel');
    const btnConfirm = document.getElementById('dtConfirm');

    const nomesMes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

    let activeHiddenInput = null;
    let activeDisplayInput = null;
    let viewYear, viewMonth;
    let selectedDate = null;

    function parseCurrentValue(hiddenInput) {
      const val = hiddenInput.value;
      if (!val) return null;
      const [datePart, timePart] = val.split('T');
      const [y, m, d] = datePart.split('-').map(Number);
      const [hh, mm] = (timePart || '00:00').split(':').map(Number);
      return new Date(y, m - 1, d, hh, mm);
    }

    function renderCalendar() {
      monthLabel.textContent = `${nomesMes[viewMonth]} de ${viewYear}`;
      daysGrid.innerHTML = '';

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
      const today = new Date();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'dt-day dt-empty';
        daysGrid.appendChild(empty);
      }

      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement('div');
        cell.className = 'dt-day';
        cell.textContent = d;

        const isToday = today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === d;
        if (isToday) cell.classList.add('dt-today');

        if (selectedDate && selectedDate.getFullYear() === viewYear && selectedDate.getMonth() === viewMonth && selectedDate.getDate() === d) {
          cell.classList.add('dt-selected');
        }

        cell.addEventListener('click', () => {
          selectedDate = new Date(viewYear, viewMonth, d, Number(hourInput.value) || 0, Number(minuteInput.value) || 0);
          renderCalendar();
        });

        daysGrid.appendChild(cell);
      }
    }

    function openPicker(hiddenInput, displayInput) {
      activeHiddenInput = hiddenInput;
      activeDisplayInput = displayInput;

      const current = parseCurrentValue(hiddenInput) || new Date();
      selectedDate = parseCurrentValue(hiddenInput);
      viewYear = current.getFullYear();
      viewMonth = current.getMonth();
      hourInput.value = pad2(current.getHours());
      minuteInput.value = pad2(current.getMinutes());

      renderCalendar();
      overlay.classList.add('open');
    }

    function closePicker() {
      overlay.classList.remove('open');
      activeHiddenInput = null;
      activeDisplayInput = null;
    }

    btnPrevMonth.addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderCalendar();
    });

    btnNextMonth.addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderCalendar();
    });

    [hourInput, minuteInput].forEach(inp => {
      inp.addEventListener('change', () => {
        let val = Number(inp.value);
        const max = inp === hourInput ? 23 : 59;
        if (isNaN(val) || val < 0) val = 0;
        if (val > max) val = max;
        inp.value = pad2(val);
      });
    });

    btnCancel.addEventListener('click', closePicker);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closePicker();
    });

    btnConfirm.addEventListener('click', () => {
      if (!activeHiddenInput) { closePicker(); return; }

      const baseDate = selectedDate || new Date(viewYear, viewMonth, 1);
      const finalDate = new Date(
        baseDate.getFullYear(),
        baseDate.getMonth(),
        baseDate.getDate(),
        Number(hourInput.value) || 0,
        Number(minuteInput.value) || 0
      );

      activeHiddenInput.value = toIsoLocal(finalDate);
      activeDisplayInput.value = toDisplayFormat(finalDate);
      closePicker();
    });

    const dataHoraInicioDisplay = document.getElementById('dataHoraInicioDisplay');
    const dataHoraInicio = document.getElementById('dataHoraInicio');
    const dataHoraFimDisplay = document.getElementById('dataHoraFimDisplay');
    const dataHoraFim = document.getElementById('dataHoraFim');

    dataHoraInicioDisplay.addEventListener('click', () => openPicker(dataHoraInicio, dataHoraInicioDisplay));
    dataHoraFimDisplay.addEventListener('click', () => openPicker(dataHoraFim, dataHoraFimDisplay));

    // ===== Submissão do Formulário =====
    const form = document.getElementById("formularioAtividade");
    const btnEnviar = document.getElementById("btnEnviar");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const tiposSelecionados = Array.from(document.querySelectorAll('.tipoTrabalhoCheck:checked')).map(cb => cb.value);
      if (tiposSelecionados.length === 0) {
        alert("Por favor, selecione pelo menos um Tipo de Trabalho.");
        return;
      }

      btnEnviar.disabled = true;
      btnEnviar.innerText = "A processar...";

      let imageUrl = null;
      const fileInput = document.getElementById("fotoAnexo");
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;
        
        const { error: uploadError } = await supabaseClient.storage.from('anexos').upload(fileName, file);
        if (uploadError) {
          alert("Erro ao carregar a imagem da atividade: " + uploadError.message);
          btnEnviar.disabled = false;
          btnEnviar.innerText = "Gravar Atividade";
          return;
        }
        const { data: publicUrlData } = supabaseClient.storage.from('anexos').getPublicUrl(fileName);
        imageUrl = publicUrlData.publicUrl;
      }

      const tecnicosSelecionados = Array.from(document.querySelectorAll('.tecnicoCheck:checked')).map(cb => cb.value);
      
      const dadosParaEnviar = {
        tecnico: tecnicosSelecionados.join(', '),
        data_hora_inicio: document.getElementById("dataHoraInicio").value,
        data_hora_fim: document.getElementById("dataHoraFim").value,
        local_obra: form.Atividade_Local_Obra.value,
        numero_obra: form.numero_obra.value,
        servico: form.Atividade_Servico.value,
        tipo_trabalho: tiposSelecionados.join(';'),
        anexo: imageUrl
      };

      const pedidoId = selectPedido.value;
      if (pedidoId) dadosParaEnviar.pedido_id = parseInt(pedidoId);

      const { data: dataInserida, error } = await supabaseClient.from('atividades').insert([dadosParaEnviar]).select();
      if (error) {
        alert("Erro ao gravar atividade: " + error.message);
        btnEnviar.disabled = false;
        btnEnviar.innerText = "Gravar Atividade";
        return;
      }

      const novaAtividadeId = dataInserida && dataInserida[0] ? dataInserida[0].id : null;

      if (pedidoId && checkboxConcluido.checked) {
        await supabaseClient.from('pedidos').update({ data_conclusao: new Date().toISOString(), estado: 'Concluido' }).eq('id', pedidoId);
      }

      const textoOcorrencia = document.getElementById('ocorrenciaTexto').value.trim();
      if ((textoOcorrencia || ficheirosOcorrencia.length > 0) && novaAtividadeId) {
        btnEnviar.innerText = "A processar ocorrência...";

        let fotosBase64 = [];
        if (ficheirosOcorrencia.length > 0) {
          btnEnviar.innerText = "A converter fotos...";
          fotosBase64 = await converterTodasFotosParaBase64();
        }

        const { data: dataOcorrencia, error: errOcorrenciaInsert } = await supabaseClient
          .from('ocorrencias')
          .insert([{
            data: document.getElementById("dataHoraInicio").value,
            ocorrencia: textoOcorrencia,
            local_obra: form.Atividade_Local_Obra.value,
            numero_obra: form.numero_obra.value,
            atividade_id: novaAtividadeId,
            fotos: fotosBase64
          }])
          .select();

        if (errOcorrenciaInsert) {
          console.error("Erro ao criar ocorrência:", errOcorrenciaInsert);
          alert("Erro ao criar ocorrência: " + errOcorrenciaInsert.message);
        } else {
          console.log("✅ Ocorrência criada com " + fotosBase64.length + " foto(s) na coluna 'fotos'");
        }
      }

      document.getElementById("successMessage").style.display = "block";
      form.reset();
      selectPedido.value = "";
      checkboxConcluido.checked = false;
      checkboxConcluido.disabled = true;
      
      ficheirosOcorrencia = [];
      renderizarPreviewsOcorrencia();
      fotoOcorrenciaStatus.textContent = '';
      
      definirDatasAtuais();
      carregarPedidosPendentes();

      setTimeout(() => {
        document.getElementById("successMessage").style.display = "none";
      }, 5000);

      btnEnviar.disabled = false;
      btnEnviar.innerText = "Gravar Atividade";
    });

    window.onload = async () => {
      const { data: { user }, error } = await supabaseClient.auth.getUser();
      if (error || !user) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('user-display').innerText = user.email;
        definirDatasAtuais();
        carregarHistoricoLocais();
        await carregarPedidosPendentes();
        preSelecionarPedidoPorUrl();
      }
    };
  </script>
</body>
</html>
